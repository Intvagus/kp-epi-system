services:
  - type: web
    name: kp-epi-generator
    runtime: docker
    # Free tier costs nothing but spins the service down after 15 min of
    # inactivity (next request takes ~30-60s to wake it back up) and has
    # 512MB RAM, which may be tight running Chromium + pandas on a large
    # file. If that's a problem in practice, change this to "starter"
    # (~$7/month, always-on, more RAM) in the Render dashboard -- no code
    # change needed either way.
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional password protection: set both to enable HTTP Basic Auth on
      # every route except /healthz. `sync: false` means Render prompts for
      # the value in its dashboard instead of storing it in this file --
      # never commit the actual username/password here. Leave both unset
      # (or blank) to run without a login, same as before.
      - key: EPI_AUTH_USERNAME
        sync: false
      - key: EPI_AUTH_PASSWORD
        sync: false
