  // ---- PPT export: same "whatever is currently on screen" principle as
  // Download PDF above, just as a .pptx instead of a print-to-PDF -- one
  // slide per visible .card in the active tab, built from the same live DOM
  // (real KPI numbers, table rows, and rendered chart/map images), never a
  // separate re-fetch or recalculation of the data. Charts are pulled from
  // the same Chart.js instances the page already rendered (chart.
  // toBase64Image()); maps are inline SVG, so they're rasterized to PNG via
  // an offscreen canvas first, since PptxGenJS embeds images, not markup. ----
  function svgToPngDataUrl(svgEl, scale) {
    return new Promise(function (resolve) {
      var vb = svgEl.viewBox && svgEl.viewBox.baseVal;
      var w = (vb && vb.width) || svgEl.clientWidth || 640;
      var h = (vb && vb.height) || svgEl.clientHeight || 520;
      var clone = svgEl.cloneNode(true);
      clone.setAttribute("width", w);
      clone.setAttribute("height", h);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      var xml = new XMLSerializer().serializeToString(clone);
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = w * scale; canvas.height = h * scale;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve({ url: canvas.toDataURL("image/png"), w: w, h: h });
      };
      img.onerror = function () { resolve(null); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
    });
  }

  function findChartForCanvas(canvasEl) {
    var found = null;
    Object.keys(charts).forEach(function (k) { if (charts[k] && charts[k].canvas === canvasEl) found = charts[k]; });
    return found;
  }

  function cardTitleText(card) {
    var h = card.querySelector("h2, h3");
    if (h) return h.textContent.trim();
    // A couple of tables/KPI rows are preceded by a heading sitting outside
    // their .card wrapper -- either a standalone <h2>/<h3> sibling, or (e.g.
    // the RCA/Supervisory Checklist section intros) a sibling
    // <div class="section-heading"> that itself contains the <h2>.
    var prev = card.previousElementSibling;
    if (prev) {
      if (/^H[23]$/.test(prev.tagName)) return prev.textContent.trim();
      var prevHeading = prev.querySelector("h2, h3");
      if (prevHeading) return prevHeading.textContent.trim();
    }
    return "Section";
  }

  function exportActiveTabToPptx() {
    var btn = document.getElementById("export-ppt-btn");
    btn.disabled = true;
    var origLabel = btn.textContent;
    btn.textContent = "Generating PPT…";

    var activeTabBtn = document.querySelector("nav.tabs button.active");
    var tabLabel = activeTabBtn ? activeTabBtn.textContent.trim() : "KP EPI Dashboard";
    var panel = document.querySelector(".tab-panel.active");
    var svgEls = Array.prototype.slice.call(panel.querySelectorAll("svg"));

    Promise.all(svgEls.map(function (svg) { return svgToPngDataUrl(svg, 2).then(function (r) { return { svg: svg, img: r }; }); }))
      .then(function (svgResults) {
        var svgImageFor = function (svg) {
          for (var i = 0; i < svgResults.length; i++) { if (svgResults[i].svg === svg) return svgResults[i].img; }
          return null;
        };

        var pptx = new PptxGenJS();
        pptx.defineLayout({ name: "EPI", width: 13.33, height: 7.5 });
        pptx.layout = "EPI";

        var title = pptx.addSlide();
        title.background = { color: "1a3a7a" };
        title.addText("KP EPI Dashboard", { x: 0.6, y: 2.7, w: 12.1, h: 1, fontSize: 32, bold: true, color: "FFFFFF" });
        title.addText(tabLabel, { x: 0.6, y: 3.7, w: 12.1, h: 0.6, fontSize: 20, color: "CDD6EE" });
        title.addText("Directorate General Health Services, Khyber Pakhtunkhwa — Expanded Programme on Immunization  |  " +
          new Date().toLocaleDateString(), { x: 0.6, y: 4.3, w: 12.1, h: 0.4, fontSize: 11, color: "9AA8CC" });

        // Top-level cards only -- a couple of sections (e.g. the District/
        // Tehsil/UC Explorer) nest an inner .card for styling, which would
        // otherwise produce a second, title-less slide for the same table.
        var topLevelCards = Array.prototype.filter.call(panel.querySelectorAll(".card"), function (card) {
          if (card.parentElement.closest(".card")) return false;
          // A pure filter-controls card (District/Theme selects, Reset
          // button) has nothing worth a slide of its own -- same content
          // Download PDF already hides via its own print stylesheet.
          var hasContent = card.querySelector("h2, h3, .kpi-card, canvas, svg, table, .insight-box, .placeholder-card");
          return !!hasContent;
        });
        topLevelCards.forEach(function (card) {
          var slide = pptx.addSlide();
          slide.addText(cardTitleText(card), { x: 0.4, y: 0.25, w: 12.5, h: 0.5, fontSize: 20, bold: true, color: "1a3a7a" });
          var cursorY = 0.9;

          var placeholder = card.querySelector(".placeholder-card");
          if (placeholder) {
            slide.addText(placeholder.textContent.trim(), { x: 0.6, y: 2.5, w: 12.1, h: 1.5, fontSize: 14, color: "666666", align: "center", italic: true });
            return;
          }

          var kpis = card.querySelectorAll(":scope > .grid.kpi-row > .kpi-card, :scope > .kpi-card");
          if (kpis.length) {
            var kpiRows = [[]];
            kpis.forEach(function (k) {
              var label = k.querySelector(".label"); var value = k.querySelector(".value");
              if (kpiRows[kpiRows.length - 1].length >= 5) kpiRows.push([]);
              kpiRows[kpiRows.length - 1].push({
                text: (value ? value.textContent.trim() : "") + "\n" + (label ? label.textContent.trim() : ""),
                options: { fontSize: 12, align: "center", valign: "middle" },
              });
            });
            kpiRows.forEach(function (row) {
              while (row.length < kpiRows[0].length && row.length < 5) row.push({ text: "" });
            });
            slide.addTable(kpiRows, { x: 0.4, y: cursorY, w: 12.5, h: 0.35 * kpiRows.length, fontFace: "Arial", border: { type: "none" }, fill: { color: "F4F6FB" } });
            cursorY += 0.35 * kpiRows.length + 0.15;
          }

          var media = card.querySelector("canvas, svg");
          if (media) {
            var img = media.tagName.toLowerCase() === "canvas"
              ? (function () { var c = findChartForCanvas(media); return c ? { url: c.toBase64Image(), w: media.width, h: media.height } : null; })()
              : svgImageFor(media);
            if (img && img.url) {
              var maxW = 11.5, maxH = 7.15 - cursorY - 0.5;
              var ratio = img.w / img.h;
              var w = maxW, h = w / ratio;
              if (h > maxH) { h = maxH; w = h * ratio; }
              slide.addImage({ data: img.url, x: (13.33 - w) / 2, y: cursorY, w: w, h: h });
              cursorY += h + 0.1;
            }
          } else {
            var table = card.querySelector("table");
            if (table) {
              var rows = Array.prototype.slice.call(table.querySelectorAll("tr")).slice(0, 25);
              var tableData = rows.map(function (tr) {
                return Array.prototype.slice.call(tr.querySelectorAll("th, td")).map(function (cell) {
                  return { text: cell.textContent.trim(), options: { fontSize: 9, bold: cell.tagName === "TH" } };
                });
              });
              if (tableData.length) {
                slide.addTable(tableData, { x: 0.4, y: cursorY, w: 12.5, autoPage: false, fontFace: "Arial", border: { type: "solid", color: "DDDDDD", pt: 0.5 } });
                cursorY += Math.min(rows.length * 0.28 + 0.15, 4.5);
                if (table.querySelectorAll("tr").length > 25) {
                  slide.addText("Showing first 25 of " + table.querySelectorAll("tr").length + " rows -- see the full dashboard for the complete table.",
                    { x: 0.4, y: 7.0, w: 12.5, h: 0.3, fontSize: 9, italic: true, color: "888888" });
                }
              }
            }
          }

          // A card's substance is sometimes a plain <ul> (bullet findings,
          // gaps, contribution notes) or a grid of small narrative cards
          // (e.g. WHO District-Level Highlights) rather than a chart or
          // <table> -- those were previously dropped entirely, producing a
          // slide with only a title. Render whatever of these is present,
          // stacked below any chart/table already placed above.
          var highlightGrid = card.querySelector(".district-highlight-grid");
          if (highlightGrid) {
            var hCards = Array.prototype.slice.call(highlightGrid.children);
            var hRows = hCards.map(function (hc) {
              var h4 = hc.querySelector("h4"); var p = hc.querySelector("p");
              return [
                { text: h4 ? h4.textContent.trim() : "", options: { fontSize: 10, bold: true, color: "1a3a7a" } },
                { text: p ? p.textContent.trim() : "", options: { fontSize: 10 } },
              ];
            });
            if (hRows.length) {
              slide.addTable(hRows, {
                x: 0.4, y: cursorY, w: 12.5, autoPage: false, fontFace: "Arial", colW: [2.6, 9.9],
                border: { type: "solid", color: "DDDDDD", pt: 0.5 }, valign: "top",
              });
              cursorY += Math.min(hRows.length * 0.55 + 0.15, 4.5);
            }
          }

          var lists = Array.prototype.slice.call(card.querySelectorAll("ul"));
          lists.forEach(function (ul) {
            var items = Array.prototype.map.call(ul.querySelectorAll("li"), function (li) {
              return { text: li.textContent.trim(), options: { bullet: { code: "2022" }, fontSize: 11, breakLine: true } };
            });
            if (!items.length) return;
            var h = Math.min(items.length * 0.3 + 0.1, 6.7 - cursorY);
            if (h <= 0) return;
            slide.addText(items, { x: 0.4, y: cursorY, w: 12.5, h: h, fontSize: 11, color: "333333", valign: "top" });
            cursorY += h + 0.15;
          });

          // Fallback: a card whose only body content is narrative paragraph
          // text (e.g. the Management Message card) -- gated on cursorY
          // still being at its untouched starting value, i.e. nothing above
          // (KPIs, chart/map, table, highlight grid, list) put anything on
          // the slide yet, so an already-populated slide is never cluttered
          // with a duplicate of a table caption or section note.
          if (cursorY === 0.9) {
            var paras = Array.prototype.filter.call(card.querySelectorAll("p"), function (p) {
              return !p.closest(".insight-box") && p.textContent.trim();
            });
            if (paras.length) {
              var paraText = paras.map(function (p) { return p.textContent.trim(); }).join("\n\n");
              var ph = Math.min(paras.length * 0.5 + 0.5, 6.7 - cursorY);
              slide.addText(paraText, { x: 0.4, y: cursorY, w: 12.5, h: Math.max(ph, 0.4), fontSize: 12, color: "333333", valign: "top" });
              cursorY += ph + 0.15;
            }
          }

          var insight = card.querySelector(".insight-box");
          if (insight) {
            slide.addText(insight.textContent.trim(), { x: 0.4, y: 6.75, w: 12.5, h: 0.65, fontSize: 10, italic: true, color: "444444" });
          }
        });

        return pptx.writeFile({ fileName: "KP_EPI_Dashboard_" + tabLabel.replace(/[^A-Za-z0-9]+/g, "_") + ".pptx" });
      })
      .catch(function (err) {
        console.error("PPT export failed:", err);
        alert("PPT export failed: " + (err && err.message ? err.message : err));
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = origLabel;
      });
  }

  document.getElementById("export-ppt-btn").addEventListener("click", exportActiveTabToPptx);

  renderTab("overview");
})();
</script>
</body>
</html>
