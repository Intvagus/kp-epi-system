<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KP EPI Dashboard</title>
<style>
  :root {
    --navy: #1a3a7a;
    --navy-dark: #12285a;
    --navy-light: #e8edf9;
    --good: #1e8e3e;
    --good-bg: #e6f4ea;
    --warning: #b06a00;
    --warning-bg: #fff4e0;
    --poor: #c5221f;
    --poor-bg: #fce8e6;
    --neutral: #5f6368;
    --neutral-bg: #f1f3f4;
    --border: #dadce0;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1b1f27;
    --text-dim: #5f6368;
    --measles: #1a5fb4;
    --diphtheria: #7d3c98;
    --pertussis: #1e8e3e;
    --nnt: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header.app-header {
    background: var(--navy); color: #fff; padding: 14px 16px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  header.app-header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header.app-header .sub { font-size: 12px; opacity: 0.85; }
  select.period-select {
    background: #fff; border: none; border-radius: 4px; padding: 6px 10px; font-size: 13px; color: var(--navy);
    font-weight: 600;
  }
  nav.tabs {
    display: flex; background: var(--navy-dark); overflow-x: auto; -webkit-overflow-scrolling: touch;
    position: sticky; top: 0; z-index: 20;
  }
  nav.tabs button {
    background: transparent; border: none; color: #cdd6ee; padding: 12px 16px; font-size: 13px;
    font-weight: 600; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent;
  }
  nav.tabs button.active { color: #fff; border-bottom-color: #fff; background: rgba(255,255,255,0.06); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .grid { display: grid; gap: 12px; }
  .kpi-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .kpi-card {
    background: var(--card-bg); border-radius: 8px; padding: 12px 14px; border-left: 5px solid var(--neutral);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .kpi-card.rag-good { border-left-color: var(--good); }
  .kpi-card.rag-warning { border-left-color: var(--warning); }
  .kpi-card.rag-poor { border-left-color: var(--poor); }
  .kpi-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .kpi-card .value { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .card {
    background: var(--card-bg); border-radius: 8px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 10px 0; color: var(--navy); }
  .card h3 { font-size: 13px; margin: 14px 0 8px 0; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .two-col { grid-template-columns: 1fr 1fr; }
  .three-col { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 760px) {
    .two-col, .three-col { grid-template-columns: 1fr; }
  }
  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap.tall { height: 360px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-dim); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card-bg); }
  th.sorted-asc::after { content: " \25B2"; font-size: 9px; }
  th.sorted-desc::after { content: " \25BC"; font-size: 9px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--navy-light); }
  .pct-cell { font-weight: 600; }
  .rag-good-text { color: var(--good); }
  .rag-warning-text { color: var(--warning); }
  .rag-poor-text { color: var(--poor); }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10.5px; font-weight: 600; margin-right: 3px; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); }
  .badge.poor { background: var(--poor-bg); color: var(--poor); }
  .badge.neutral { background: var(--neutral-bg); color: var(--neutral); }
  .breadcrumb { font-size: 13px; margin-bottom: 10px; color: var(--text-dim); }
  .breadcrumb a { color: var(--navy); cursor: pointer; text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }
  input.search-box {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%;
    max-width: 280px; margin-bottom: 10px;
  }
  select.filter-select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; margin-right: 8px; margin-bottom: 10px; }
  .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pagination { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12.5px; }
  .pagination button {
    border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .placeholder-card {
    text-align: center; padding: 40px 20px; color: var(--text-dim); border: 2px dashed var(--border); border-radius: 8px;
  }
  .placeholder-card .icon { font-size: 32px; margin-bottom: 8px; }
  .insight-box {
    background: var(--navy-light); border-left: 4px solid var(--navy); border-radius: 6px;
    padding: 10px 14px; font-size: 13px; line-height: 1.5; margin: 12px 0; color: var(--navy-dark);
    cursor: text;
  }
  .insight-box:hover, .insight-box:focus {
    outline: 1px dashed var(--navy); outline-offset: 2px;
  }
  .insight-box::before {
    content: "Insight (click to edit)"; display: block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--navy); opacity: 0.65; margin-bottom: 3px;
  }
  .section-note { color: var(--text-dim); font-size: 12.5px; margin: 0 0 10px 0; }
  .period-pill {
    background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 7px 16px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; margin-right: 8px; color: var(--text-dim);
  }
  .period-pill.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .map-wrap { position: relative; }
  .map-wrap svg { width: 100%; height: auto; display: block; }
  .map-wrap path.district-shape {
    stroke: #fff; stroke-width: 1; cursor: pointer; transition: opacity .1s;
  }
  .map-wrap path.district-shape:hover { opacity: 0.75; stroke: var(--navy-dark); stroke-width: 1.5; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .map-legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .map-tooltip {
    position: fixed; pointer-events: none; background: var(--navy-dark); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; line-height: 1.5; z-index: 100; max-width: 240px; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .mini-map-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 10px;
  }
  .mini-map-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: #fff;
  }
  .mini-map-card h4 {
    margin: 0 0 6px 0; font-size: 12.5px; font-weight: 700; color: var(--navy); text-align: center;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .mini-map-card .map-wrap svg { width: 100%; height: auto; display: block; }
  .disease-tag { display: inline-block; width: 4px; height: 16px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .expand-row td { background: #fafbfe; padding: 10px 14px; }
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; font-size: 12px; }
  .mini-grid div { padding: 4px 6px; background: #fff; border-radius: 4px; border: 1px solid var(--border); }
  .callout-inline { font-size: 12px; font-weight: 600; color: var(--navy); text-transform: none; letter-spacing: normal; }
  .alert-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .alert-pills .badge { font-size: 11.5px; padding: 3px 9px; }
  .anomaly-box {
    margin-top: 12px; padding: 10px 14px; background: var(--poor-bg); border: 1px solid var(--poor);
    border-radius: 6px;
  }
  .anomaly-box h3 { margin: 0 0 4px 0; color: var(--poor); font-size: 13px; }
  .anomaly-box p { margin: 0 0 8px 0; font-size: 12px; color: var(--text-dim); }
  .completeness-list { display: flex; flex-direction: column; gap: 6px; }
  .completeness-row { display: grid; grid-template-columns: 190px 1fr 46px; align-items: center; gap: 8px; font-size: 12px; }
  .completeness-label { color: var(--text-dim); }
  .completeness-bar-track { background: #eef1f7; border-radius: 4px; height: 12px; overflow: hidden; }
  .completeness-bar-fill { height: 100%; border-radius: 4px; }
  .completeness-pct { text-align: right; font-weight: 600; }
  .discordance-table th, .discordance-table td { text-align: center; }
  .discordance-table th:first-child, .discordance-table td:first-child { text-align: left; }
  .discordant-cell { background: var(--poor-bg); color: var(--poor); font-weight: 700; }
  .error-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
  footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text-dim); }
  button.export-btn {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 8px;
  }
  button.export-btn:hover { background: rgba(255,255,255,0.22); }
  .print-only { display: none; }
  /* Printing/exporting to PDF captures exactly what's on screen right now --
     whichever tab, period pill, and antigen/district selection the viewer
     currently has open -- since there's no server round-trip involved. The
     interactive controls themselves are hidden (a <select> or a clickable
     pill button prints uselessly), but what they were SET TO must stay
     visible as plain text, or the PDF wouldn't say which period/tab it is. */
  @media print {
    nav.tabs, header .period-select, header label[for="period-select"],
    .controls-row select, button.export-btn, .insight-box[contenteditable]::before,
    .pagination, input.search-box, th.sorted-asc::after, th.sorted-desc::after { display: none !important; }
    .print-only { display: inline; }
    .period-pill:not(.active) { display: none !important; }
    .period-pill.active {
      background: none !important; color: #000 !important; border: none !important;
      padding: 0 !important; font-weight: 700; font-size: 13px;
    }
    .tab-panel { display: none !important; }
    .tab-panel.active { display: block !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    .chart-wrap, .map-wrap { break-inside: avoid; }
    .table-scroll { overflow: visible; }
    a.download { display: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>KP EPI Dashboard</h1>
    <div class="sub">Directorate General Health Services, Khyber Pakhtunkhwa &mdash; Expanded Programme on Immunization</div>
  </div>
  <div>
    <label for="period-select" style="font-size:12px; margin-right:6px; opacity:0.85;">Coverage period:</label>
    <select id="period-select" class="period-select"></select>
    <span class="print-only" id="print-period-label" style="font-weight:700;"></span>
    <button class="export-btn" id="export-pdf-btn" title="Exports exactly what's currently on screen -- the active tab and whatever filters are selected">Download PDF</button>
  </div>
</header>

<nav class="tabs">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="coverage">Coverage</button>
  <button data-tab="surveillance">Surveillance</button>
  <button data-tab="supervision">Supervision</button>
  <button data-tab="quality">Data Quality</button>
</nav>

<main>
  <section id="tab-overview" class="tab-panel active"></section>
  <section id="tab-coverage" class="tab-panel"></section>
  <section id="tab-surveillance" class="tab-panel"></section>
  <section id="tab-supervision" class="tab-panel"></section>
  <section id="tab-quality" class="tab-panel"></section>
</main>

<footer>Generated by the EPI data pipeline. Coverage and bulletin figures are computed once by src/pipeline and never recalculated here.</footer>

<script>/*__CHARTJS_SOURCE__*/</script>
<script id="epi-data" type="application/json">/*__EPI_DATA_JSON__*/</script>
<script id="kp-geo" type="application/json">/*__KP_GEOJSON__*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("epi-data").textContent);
  var CFG = DATA.config;
  var KP_GEO = JSON.parse(document.getElementById("kp-geo").textContent);
  var charts = {}; // name -> Chart instance, so we can destroy before re-render

  // Every place user-typed text (search boxes) or saved localStorage text
  // (editable insights) gets interpolated back into an HTML string built by
  // string concatenation MUST go through this first -- otherwise a stray "
  // or < breaks out of an attribute/tag and can inject arbitrary markup or
  // attributes (confirmed reproducible: typing `Peshawar" onmouseover="..`
  // into a search box corrupted the input's own attributes).
  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtPct(v) { return (v === null || v === undefined || isNaN(v)) ? "—" : v.toFixed(1) + "%"; }
  function fmtNum(v) { return (v === null || v === undefined || isNaN(v)) ? "—" : Number(v).toLocaleString(); }
  function ragClass(rag) { return rag ? "rag-" + rag : ""; }
  function ragTextClass(rag) { return rag ? "rag-" + rag + "-text" : ""; }
  function destroyChart(name) { if (charts[name]) { charts[name].destroy(); delete charts[name]; } }

  function coverageRag(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return null;
    if (pct >= CFG.coverage_good) return "good";
    if (pct >= CFG.coverage_warning) return "warning";
    return "poor";
  }
  function dropoutRag(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return null;
    if (pct <= CFG.dropout_good) return "good";
    if (pct <= CFG.dropout_warning) return "warning";
    return "poor";
  }

  // ---------- Tabs ----------
  var tabButtons = document.querySelectorAll("nav.tabs button");
  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
      var panel = document.getElementById("tab-" + btn.dataset.tab);
      panel.classList.add("active");
      renderTab(btn.dataset.tab);
    });
  });

  // ---------- Period selector ----------
  var periodSelect = document.getElementById("period-select");
  DATA.periods.forEach(function (p) {
    var opt = document.createElement("option");
    opt.value = p.period_id; opt.textContent = p.label;
    if (p.period_id === DATA.default_period_id) opt.selected = true;
    periodSelect.appendChild(opt);
  });
  var state = {
    periodId: DATA.default_period_id,
    coverageLevel: "district", coverageDistrict: null, coverageTehsil: null,
    coverageSort: { col: "fic_pct_reported", dir: "desc" }, coverageSearch: "",
    qualityPage: 0, qualityFilterType: "", qualitySearch: "", gapAntigen: "FIC",
    coveragePeriodKind: "monthly",
  };
  function updatePrintPeriodLabel() {
    var opt = periodSelect.options[periodSelect.selectedIndex];
    document.getElementById("print-period-label").textContent = opt ? opt.textContent : "";
  }
  periodSelect.addEventListener("change", function () {
    state.periodId = periodSelect.value;
    updatePrintPeriodLabel();
    renderTab("overview"); renderTab("coverage");
  });
  updatePrintPeriodLabel();

  function byPeriod(rows, level) {
    return rows.filter(function (r) { return r.period_id === state.periodId; });
  }
  function districtRows() { return byPeriod(DATA.coverage.district).filter(function (r) { return !r.is_province_total; }); }
  function provinceRow() { return byPeriod(DATA.coverage.district).filter(function (r) { return r.is_province_total; })[0]; }

  // ================= OVERVIEW =================
  function renderOverview() {
    var el = document.getElementById("tab-overview");
    var prov = provinceRow();
    if (!prov) {
      el.innerHTML = '<div class="card"><div class="placeholder-card"><div class="icon">📊</div>' +
        'No Coverage data uploaded yet. See the Coverage tab, or the Surveillance/Supervision tabs if that\'s what was uploaded.</div></div>';
      return;
    }

    var kpis = [
      ["BCG", prov.bcg_pct_reported, coverageRag(prov.bcg_pct_reported)],
      ["Penta3", prov.penta3_pct_reported, coverageRag(prov.penta3_pct_reported)],
      ["MR1", prov.mr1_pct_reported, coverageRag(prov.mr1_pct_reported)],
      ["FIC", prov.fic_pct_reported, coverageRag(prov.fic_pct_reported)],
      ["Dropout (P1→P3)", prov.dropout_pct_reported, dropoutRag(prov.dropout_pct_reported)],
    ];
    var kpiHtml = kpis.map(function (k) {
      return '<div class="kpi-card rag-' + k[2] + '"><div class="label">' + k[0] + '</div>' +
        '<div class="value ' + ragTextClass(k[2]) + '">' + fmtPct(k[1]) + '</div>' +
        '<div class="sub">Province-wide</div></div>';
    }).join("");

    var dRows = districtRows().slice().sort(function (a, b) { return (b.fic_pct_reported || 0) - (a.fic_pct_reported || 0); });

    el.innerHTML =
      '<div class="grid kpi-row">' + kpiHtml + '</div>' +
      '<div class="grid two-col" style="margin-top:14px;">' +
        '<div class="card"><h2>Antigen cascade (province-wide)</h2><div class="chart-wrap"><canvas id="chart-cascade"></canvas></div></div>' +
        '<div class="card"><h2>UC category breakdown</h2><div class="chart-wrap"><canvas id="chart-category"></canvas></div></div>' +
      '</div>' +
      '<div class="card"><h2>Districts ranked by FIC coverage</h2><div class="chart-wrap tall"><canvas id="chart-fic-rank"></canvas></div></div>';

    destroyChart("cascade"); destroyChart("category"); destroyChart("ficRank");

    var cascadeLabels = ["BCG", "Penta1", "Penta2", "Penta3", "MR1", "FIC"];
    var cascadeVals = [prov.bcg_pct_reported, prov.penta1_pct_reported, prov.penta2_pct_reported,
      prov.penta3_pct_reported, prov.mr1_pct_reported, prov.fic_pct_reported];
    charts.cascade = new Chart(document.getElementById("chart-cascade"), {
      type: "bar",
      data: { labels: cascadeLabels, datasets: [{ label: "Coverage %", data: cascadeVals, backgroundColor: "#1a3a7a" }] },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } }, scales: { x: { max: 110 } } }
    });

    var catTotals = [0, 0, 0, 0];
    dRows.forEach(function (r) {
      catTotals[0] += r.cat1_count || 0; catTotals[1] += r.cat2_count || 0;
      catTotals[2] += r.cat3_count || 0; catTotals[3] += r.cat4_count || 0;
    });
    charts.category = new Chart(document.getElementById("chart-category"), {
      type: "doughnut",
      data: {
        labels: ["Category 1 (good access, good use)", "Category 2 (good access, poor use)",
          "Category 3 (poor access, good use)", "Category 4 (poor access, poor use)"],
        datasets: [{ data: catTotals, backgroundColor: ["#1e8e3e", "#b06a00", "#5b7fd6", "#c5221f"] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 10 } } } } }
    });

    charts.ficRank = new Chart(document.getElementById("chart-fic-rank"), {
      type: "bar",
      data: {
        labels: dRows.map(function (r) { return r.district; }),
        datasets: [{ label: "FIC %", data: dRows.map(function (r) { return r.fic_pct_reported; }),
          backgroundColor: dRows.map(function (r) {
            var c = coverageRag(r.fic_pct_reported);
            return c === "good" ? "#1e8e3e" : c === "warning" ? "#b06a00" : "#c5221f";
          }) }]
      },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } }, scales: { x: { max: 110 } } }
    });
  }

  // ================= COVERAGE =================
  var COVERAGE_COLS = {
    district: [["district", "District"], ["bcg_pct_reported", "BCG%"], ["penta1_pct_reported", "Penta1%"],
      ["penta3_pct_reported", "Penta3%"], ["mr1_pct_reported", "MR1%"], ["fic_pct_reported", "FIC%"],
      ["dropout_pct_reported", "Dropout%"], ["category", "Category"], ["total_ucs", "UCs"]],
    tehsil: [["tehsil", "Tehsil"], ["bcg_pct_reported", "BCG%"], ["penta1_pct_reported", "Penta1%"],
      ["penta3_pct_reported", "Penta3%"], ["mr1_pct_reported", "MR1%"], ["fic_pct_reported", "FIC%"],
      ["dropout_pct_reported", "Dropout%"], ["category", "Category"], ["total_ucs", "UCs"]],
    uc: [["uc_name", "Union Council"], ["bcg_pct", "BCG%"], ["penta1_pct", "Penta1%"],
      ["penta3_pct", "Penta3%"], ["mr1_pct", "MR1%"], ["fic_pct", "FIC%"], ["dropout_pct", "Dropout%"],
      ["category", "Category"], ["flags", "Flags"]],
  };
  var RAG_COLS = { bcg_pct: 1, bcg_pct_reported: 1, penta1_pct: 1, penta1_pct_reported: 1, penta2_pct_reported: 1,
    penta3_pct: 1, penta3_pct_reported: 1, mr1_pct: 1, mr1_pct_reported: 1, fic_pct: 1, fic_pct_reported: 1,
    dropout_pct: "dropout", dropout_pct_reported: "dropout" };

  function coverageRows() {
    if (state.coverageLevel === "district") return districtRows();
    if (state.coverageLevel === "tehsil") {
      return byPeriod(DATA.coverage.tehsil).filter(function (r) { return r.district === state.coverageDistrict; });
    }
    return byPeriod(DATA.coverage.uc).filter(function (r) {
      return r.district === state.coverageDistrict && r.tehsil === state.coverageTehsil;
    });
  }

  function flagBadges(r) {
    var b = "";
    if (r.is_zero_target) b += '<span class="badge neutral">no target</span>';
    if (r.is_outlier) b += '<span class="badge warning">outlier</span>';
    if (r.is_negative_dropout) b += '<span class="badge poor">neg. dropout</span>';
    if (r.is_consistency_fail) b += '<span class="badge poor">' + r.consistency_fail_count + ' mismatch</span>';
    return b || '<span class="badge good">clean</span>';
  }

  function renderBreadcrumb() {
    var parts = ['<a data-nav="province">Province</a>'];
    if (state.coverageDistrict) parts.push(' &rsaquo; <a data-nav="district">' + escHtml(state.coverageDistrict) + '</a>');
    if (state.coverageTehsil) parts.push(' &rsaquo; ' + escHtml(state.coverageTehsil));
    return '<div class="breadcrumb">' + parts.join("") + '</div>';
  }

  // ---------- Coverage analysis section helpers ----------
  function ragColor(rag) {
    return rag === "good" ? "#1e8e3e" : rag === "warning" ? "#b06a00" : rag === "poor" ? "#c5221f" : "#9aa0a6";
  }
  // Green/red only (no amber) -- for charts that need a strict pass/fail
  // read against the province's own defined good-coverage threshold
  // (config.COVERAGE_GOOD, the same threshold already used everywhere else
  // in this dashboard -- never a separate, arbitrary cutoff).
  function targetMetColor(pct) { return pct >= CFG.coverage_good ? "#1e8e3e" : "#c5221f"; }

  // Bakes a text label directly onto each bar via canvas fillText, instead
  // of relying on hover tooltips -- a PDF/print export or a static
  // screenshot has no hover state, so any number that matters has to be
  // permanently visible on the chart itself. Datasets opt in by adding a
  // parallel `labelText` array (one string per data point); Chart.js itself
  // ignores that property, this plugin reads it.
  var barValueLabelsPlugin = {
    id: "barValueLabels",
    afterDatasetsDraw: function (chart) {
      var ctx = chart.ctx;
      var horizontal = chart.options.indexAxis === "y";
      ctx.save();
      ctx.font = "600 11px -apple-system, Segoe UI, Roboto, Arial, sans-serif";
      ctx.fillStyle = "#1b1f27";
      ctx.textBaseline = "middle";
      chart.data.datasets.forEach(function (dataset, di) {
        if (!dataset.labelText) return;
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function (bar, i) {
          var label = dataset.labelText[i];
          if (!label) return;
          if (horizontal) {
            var positive = bar.x >= bar.base;
            ctx.textAlign = positive ? "left" : "right";
            ctx.fillText(label, bar.x + (positive ? 5 : -5), bar.y);
          } else {
            ctx.textAlign = "center";
            ctx.fillText(label, bar.x, bar.y - 8);
          }
        });
      });
      ctx.restore();
    },
  };
  Chart.register(barValueLabelsPlugin);

  function kpiCard(label, value, sub, rag) {
    return '<div class="kpi-card' + (rag ? " rag-" + rag : "") + '"><div class="label">' + label + '</div>' +
      '<div class="value' + (rag ? " " + ragTextClass(rag) : "") + '">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  // Every section's narrative insight is auto-generated by the pipeline from
  // real numbers (see coverage_summary.py), then shown here as an editable
  // note -- a programme officer can click in and refine the wording. Edits
  // are saved to this browser's local storage, keyed by section + period +
  // (where relevant) antigen, so switching tabs/antigens never shows a stale
  // edit written for a different view. Edits are per-browser/device only --
  // they do not travel with the file if it's re-shared or regenerated.
  function editableInsight(id, autoText) {
    var saved = null;
    try { saved = localStorage.getItem("epi-insight:" + id); } catch (e) {}
    var text = (saved !== null && saved !== "") ? saved : autoText;
    return '<div class="insight-box" contenteditable="true" spellcheck="false" data-insight-id="' + id + '" ' +
      'title="Click to edit this note">' + escHtml(text) + '</div>';
  }
  function wireEditableInsights(root) {
    root.querySelectorAll("[data-insight-id]").forEach(function (box) {
      box.addEventListener("blur", function () {
        try { localStorage.setItem("epi-insight:" + box.dataset.insightId, box.innerText.trim()); } catch (e) {}
      });
    });
  }

  // ---- District coverage map ----
  // No basemap tiles and no mapping library -- the dashboard must stay a
  // single offline file (same reasoning as inlining Chart.js), and a
  // province-only choropleth doesn't need street-level imagery underneath
  // it. Boundaries are projected and drawn as plain inline SVG <path>s.
  var MAP_PROJECTION = (function () {
    var minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
    function scan(coords, depth) {
      if (depth === 0) {
        var lon = coords[0], lat = coords[1];
        if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
      } else {
        coords.forEach(function (c) { scan(c, depth - 1); });
      }
    }
    KP_GEO.features.forEach(function (f) {
      var depth = f.geometry.type === "Polygon" ? 2 : 3;
      scan(f.geometry.coordinates, depth);
    });
    var latMid = (minLat + maxLat) / 2;
    var cosLat = Math.cos(latMid * Math.PI / 180);
    var W = 640, H = 520, PAD = 10;
    var spanX = (maxLon - minLon) * cosLat, spanY = (maxLat - minLat);
    var scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
    var offX = PAD + ((W - 2 * PAD) - spanX * scale) / 2;
    var offY = PAD + ((H - 2 * PAD) - spanY * scale) / 2;
    function project(lon, lat) {
      var x = offX + (lon - minLon) * cosLat * scale;
      var y = offY + (maxLat - lat) * scale;
      return [x, y];
    }
    function ringPath(ring) {
      return ring.map(function (pt, i) {
        var p = project(pt[0], pt[1]);
        return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1);
      }).join(" ") + "Z";
    }
    function geometryPath(geom) {
      if (geom.type === "Polygon") return geom.coordinates.map(ringPath).join(" ");
      if (geom.type === "MultiPolygon") {
        return geom.coordinates.map(function (poly) { return poly.map(ringPath).join(" "); }).join(" ");
      }
      return "";
    }
    return { width: W, height: H, geometryPath: geometryPath };
  })();

  // One compact map per antigen, so a decision-maker can compare districts
  // across the whole antigen schedule at a glance instead of switching a
  // single map back and forth. Every mini-map reuses the same MAP_PROJECTION
  // (computed once above) and the same district_map figures already
  // computed server-side -- only the SVG markup is built per antigen.
  function antigenMapsGridHtml(cs, kind) {
    if (cs.status !== "ok" || !cs.district_map || cs.district_map.unmapped_districts.length) return "";
    return '<div class="card"><h2>🗺️ Antigen-wise District Coverage Maps</h2>' +
      '<p class="section-note">Each district shaded by coverage for ' + cs.executive.current_period_label +
        '. A few districts share one boundary with recently-created sister districts (see hover text) -- the shaded figure is their combined coverage.</p>' +
      '<div class="mini-map-grid" id="map-grid-' + kind + '"></div>' +
      '<div class="map-legend">' +
        '<span><span class="swatch" style="background:#1e8e3e;"></span>Good (&ge;' + CFG.coverage_good + '%)</span>' +
        '<span><span class="swatch" style="background:#b06a00;"></span>Needs monitoring</span>' +
        '<span><span class="swatch" style="background:#c5221f;"></span>Critical (&lt;' + CFG.coverage_warning + '%)</span>' +
        '<span><span class="swatch" style="background:#d0d5dd;"></span>No data</span>' +
      '</div>' +
      '<p class="section-note" style="margin-top:6px;">District boundaries: geoBoundaries.org (CC-BY 4.0)</p>' +
      '<div class="map-tooltip" id="map-tooltip-' + kind + '"></div>' +
    '</div>';
  }

  function renderAntigenMapsGrid(cs, kind) {
    var grid = document.getElementById("map-grid-" + kind);
    if (!grid) return;
    // Fixed antigen order (matches the source sheet's own column order, via
    // target_gap's insertion order) rather than best-to-worst, so the grid
    // layout doesn't reshuffle from one period to the next.
    var antigens = Object.keys(cs.target_gap.by_antigen);
    var features = cs.district_map.features;

    grid.innerHTML = antigens.map(function (antigen) {
      var paths = KP_GEO.features.map(function (f) {
        var name = f.properties.shapeName;
        var entry = features[name];
        var d = MAP_PROJECTION.geometryPath(f.geometry);
        var stat = entry ? entry.by_antigen[antigen] : null;
        var fill = "#d0d5dd";
        var status = "No data";
        if (stat && stat.pct !== null) {
          fill = ragColor(stat.rag);
          status = stat.pct >= CFG.coverage_good ? "Achieved" : "Below Target";
        }
        var label = entry ? entry.component_districts.join(" + ") : name;
        var detail = stat && stat.pct !== null
          ? label + "<br>" + antigen + ": " + stat.pct.toFixed(1) + "% (target " + CFG.coverage_good + "%)<br>" +
            stat.vaccinated.toLocaleString() + " of " + stat.target.toLocaleString() + " vaccinated &mdash; " + status
          : label + "<br>" + antigen + ": No data";
        return '<path class="district-shape" d="' + d + '" fill="' + fill + '" data-detail="' + detail.replace(/"/g, "&quot;") + '"></path>';
      }).join("");
      return '<div class="mini-map-card"><h4>' + antigen + '</h4>' +
        '<div class="map-wrap"><svg viewBox="0 0 ' + MAP_PROJECTION.width + ' ' + MAP_PROJECTION.height + '">' + paths + '</svg></div></div>';
    }).join("");

    var tooltip = document.getElementById("map-tooltip-" + kind);
    grid.querySelectorAll("path.district-shape").forEach(function (path) {
      path.addEventListener("mousemove", function (e) {
        tooltip.innerHTML = path.dataset.detail;
        tooltip.style.display = "block";
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });
      path.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
    });
  }

  // ---- Master dispatcher for the Coverage tab ----
  // Monthly and cumulative are two fully independent, complete dashboards

  function renderCoverage() {

    var summary = DATA.coverage_summary;

      el.innerHTML = '<div class="card"><div class="placeholder-card"><div class="icon">📊</div>' +
        'No Coverage data uploaded yet.<br><span style="font-size:12px;">Upload a coverage workbook (District/Tehsil/UC Wise Analysis sheets) to populate this tab -- the Surveillance and Supervision tabs work independently and don\'t need it.</span></div></div>';
      return;
    }
    var kinds = [];
    if (summary.periods.monthly && summary.periods.monthly.status === "ok") {
      kinds.push({ key: "monthly", label: "Monthly — " + summary.periods.monthly.executive.current_period_label });
    }
    if (summary.periods.cumulative && summary.periods.cumulative.status === "ok") {
      kinds.push({ key: "cumulative", label: "Cumulative — " + summary.periods.cumulative.executive.current_period_label });
    }
    if (!kinds.length) {
      el.innerHTML = '<div class="card"><div class="placeholder-card"><div class="icon">📊</div>No Coverage data uploaded yet.</div></div>';
      return;
    }
    if (kinds.map(function (k) { return k.key; }).indexOf(state.coveragePeriodKind) === -1) {
      state.coveragePeriodKind = kinds[0].key;
    }

    var pillsHtml = kinds.length > 1
      ? '<div class="controls-row" style="margin-bottom:14px;">' + kinds.map(function (k) {
          return '<button class="period-pill' + (k.key === state.coveragePeriodKind ? " active" : "") + '" data-kind="' + k.key + '">' + k.label + '</button>';
        }).join("") + '</div>'
      : '';

    var kind = state.coveragePeriodKind;
    var cs = summary.periods[kind];

    el.innerHTML = pillsHtml +
      executiveOverviewHtml(cs, kind) +
      antigenMapsGridHtml(cs, kind) +
      antigenAnalysisHtml(cs, kind) +
      '<div id="section-targetgap">' + targetGapHtml(cs, kind) + '</div>' +
      dropoutAnalysisHtml(cs, kind) +
      trendsHtml(cs, kind) +
      '<div class="card"><h2>Detailed District / Tehsil / UC Explorer</h2>' +
      '<p class="section-note">Drill down from province &rarr; district &rarr; tehsil &rarr; UC for any uploaded period (independent of the Monthly/Cumulative toggle above).</p>' +
      '<div id="coverage-explorer-mount"></div></div>';

    el.querySelectorAll(".period-pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.coveragePeriodKind = btn.dataset.kind;
        renderCoverage();
      });
    });

    renderAntigenMapsGrid(cs, kind);
    renderAntigenAnalysisChart(cs);
    renderTargetGapChart(cs, kind);
    renderDropoutChart(cs);
    renderTrendsChart(cs);
    renderCoverageExplorer();
    wireEditableInsights(el);
  }

  function renderCoverageExplorer() {
    var el = document.getElementById("coverage-explorer-mount");
    // el.innerHTML below rebuilds the search input from scratch on every
    // keystroke (the whole table re-renders as you type), which drops
    // keyboard focus -- confirmed reproducible: without this, only the
    // first character you type ever registers. Save focus/cursor state
    // before the rebuild and restore it after.
    var searchWasFocused = document.activeElement && document.activeElement.id === "coverage-search";
    var searchCursorPos = searchWasFocused ? document.activeElement.selectionStart : null;
    var cols = COVERAGE_COLS[state.coverageLevel];
    var rows = coverageRows();
    if (state.coverageSearch) {
      var q = state.coverageSearch.toLowerCase();
      var nameCol = cols[0][0];
      rows = rows.filter(function (r) { return String(r[nameCol]).toLowerCase().indexOf(q) !== -1; });
    }
    var sortCol = state.coverageSort.col, sortDir = state.coverageSort.dir;
    rows = rows.slice().sort(function (a, b) {
      var av = a[sortCol], bv = b[sortCol];
      if (av === null || av === undefined) av = -Infinity;
      if (bv === null || bv === undefined) bv = -Infinity;
      if (typeof av === "string") { av = av.toLowerCase(); bv = String(bv).toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    var thead = cols.map(function (c) {
      var cls = c[0] === sortCol ? (sortDir === "asc" ? "sorted-asc" : "sorted-desc") : "";
      return '<th class="' + cls + '" data-col="' + c[0] + '">' + c[1] + '</th>';
    }).join("");

    var tbody = rows.map(function (r, i) {
      var cells = cols.map(function (c) {
        var key = c[0];
        if (key === "flags") return "<td>" + flagBadges(r) + "</td>";
        var v = r[key];
        if (RAG_COLS[key]) {
          var rag = RAG_COLS[key] === "dropout" ? dropoutRag(v) : coverageRag(v);
          return '<td class="pct-cell ' + ragTextClass(rag) + '">' + fmtPct(v) + "</td>";
        }
        return "<td>" + (v === null || v === undefined ? "—" : escHtml(v)) + "</td>";
      }).join("");
      var clickable = state.coverageLevel !== "uc";
      return '<tr class="' + (clickable ? "clickable" : "") + '" data-idx="' + i + '">' + cells + "</tr>" +
        (state.coverageLevel === "uc" ? '<tr class="expand-row" id="expand-' + i + '" style="display:none;"><td colspan="' + cols.length + '">' + ucDetailHtml(r) + '</td></tr>' : "");
    }).join("");

    el.innerHTML =
      renderBreadcrumb() +
      '<div class="card">' +
      '<div class="controls-row"><input type="text" class="search-box" placeholder="Search ' + escHtml(state.coverageLevel) + '..." value="' + escHtml(state.coverageSearch) + '" id="coverage-search"></div>' +
      '<div class="table-scroll"><table><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>' +
      (rows.length === 0 ? '<p style="color:var(--text-dim);">No rows match.</p>' : '') +
      '</div>';

    var searchBox = document.getElementById("coverage-search");
    if (searchWasFocused) {
      searchBox.focus();
      searchBox.setSelectionRange(searchCursorPos, searchCursorPos);
    }
    searchBox.addEventListener("input", function (e) {
      state.coverageSearch = e.target.value; renderCoverageExplorer();
    });
    el.querySelectorAll("th[data-col]").forEach(function (th) {
      th.addEventListener("click", function () {
        var col = th.dataset.col;
        if (state.coverageSort.col === col) state.coverageSort.dir = state.coverageSort.dir === "asc" ? "desc" : "asc";
        else state.coverageSort = { col: col, dir: "desc" };
        renderCoverageExplorer();
      });
    });
    el.querySelectorAll("a[data-nav]").forEach(function (a) {
      a.addEventListener("click", function () {
        if (a.dataset.nav === "province") { state.coverageLevel = "district"; state.coverageDistrict = null; state.coverageTehsil = null; }
        if (a.dataset.nav === "district") { state.coverageLevel = "tehsil"; state.coverageTehsil = null; }
        state.coverageSearch = ""; renderCoverageExplorer();
      });
    });
    if (state.coverageLevel !== "uc") {
      el.querySelectorAll("tr.clickable").forEach(function (tr) {
        tr.addEventListener("click", function () {
          var r = rows[Number(tr.dataset.idx)];
          if (state.coverageLevel === "district") { state.coverageLevel = "tehsil"; state.coverageDistrict = r.district; }
          else if (state.coverageLevel === "tehsil") { state.coverageLevel = "uc"; state.coverageTehsil = r.tehsil; }
          state.coverageSearch = ""; state.coverageSort = { col: cols[1][0], dir: "desc" };
          renderCoverageExplorer();
        });
      });
    } else {
      el.querySelectorAll("tbody tr[data-idx]").forEach(function (tr) {
        tr.addEventListener("click", function () {
          var exp = document.getElementById("expand-" + tr.dataset.idx);
          exp.style.display = exp.style.display === "none" ? "table-row" : "none";
        });
      });
    }
  }

  function ucDetailHtml(r) {
    var fields = [["Access", r.access_rating], ["Utilisation", r.utilisation_rating],
      ["IPV1%", fmtPct(r.ipv1_pct)], ["IPV2%", fmtPct(r.ipv2_pct)], ["TCV%", fmtPct(r.tcv_pct)],
      ["Penta2%", fmtPct(r.penta2_pct)]];
    return '<div class="mini-grid">' + fields.map(function (f) {
      return "<div><strong>" + f[0] + ":</strong> " + (f[1] === null || f[1] === undefined ? "—" : escHtml(f[1])) + "</div>";
    }).join("") + "</div>";
  }

  // ================= SURVEILLANCE =================
  function diseaseKpiCard(label, value, sub) {
    return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';

  function priorityBadgeClass(p) { return p === "Critical" ? "poor" : p === "Action" ? "warning" : "neutral"; }

      diseaseKpiCard("Sample collection rate", fmtPct(msl.sample_collection_rate_pct), ""),
      diseaseKpiCard("Sample adequacy rate", fmtPct(msl.sample_adequacy_rate_pct), "of collected samples"),

    ].filter(Boolean).join(" ");

    var discordBody = discordRowsLabels.map(function (lr) {

        var cls = cell.flagged ? ' class="discordant-cell"' : "";

      '<div class="card"><h2>AFP Surveillance</h2><div class="placeholder-card"><div class="icon">⏳</div>' + v.afp.message + '</div></div>';

    wireEditableInsights(el);

    destroyChart("mslDaily"); destroyChart("mslTrend"); destroyChart("mslClassification"); destroyChart("mslOutcome");
    destroyChart("mslComplications"); destroyChart("mslTopDistricts"); destroyChart("mslAge"); destroyChart("mslSex");
    destroyChart("mslDose"); destroyChart("msl2doseDistricts"); destroyChart("mslTimeliness"); destroyChart("diphTrend");

    // ---- Daily epi curve: bars = daily case count, line = 7-day rolling avg,
    // with the peak day and the latest day permanently labelled (PDF-friendly). ----
    var curve = msl.daily_epi_curve;
    var peakIdx = 0;
    curve.forEach(function (r, i) { if (r.case_count > curve[peakIdx].case_count) peakIdx = i; });
    var lastIdx = curve.length - 1;
    var curveLabelText = curve.map(function (r, i) {
      if (i === peakIdx) return "Peak: " + r.case_count;
      if (i === lastIdx) return "Latest: " + r.case_count;
      return null;
    });
    charts.mslDaily = new Chart(document.getElementById("chart-msl-daily"), {
      data: {
        labels: curve.map(function (r) { return r.onset_day; }),
        datasets: [
          { type: "bar", label: "Daily suspected cases", data: curve.map(function (r) { return r.case_count; }),
            backgroundColor: "#94a3c4", labelText: curveLabelText },
          { type: "line", label: "7-day rolling average", data: curve.map(function (r) { return r.rolling_7d_avg; }),
            borderColor: "#c5221f", backgroundColor: "#c5221f", tension: 0.25, pointRadius: 0, borderWidth: 2 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom" } },
        scales: { x: { ticks: { maxTicksLimit: 12, autoSkip: true } } },
      }
    });

    var trend = msl.weekly_trend;
    charts.mslTrend = new Chart(document.getElementById("chart-msl-trend"), {
      type: "line",
      data: {
        labels: trend.map(function (r) { return "W" + r.epi_week; }),
        datasets: [
          { label: "Suspected", data: trend.map(function (r) { return r.suspected; }), borderColor: "#1a3a7a", backgroundColor: "#1a3a7a", tension: 0.2 },
          { label: "Measles confirmed", data: trend.map(function (r) { return r.measles_confirmed; }), borderColor: "#c5221f", backgroundColor: "#c5221f", tension: 0.2 },
          { label: "Rubella confirmed", data: trend.map(function (r) { return r.rubella_confirmed; }), borderColor: "#b06a00", backgroundColor: "#b06a00", tension: 0.2 },
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
    });

    var ageOrder = ["0-8m", "9-23m", "24-59m", "60m+"];
    charts.mslAge = new Chart(document.getElementById("chart-msl-age"), {
      type: "bar",
      data: { labels: ageOrder, datasets: [{ label: "Suspected cases", data: ageOrder.map(function (k) { return msl.age_distribution[k] || 0; }),
        backgroundColor: "#1a5fb4", labelText: ageOrder.map(function (k) { return fmtNum(msl.age_distribution[k] || 0); }) }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grace: "15%" } } }
    });

    var doseOrder = ["Zero dose", "1 dose", "2 doses", "Unknown"];
    charts.mslDose = new Chart(document.getElementById("chart-msl-dose"), {
      type: "bar",
      data: {
        labels: doseOrder,
        datasets: [
          { label: "Suspected", data: doseOrder.map(function (k) { return msl.dose_status_suspected[k] || 0; }), backgroundColor: "#94a3c4",
            labelText: doseOrder.map(function (k) { return fmtNum(msl.dose_status_suspected[k] || 0); }) },
          { label: "Confirmed measles", data: doseOrder.map(function (k) { return msl.dose_status_confirmed_measles[k] || 0; }), backgroundColor: "#c5221f",
            labelText: doseOrder.map(function (k) { return fmtNum(msl.dose_status_confirmed_measles[k] || 0); }) },
          { label: "Confirmed rubella", data: doseOrder.map(function (k) { return msl.dose_status_confirmed_rubella[k] || 0; }), backgroundColor: "#b06a00",
            labelText: doseOrder.map(function (k) { return fmtNum(msl.dose_status_confirmed_rubella[k] || 0); }) },
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } }, scales: { y: { grace: "15%" } } }
    });

    var classKeys = Object.keys(msl.classification_breakdown).sort(function (a, b) {
      return msl.classification_breakdown[b] - msl.classification_breakdown[a];
    });
    charts.mslClassification = new Chart(document.getElementById("chart-msl-classification"), {
      type: "bar",
      data: {
        labels: classKeys,
        datasets: [{ label: "Cases", data: classKeys.map(function (k) { return msl.classification_breakdown[k]; }),
          backgroundColor: "#1a5fb4", labelText: classKeys.map(function (k) { return fmtNum(msl.classification_breakdown[k]); }) }]
      },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grace: "15%" } } }
    });

    var outcomeKeys = Object.keys(msl.outcome_breakdown).sort(function (a, b) { return msl.outcome_breakdown[b] - msl.outcome_breakdown[a]; });
    charts.mslOutcome = new Chart(document.getElementById("chart-msl-outcome"), {
      type: "bar",
      data: {
        labels: outcomeKeys,
        datasets: [{ label: "Cases", data: outcomeKeys.map(function (k) { return msl.outcome_breakdown[k]; }),
          backgroundColor: "#7d3c98", labelText: outcomeKeys.map(function (k) { return fmtNum(msl.outcome_breakdown[k]); }) }]
      },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grace: "15%" } } }
    });

    var compKeys = Object.keys(msl.complications_breakdown);
    charts.mslComplications = new Chart(document.getElementById("chart-msl-complications"), {
      type: "bar",
      data: {
        labels: compKeys,
        datasets: [{ label: "Cases", data: compKeys.map(function (k) { return msl.complications_breakdown[k]; }),
          backgroundColor: "#d97706", labelText: compKeys.map(function (k) { return fmtNum(msl.complications_breakdown[k]); }) }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { y: { grace: "15%" } } }
    });

    var topD = msl.top_districts;
    charts.mslTopDistricts = new Chart(document.getElementById("chart-msl-top-districts"), {
      type: "bar",
      data: {
        labels: topD.map(function (r) { return r.district; }),
        datasets: [{ label: "Suspected cases", data: topD.map(function (r) { return r.suspected; }),
          backgroundColor: "#1a3a7a", labelText: topD.map(function (r) { return fmtNum(r.suspected); }) }]
      },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grace: "15%" } } }
    });

    var sexKeys = Object.keys(msl.sex_breakdown);
    charts.mslSex = new Chart(document.getElementById("chart-msl-sex"), {
      type: "doughnut",
      data: {
        labels: sexKeys,
        datasets: [{ data: sexKeys.map(function (k) { return msl.sex_breakdown[k]; }), backgroundColor: ["#1a5fb4", "#c5221f", "#9aa0a6"] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" },
        tooltip: { enabled: true } } }
    });

    var top2dose = dq.lab_confirmed_dose_validation.top_districts_two_dose;
    charts.msl2doseDistricts = new Chart(document.getElementById("chart-msl-2dose-districts"), {
      type: "bar",
      data: {
        labels: top2dose.map(function (r) { return r.district; }),
        datasets: [{ label: "2-dose lab-confirmed cases", data: top2dose.map(function (r) { return r.case_count; }),
          backgroundColor: "#b06a00", labelText: top2dose.map(function (r) { return fmtNum(r.case_count); }) }]
      },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grace: "15%" } } }
    });

    var tBuckets = dq.timeliness.buckets;
    charts.mslTimeliness = new Chart(document.getElementById("chart-msl-timeliness"), {
      type: "bar",
      data: {
        labels: tOrder,
        datasets: [{ label: "Cases", data: tOrder.map(function (k) { return tBuckets[k] || 0; }),
          backgroundColor: ["#1e8e3e", "#b06a00", "#c5221f"], labelText: tOrder.map(function (k) { return fmtNum(tBuckets[k] || 0); }) }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { y: { grace: "15%" } } }
    });

    var dtrend = diph.weekly_trend;
    charts.diphTrend = new Chart(document.getElementById("chart-diph-trend"), {
      type: "bar",
      data: { labels: dtrend.map(function (r) { return "W" + r.epi_week; }), datasets: [{ label: "Cases", data: dtrend.map(function (r) { return r.case_count; }), backgroundColor: "#7d3c98" }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }

  // ================= SUPERVISION =================
  function renderSupervision() {
    var el = document.getElementById("tab-supervision");
    el.innerHTML = '<div class="card"><h2>Supervisory Visits</h2><div class="placeholder-card"><div class="icon">⏳</div>' +
      DATA.supervision.message + '</div></div>';
  }

  // ================= DATA QUALITY =================
  function renderQuality() {
    var el = document.getElementById("tab-quality");
    // Same focus-loss issue as the Coverage Explorer's search box -- see its
    // comment for why this save/restore is needed.
    var searchWasFocused = document.activeElement && document.activeElement.id === "quality-search";
    var searchCursorPos = searchWasFocused ? document.activeElement.selectionStart : null;
    var rep = DATA.quality.coverage_report;
    var flagTiles = Object.keys(rep.flags_by_type || {}).map(function (k) {
      return diseaseKpiCard(k.replace(/_/g, " "), fmtNum(rep.flags_by_type[k]), "coverage domain");
    }).join("");
    var exclTiles = Object.keys(rep.exclusions_by_reason || {}).map(function (k) {
      return diseaseKpiCard("excluded", fmtNum(rep.exclusions_by_reason[k]), k);
    }).join("");

    var allFlags = DATA.quality.coverage_flags.concat(
      DATA.quality.vpd_flags.map(function (f) { return Object.assign({}, f, { level: f.level }); })
    );
    var types = Array.from(new Set(allFlags.map(function (f) { return f.flag_type; }))).sort();
    var typeOptions = '<option value="">All flag types</option>' + types.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join("");

    var filtered = allFlags.filter(function (f) {
      if (state.qualityFilterType && f.flag_type !== state.qualityFilterType) return false;
      if (state.qualitySearch && String(f.entity).toLowerCase().indexOf(state.qualitySearch.toLowerCase()) === -1) return false;
      return true;
    });
    var pageSize = 50;
    var pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));
    state.qualityPage = Math.min(state.qualityPage, pageCount - 1);
    var pageRows = filtered.slice(state.qualityPage * pageSize, (state.qualityPage + 1) * pageSize);

    var flagRowsHtml = pageRows.map(function (f) {
      // entity/detail ultimately come from an uploaded Excel file's cell
      // values (district/UC/tehsil names, mismatch details) -- escaped
      // since this dashboard's web-app front end accepts uploads from
      // outside this codebase.
      return "<tr><td>" + escHtml(f.period_id || "") + "</td><td>" + escHtml(f.level) + "</td><td>" + escHtml(f.entity) +
        "</td><td>" + escHtml(f.flag_type) + "</td><td>" + escHtml(f.detail || "") + "</td></tr>";
    }).join("");

    var exclRowsHtml = DATA.quality.coverage_exclusions.map(function (r) {
      return "<tr><td>" + escHtml(r.period_id) + "</td><td>" + escHtml(r.level) + "</td><td>" + escHtml(r.entity) + "</td><td>" + escHtml(r.reason) + "</td></tr>";
    }).join("");

    el.innerHTML =
      '<div class="card"><h2>Flags by type</h2><div class="grid kpi-row">' + flagTiles + '</div></div>' +
      '<div class="card"><h2>Excluded rows</h2><div class="grid kpi-row">' + (exclTiles || "<p>None.</p>") + '</div>' +
        '<div class="table-scroll"><table><thead><tr><th>Period</th><th>Level</th><th>Entity</th><th>Reason</th></tr></thead><tbody>' + exclRowsHtml + '</tbody></table></div></div>' +
      '<div class="card"><h2>All flags (' + fmtNum(filtered.length) + ')</h2>' +
        '<div class="controls-row">' +
          '<select class="filter-select" id="quality-type-filter">' + typeOptions + '</select>' +
          '<input type="text" class="search-box" placeholder="Search entity..." id="quality-search" value="' + escHtml(state.qualitySearch) + '">' +
        '</div>' +
        '<div class="table-scroll"><table><thead><tr><th>Period</th><th>Level</th><th>Entity</th><th>Flag type</th><th>Detail</th></tr></thead><tbody>' + flagRowsHtml + '</tbody></table></div>' +
        '<div class="pagination">' +
          '<button id="q-prev" ' + (state.qualityPage === 0 ? "disabled" : "") + '>Prev</button>' +
          '<span>Page ' + (state.qualityPage + 1) + ' of ' + pageCount + '</span>' +
          '<button id="q-next" ' + (state.qualityPage >= pageCount - 1 ? "disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>';

    document.getElementById("quality-type-filter").value = state.qualityFilterType;
    document.getElementById("quality-type-filter").addEventListener("change", function (e) {
      state.qualityFilterType = e.target.value; state.qualityPage = 0; renderQuality();
    });
    var qSearchBox = document.getElementById("quality-search");
    if (searchWasFocused) {
      qSearchBox.focus();
      qSearchBox.setSelectionRange(searchCursorPos, searchCursorPos);
    }
    qSearchBox.addEventListener("input", function (e) {
      state.qualitySearch = e.target.value; state.qualityPage = 0; renderQuality();
    });
    document.getElementById("q-prev").addEventListener("click", function () { state.qualityPage--; renderQuality(); });
    document.getElementById("q-next").addEventListener("click", function () { state.qualityPage++; renderQuality(); });
  }

  // ---------- Dispatch ----------
  function renderTab(name) {
    if (name === "overview") renderOverview();
    else if (name === "coverage") renderCoverage();
    else if (name === "surveillance") renderSurveillance();
    else if (name === "supervision") renderSupervision();
    else if (name === "quality") renderQuality();
  }

  document.getElementById("export-pdf-btn").addEventListener("click", function () {
    window.print();
  });

  renderTab("overview");
})();
</script>
</body>
</html>
