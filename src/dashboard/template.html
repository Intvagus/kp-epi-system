        datasets: [{ label: "2-dose lab-confirmed cases", data: top2dose.map(function (r) { return r.case_count; }),
          backgroundColor: "#b06a00", labelText: top2dose.map(function (r) { return fmtNum(r.case_count); }) }]
      },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grace: "15%" } } }
    });

    var tBuckets = dq.timeliness.buckets;
    charts.mslTimeliness = new Chart(document.getElementById("chart-msl-timeliness"), {
      type: "bar",
      data: {
        labels: tOrder,
        datasets: [{ label: "Cases", data: tOrder.map(function (k) { return tBuckets[k] || 0; }),
          backgroundColor: ["#1e8e3e", "#b06a00", "#c5221f"], labelText: tOrder.map(function (k) { return fmtNum(tBuckets[k] || 0); }) }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { y: { grace: "15%" } } }
    });

    var dtrend = diph.weekly_trend;
    charts.diphTrend = new Chart(document.getElementById("chart-diph-trend"), {
      type: "bar",
      data: { labels: dtrend.map(function (r) { return "W" + r.epi_week; }), datasets: [{ label: "Cases", data: dtrend.map(function (r) { return r.case_count; }), backgroundColor: "#7d3c98" }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }

  // ================= MONITORING (RCA + Supervisory Checklist) =================
  function monitoringKpiCard(label, value, sub) {
    return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  function ratePct(pct) { return pct === null || pct === undefined ? "—" : pct.toFixed(1) + "%"; }
  function rateColor(pct, goodMin, warnMin) {
    if (pct === null || pct === undefined) return "#9aa0a6";
    return pct >= goodMin ? "#1e8e3e" : pct >= warnMin ? "#b06a00" : "#c5221f";
  }
  // "45 (32%)" -- the number first, percentage in parentheses, used on
  // every count-based chart in Monitoring so a value is readable without
  // hovering.
  function countPct(count, total) {
    var pct = total ? (count / total * 100) : null;
    return fmtNum(count) + (pct === null ? "" : " (" + pct.toFixed(1) + "%)");
  }

  function renderRcaSection(rca) {
    if (rca.status === "awaiting_data") {
      return '<div class="card"><h2><span class="disease-tag" style="background:var(--rca);"></span>RCA &mdash; Rapid Convenience Assessment</h2>' +
        '<div class="placeholder-card"><div class="icon">⏳</div>' + escHtml(rca.message) + '</div></div>';
    }
    var ov = rca.overview, zd = rca.zero_dose;
    var kpis = [
      monitoringKpiCard("Children assessed", fmtNum(ov.total_children_assessed), rca.reporting_window || ""),
      monitoringKpiCard("RCA visits", fmtNum(ov.total_rca_visits), ov.districts_covered + " district(s)"),
      monitoringKpiCard("Zero-dose children", fmtNum(zd.zero_dose_count), fmtPct(zd.zero_dose_pct) + " of " + fmtNum(zd.assessed_count) + " assessed"),
      monitoringKpiCard("Monitors involved", fmtNum(ov.monitors_involved), ""),
    ].join("");

    var zdAnomalyHtml = "";
    if (zd.zero_dose_count > 0) {
      var zdRows = zd.by_district.map(function (r) {
        return "<tr><td>" + escHtml(r.district) + "</td><td>" + fmtNum(r.zero_dose_count) + "</td></tr>";
      }).join("");
      zdAnomalyHtml = '<div class="anomaly-box"><h3>Zero-dose children identified, for field follow-up</h3>' +
        '<div class="table-scroll"><table><thead><tr><th>District</th><th>Zero-dose count</th></tr></thead><tbody>' + zdRows + '</tbody></table></div></div>';
    }

    var overviewInsightId = "monitoring-rca-summary-" + (rca.reporting_window || "");
    var overviewAutoInsight = fmtNum(ov.total_children_assessed) + " children assessed across " + fmtNum(ov.total_rca_visits) +
      " RCA visits (" + (rca.reporting_window || "period not recorded") + ") in " + fmtNum(ov.districts_covered) + " district(s), by " +
      fmtNum(ov.monitors_involved) + " monitor(s). " + fmtNum(zd.zero_dose_count) +
      " zero-dose child(ren) identified (" + fmtPct(zd.zero_dose_pct) + " of " + fmtNum(zd.assessed_count) + " assessed for Penta1).";

    var antigenInsightId = "monitoring-rca-antigen-" + (rca.reporting_window || "");
    var lowestAntigen = rca.antigen_coverage.filter(function (r) { return r.pct !== null; })
      .reduce(function (worst, r) { return (worst === null || r.pct < worst.pct) ? r : worst; }, null);
    var antigenAutoInsight = lowestAntigen
      ? "Lowest field-verified coverage: " + lowestAntigen.antigen + " at " + fmtPct(lowestAntigen.pct) +
        " (" + lowestAntigen.vaccinated + " of " + lowestAntigen.assessed + " applicable children)."
      : "No antigen coverage data available.";

    var ageKeys = Object.keys(rca.age_group_breakdown);
    var ageTotal = ageKeys.reduce(function (s, k) { return s + rca.age_group_breakdown[k]; }, 0);
    var ageSexInsightId = "monitoring-rca-agesex-" + (rca.reporting_window || "");
    var largestAgeGroup = ageKeys.reduce(function (best, k) { return (!best || rca.age_group_breakdown[k] > rca.age_group_breakdown[best]) ? k : best; }, null);
    var ageSexAutoInsight = largestAgeGroup
      ? "Largest age group assessed: " + largestAgeGroup + " months (" + countPct(rca.age_group_breakdown[largestAgeGroup], ageTotal) + " of children assessed)."
      : "No age distribution data available.";

    var areaTotal = ov.total_children_assessed;
    var htr = rca.hard_to_reach, hrp = rca.high_risk_population;
    var areaInsightId = "monitoring-rca-area-" + (rca.reporting_window || "");
    var ruralRow = rca.area_type_breakdown.filter(function (r) { return /rural/i.test(r.area_type); })[0];
    var areaAutoInsight = (ruralRow ? "Rural areas account for " + countPct(ruralRow.children_assessed, areaTotal) + " of children assessed. " : "") +
      countPct(htr.children_in_hard_to_reach, areaTotal) + " were in hard-to-reach areas, and " +
      countPct(hrp.children_in_high_risk_population, areaTotal) + " were in high-risk population groups.";

    var mb = rca.monitor_breakdown;
    var designationKeys = Object.keys(mb.by_designation);
    var agencyKeys = Object.keys(mb.by_agency);
    var monitorInsightId = "monitoring-rca-monitors-" + (rca.reporting_window || "");
    var topDesignation = designationKeys.reduce(function (best, k) { return (!best || mb.by_designation[k] > mb.by_designation[best]) ? k : best; }, null);
    var topAgency = agencyKeys.reduce(function (best, k) { return (!best || mb.by_agency[k] > mb.by_agency[best]) ? k : best; }, null);
    var monitorAutoInsight = (topDesignation ? "Most RCA visits were conducted by " + topDesignation + " monitors (" + countPct(mb.by_designation[topDesignation], ov.total_rca_visits) + " of visits). " : "") +
      (topAgency ? topAgency + " conducted " + countPct(mb.by_agency[topAgency], ov.total_rca_visits) + " of visits." : "");

    var sourceInsightId = "monitoring-rca-source-" + (rca.reporting_window || "");
    var sourceKeys = Object.keys(rca.vaccine_source_breakdown);
    var sourceTotal = sourceKeys.reduce(function (s, k) { return s + rca.vaccine_source_breakdown[k]; }, 0);
    var infoSourceKeys = Object.keys(rca.info_source_breakdown);
    var topInfoSource = infoSourceKeys.reduce(function (best, k) { return (!best || rca.info_source_breakdown[k] > rca.info_source_breakdown[best]) ? k : best; }, null);
    var sourceAutoInsight = "Vaccination status was confirmed by card for " + countPct(rca.vaccine_source_breakdown["card"] || 0, sourceTotal) + " of children" +
      (topInfoSource ? "; the most-cited social mobilization channel was " + topInfoSource + " (" + fmtNum(rca.info_source_breakdown[topInfoSource]) + " mention(s))." : ".");

    var reasonsKeys = Object.keys(rca.non_vaccination_reasons);
    var reasonsTotal = reasonsKeys.reduce(function (s, k) { return s + rca.non_vaccination_reasons[k]; }, 0);
    var reasonsInsightId = "monitoring-rca-reasons-" + (rca.reporting_window || "");
    var topReason = reasonsKeys.reduce(function (best, k) { return (!best || rca.non_vaccination_reasons[k] > rca.non_vaccination_reasons[best]) ? k : best; }, null);
    var reasonsAutoInsight = topReason
      ? "Most-cited reason for non-vaccination: \"" + topReason + "\" (" + countPct(rca.non_vaccination_reasons[topReason], reasonsTotal) + " of " + fmtNum(reasonsTotal) + " recorded reasons)."
      : "";

    var trendInsightId = "monitoring-rca-trend-" + (rca.reporting_window || "");
    var trendAutoInsight = "";
    if (rca.daily_visit_trend.length > 1) {
      var trendPeak = rca.daily_visit_trend.reduce(function (b, r) { return r.children_assessed > b.children_assessed ? r : b; });
      trendAutoInsight = "Busiest day: " + trendPeak.visit_date + " with " + fmtNum(trendPeak.children_assessed) + " children assessed.";
    }

    var mapInsightId = "monitoring-rca-map-" + (rca.reporting_window || "");
    var mapDistricts = rca.district_map ? Object.keys(rca.district_map.features) : [];
    var mapTopDistrict = mapDistricts.reduce(function (best, name) {
      var v = rca.district_map.features[name].children_assessed;
      return (!best || v > rca.district_map.features[best].children_assessed) ? name : best;
    }, null);
    var mapAutoInsight = mapTopDistrict
      ? mapTopDistrict + " had the most RCA activity (" + fmtNum(rca.district_map.features[mapTopDistrict].children_assessed) + " children assessed across " +
        fmtNum(rca.district_map.features[mapTopDistrict].rca_visits) + " visit(s))." +
        (rca.district_map.unmapped_districts.length ? " Not shown on map (no boundary match): " + rca.district_map.unmapped_districts.join(", ") + "." : "")
      : "No district data available to map.";

    var html =
      '<div class="section-heading"><h2><span class="disease-tag" style="background:var(--rca);"></span>RCA &mdash; Rapid Convenience Assessment</h2>' +
        '<p class="sub">Community-based, child-level spot checks of vaccination status.</p></div>' +
      '<div class="card">' +
        '<div class="grid kpi-row">' + kpis + '</div>' +
        editableInsight(overviewInsightId, overviewAutoInsight) +
        zdAnomalyHtml +
      '</div>' +
      (mapDistricts.length ? '<div class="card"><h2>🗺️ RCA Coverage Map</h2>' +
        singleDistrictMapHtml("map-rca", "map-tooltip-rca", "Children assessed by district", "District boundaries: geoBoundaries.org (CC-BY 4.0)") +
        editableInsight(mapInsightId, mapAutoInsight) +
      '</div>' : "") +
      '<div class="card"><h2>Antigen-wise Vaccination Status (field-verified)</h2>' +
        '<div class="chart-wrap tall"><canvas id="chart-rca-antigen"></canvas></div>' +
        '<p class="sub">Children vaccinated, of those for whom each antigen was applicable by age (excludes children not yet due).</p>' +
        editableInsight(antigenInsightId, antigenAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Age &amp; Sex Profile</h2>' +
        '<div class="grid two-col">' +
          '<div><h3>Age Group</h3><div class="chart-wrap"><canvas id="chart-rca-age"></canvas></div></div>' +
          '<div><h3>Sex</h3><div class="chart-wrap"><canvas id="chart-rca-sex"></canvas></div></div>' +
        '</div>' +
        editableInsight(ageSexInsightId, ageSexAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Area Profile</h2>' +
        '<div class="grid three-col">' +
          '<div><h3>Urban / Rural</h3><div class="chart-wrap"><canvas id="chart-rca-areatype"></canvas></div></div>' +
          '<div><h3>Hard-to-Reach Area</h3><div class="chart-wrap"><canvas id="chart-rca-htr"></canvas></div></div>' +
          '<div><h3>High-Risk Population</h3><div class="chart-wrap"><canvas id="chart-rca-hrp"></canvas></div></div>' +
        '</div>' +
        editableInsight(areaInsightId, areaAutoInsight) +
      '</div>' +
      '<div class="card"><h2>RCA Visits by Monitor</h2>' +
        '<div class="grid two-col">' +
          '<div><h3>By Designation</h3><div class="chart-wrap"><canvas id="chart-rca-designation"></canvas></div></div>' +
          '<div><h3>By Agency</h3><div class="chart-wrap"><canvas id="chart-rca-agency"></canvas></div></div>' +
        '</div>' +
        editableInsight(monitorInsightId, monitorAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Verification Source &amp; Social Mobilization</h2>' +
        '<div class="grid two-col">' +
          '<div><h3>Vaccine Source</h3><div class="chart-wrap"><canvas id="chart-rca-source"></canvas></div>' +
            '<p class="sub">Card = confirmed against a written record; recall = caregiver memory only.</p></div>' +
          '<div><h3>Social Mobilization Channel</h3><div class="chart-wrap"><canvas id="chart-rca-infosource"></canvas></div></div>' +
        '</div>' +
        editableInsight(sourceInsightId, sourceAutoInsight) +
      '</div>' +
      (reasonsKeys.length ? '<div class="card"><h2>Reasons for Non-Vaccination</h2><div class="chart-wrap"><canvas id="chart-rca-reasons"></canvas></div>' +
        editableInsight(reasonsInsightId, reasonsAutoInsight) + '</div>' : "") +
      (rca.daily_visit_trend.length > 1 ? '<div class="card"><h2>Daily Visit Trend</h2><div class="chart-wrap"><canvas id="chart-rca-trend"></canvas></div>' +
        editableInsight(trendInsightId, trendAutoInsight) + '</div>' : "");

    return { html: html, build: function () {
      destroyChart("rcaAntigen"); destroyChart("rcaAge"); destroyChart("rcaSex"); destroyChart("rcaAreaType");
      destroyChart("rcaHtr"); destroyChart("rcaHrp"); destroyChart("rcaDesignation"); destroyChart("rcaAgency");
      destroyChart("rcaSource"); destroyChart("rcaInfoSource"); destroyChart("rcaReasons"); destroyChart("rcaTrend");

      if (mapDistricts.length) {
        renderSingleDistrictMap("map-rca", "map-tooltip-rca", rca.district_map,
          function (entry) { return entry.children_assessed; },
          function (label, entry) {
            return label + "<br>Children assessed: " + fmtNum(entry.children_assessed) + "<br>RCA visits: " + fmtNum(entry.rca_visits) +
              "<br>Zero-dose: " + fmtNum(entry.zero_dose_count) + " (" + fmtPct(entry.zero_dose_pct) + ")";
          });
      }

      charts.rcaAntigen = new Chart(document.getElementById("chart-rca-antigen"), {
        type: "bar",
        data: {
          labels: rca.antigen_coverage.map(function (r) { return r.antigen; }),
          datasets: [{ label: "Vaccinated (of applicable)", data: rca.antigen_coverage.map(function (r) { return r.vaccinated; }),
            backgroundColor: rca.antigen_coverage.map(function (r) { return targetMetColor(r.pct === null ? 0 : r.pct); }),
            labelText: rca.antigen_coverage.map(function (r) { return r.pct === null ? "n/a" : countPct(r.vaccinated, r.assessed); }) }]
        },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "20%" } } }
      });

      charts.rcaAge = new Chart(document.getElementById("chart-rca-age"), {
        type: "bar",
        data: { labels: ageKeys, datasets: [{ label: "Children", data: ageKeys.map(function (k) { return rca.age_group_breakdown[k]; }),
          backgroundColor: "#1a5fb4", labelText: ageKeys.map(function (k) { return countPct(rca.age_group_breakdown[k], ageTotal); }) }] },
        options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 22 } }, plugins: { legend: { display: false } }, scales: { y: { grace: "15%" } } }
      });

      var rcaSexDoughnut = doughnutData(rca.sex_breakdown);
      charts.rcaSex = new Chart(document.getElementById("chart-rca-sex"), {
        type: "doughnut",
        data: { labels: rcaSexDoughnut.labels, datasets: [{ data: rcaSexDoughnut.values, backgroundColor: rcaSexDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom" } } }
      });

      var areaTypeCounts = {};
      rca.area_type_breakdown.forEach(function (r) { areaTypeCounts[r.area_type] = r.children_assessed; });
      var areaTypeDoughnut = doughnutData(areaTypeCounts);
      charts.rcaAreaType = new Chart(document.getElementById("chart-rca-areatype"), {
        type: "doughnut",
        data: { labels: areaTypeDoughnut.labels, datasets: [{ data: areaTypeDoughnut.values, backgroundColor: areaTypeDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var htrDoughnut = doughnutData({ "Yes": htr.children_in_hard_to_reach, "No": areaTotal - htr.children_in_hard_to_reach });
      charts.rcaHtr = new Chart(document.getElementById("chart-rca-htr"), {
        type: "doughnut",
        data: { labels: htrDoughnut.labels, datasets: [{ data: htrDoughnut.values, backgroundColor: ["#b06a00", "#1a5fb4"] }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var hrpDoughnut = doughnutData({ "Yes": hrp.children_in_high_risk_population, "No": areaTotal - hrp.children_in_high_risk_population });
      charts.rcaHrp = new Chart(document.getElementById("chart-rca-hrp"), {
        type: "doughnut",
        data: { labels: hrpDoughnut.labels, datasets: [{ data: hrpDoughnut.values, backgroundColor: ["#c5221f", "#1a5fb4"] }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var designationTotal = designationKeys.reduce(function (s, k) { return s + mb.by_designation[k]; }, 0);
      charts.rcaDesignation = new Chart(document.getElementById("chart-rca-designation"), {
        type: "bar",
        data: { labels: designationKeys, datasets: [{ label: "RCA visits", data: designationKeys.map(function (k) { return mb.by_designation[k]; }),
          backgroundColor: "#0f766e", labelText: designationKeys.map(function (k) { return countPct(mb.by_designation[k], designationTotal); }) }] },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "25%" } } }
      });

      var agencyDoughnut = doughnutData(mb.by_agency);
      charts.rcaAgency = new Chart(document.getElementById("chart-rca-agency"), {
        type: "doughnut",
        data: { labels: agencyDoughnut.labels, datasets: [{ data: agencyDoughnut.values, backgroundColor: agencyDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var rcaSourceDoughnut = doughnutData(rca.vaccine_source_breakdown);
      charts.rcaSource = new Chart(document.getElementById("chart-rca-source"), {
        type: "doughnut",
        data: { labels: rcaSourceDoughnut.labels, datasets: [{ data: rcaSourceDoughnut.values, backgroundColor: rcaSourceDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom" } } }
      });

      var infoSourceTotal = infoSourceKeys.reduce(function (s, k) { return s + rca.info_source_breakdown[k]; }, 0);
      charts.rcaInfoSource = new Chart(document.getElementById("chart-rca-infosource"), {
        type: "bar",
        data: { labels: infoSourceKeys, datasets: [{ label: "Mentions", data: infoSourceKeys.map(function (k) { return rca.info_source_breakdown[k]; }),
          backgroundColor: "#0f766e", labelText: infoSourceKeys.map(function (k) { return countPct(rca.info_source_breakdown[k], infoSourceTotal); }) }] },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "25%" } } }
      });

      if (reasonsKeys.length) {
        charts.rcaReasons = new Chart(document.getElementById("chart-rca-reasons"), {
          type: "bar",
          data: { labels: reasonsKeys, datasets: [{ label: "Cases", data: reasonsKeys.map(function (k) { return rca.non_vaccination_reasons[k]; }),
            backgroundColor: "#c5221f", labelText: reasonsKeys.map(function (k) { return countPct(rca.non_vaccination_reasons[k], reasonsTotal); }) }] },
          options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "25%" } } }
        });
      }
      if (rca.daily_visit_trend.length > 1) {
        var rcaTrendValues = rca.daily_visit_trend.map(function (r) { return r.children_assessed; });
        var rcaTrendLabels = peakLatestLabels(rcaTrendValues);
        charts.rcaTrend = new Chart(document.getElementById("chart-rca-trend"), {
          type: "line",
          data: { labels: rca.daily_visit_trend.map(function (r) { return r.visit_date; }),
            datasets: [{ label: "Children assessed", data: rcaTrendValues, borderColor: "#0f766e", backgroundColor: "#0f766e", tension: 0.2,
              pointRadius: rcaTrendLabels.map(function (l) { return l ? 4 : 2; }), labelText: rcaTrendLabels }] },
          options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 24 } }, plugins: { legend: { display: false } } }
        });
      }
    } };
  }

  function renderSupervisorySection(sup) {
    if (sup.status === "awaiting_data") {
      return { html:
        '<div class="section-divider"><div class="line"></div><div class="label">Supervisory Checklist</div><div class="line"></div></div>' +
        '<div class="card"><h2><span class="disease-tag" style="background:var(--supervisory);"></span>Supervisory Checklist</h2>' +
        '<div class="placeholder-card"><div class="icon">⏳</div>' + escHtml(sup.message) + '</div></div>', build: function () {} };
    }
    var ov = sup.overview;
    var kpis = [
      monitoringKpiCard("Supervisory visits", fmtNum(ov.total_visits), sup.reporting_window || ""),
      monitoringKpiCard("Facilities covered", fmtNum(ov.facilities_covered), ov.districts_covered + " district(s)"),
      monitoringKpiCard("Fixed-site-open rate", ratePct(sup.fixed_site_open_rate.pct), sup.fixed_site_open_rate.answered + " fixed-site visits checked"),
      monitoringKpiCard("Monitors involved", fmtNum(ov.monitors_involved), ""),
    ].join("");

    var scoreCards = sup.composite_scores.map(function (s) {
      return monitoringKpiCard(s.category, ratePct(s.avg_pct), "range " + ratePct(s.min_pct) + " – " + ratePct(s.max_pct));
    }).join("");

    var serviceFunctionalityCaveat = sup.composite_scores.some(function (s) { return s.category === "Service Functionality" && s.avg_pct === 0; })
      ? '<p class="sub">Note: "Service Functionality" reflects the UC-level microplan checklist block, which was not answered in any visit in this dataset -- a 0% average here means that section wasn\'t used during these visits, not that facilities failed every item.</p>' : "";

    var riskHtml = "";
    if (sup.practice_risk_flags.length) {
      var riskPills = sup.practice_risk_flags.map(function (r) {
        return '<span class="badge poor">' + escHtml(r.item) + ": " + countPct(r.yes, r.answered) + '</span>';
      }).join(" ");
      riskHtml = '<div class="alert-pills" style="margin-top:10px;">' + riskPills + '</div>';
    }

    var cc = sup.cold_chain;
    var coldChainKpis = [
      monitoringKpiCard("Backup power available", ratePct(cc.backup_power_available.pct), cc.backup_power_available.answered + " visits checked"),
      monitoringKpiCard("SDD fridges functional", cc.sdd.total_units ? ratePct(Math.min(cc.sdd.pct_functional, 100)) : "—", cc.sdd.functional_units + "/" + cc.sdd.total_units + " units" + (cc.sdd.inconsistent_visits ? " (data inconsistency flagged)" : "")),
      monitoringKpiCard("ILR functional units observed", fmtNum(cc.ilr_functional_units_observed), "no installed-base total in source data"),
      monitoringKpiCard("Stockout in last 3 months", ratePct(cc.stockout_last_3_months.pct), cc.stockout_last_3_months.answered + " visits checked"),
    ].join("");

    var compItems = sup.compliance_items;

    var districtRowsHtml = sup.district_breakdown.map(function (r) {
      return "<tr><td>" + escHtml(r.district) + "</td><td>" + fmtNum(r.visits) + "</td><td>" + ratePct(r.score_service_functionality) +
        "</td><td>" + ratePct(r.score_monitoring_system_quality) + "</td><td>" + ratePct(r.score_operations_quality) +
        "</td><td>" + ratePct(r.score_practices_knowledge) + "</td></tr>";
    }).join("");

    function facilityRankRows(list) {
      return list.map(function (r) {
        return "<tr><td>" + escHtml(r.health_facility) + "</td><td>" + escHtml(r.district) + "</td><td>" + ratePct(r.pct) + "</td></tr>";
      }).join("");
    }
    var rankings = sup.facility_rankings_operations_quality;

    var overviewInsightId = "monitoring-supervisory-summary-" + (sup.reporting_window || "");
    var overviewAutoInsight = fmtNum(ov.total_visits) + " supervisory visits to " + fmtNum(ov.facilities_covered) + " facilities (" +
      (sup.reporting_window || "period not recorded") + "), " + fmtNum(ov.districts_covered) + " district(s), by " + fmtNum(ov.monitors_involved) + " monitor(s)." +
      (sup.practice_risk_flags.length ? " " + sup.practice_risk_flags[0].item + " observed in " + ratePct(sup.practice_risk_flags[0].pct) + " of visits." : "");

    var scoresInsightId = "monitoring-supervisory-scores-" + (sup.reporting_window || "");
    var bestScore = sup.composite_scores.reduce(function (b, s) { return (s.avg_pct !== null && (!b || s.avg_pct > b.avg_pct)) ? s : b; }, null);
    var worstScore = sup.composite_scores.reduce(function (w, s) { return (s.avg_pct !== null && (!w || s.avg_pct < w.avg_pct)) ? s : w; }, null);
    var scoresAutoInsight = (bestScore && worstScore)
      ? "Highest-scoring category: " + bestScore.category + " (" + ratePct(bestScore.avg_pct) + " average). Lowest: " + worstScore.category + " (" + ratePct(worstScore.avg_pct) + " average)."
      : "";

    var complianceInsightId = "monitoring-supervisory-compliance-" + (sup.reporting_window || "");
    var weakestItem = compItems.length ? compItems[0] : null;
    var complianceAutoInsight = weakestItem
      ? "Weakest checklist item: \"" + weakestItem.item + "\" at " + countPct(weakestItem.yes, weakestItem.answered) + " compliance."
      : "";

    var coldChainInsightId = "monitoring-supervisory-coldchain-" + (sup.reporting_window || "");
    var coldChainAutoInsight = "Backup power was available at " + countPct(cc.backup_power_available.yes, cc.backup_power_available.answered) + " of visited sites, with " +
      countPct(cc.stockout_last_3_months.yes, cc.stockout_last_3_months.answered) + " reporting a stockout in the last 3 months.";

    var siteTypeInsightId = "monitoring-supervisory-sitetype-" + (sup.reporting_window || "");
    var siteTypeKeys = Object.keys(sup.site_type_breakdown);
    var siteTypeTotal = siteTypeKeys.reduce(function (s, k) { return s + sup.site_type_breakdown[k]; }, 0);
    var topSiteType = siteTypeKeys.reduce(function (best, k) { return (!best || sup.site_type_breakdown[k] > sup.site_type_breakdown[best]) ? k : best; }, null);
    var siteTypeAutoInsight = topSiteType ? "Most visits were to " + topSiteType + " sites (" + countPct(sup.site_type_breakdown[topSiteType], siteTypeTotal) + " of visits)." : "";

    var trendInsightId = "monitoring-supervisory-trend-" + (sup.reporting_window || "");
    var trendAutoInsight = "";
    if (sup.daily_visit_trend.length > 1) {
      var supTrendPeak = sup.daily_visit_trend.reduce(function (b, r) { return r.visits > b.visits ? r : b; });
      trendAutoInsight = "Busiest day: " + supTrendPeak.visit_date + " with " + fmtNum(supTrendPeak.visits) + " visit(s).";
    }

    var districtInsightId = "monitoring-supervisory-district-" + (sup.reporting_window || "");
    var districtAutoInsight = sup.district_breakdown.length
      ? sup.district_breakdown.length + " district(s) covered; " + sup.district_breakdown[0].district + " received the most visits (" + fmtNum(sup.district_breakdown[0].visits) + ")."
      : "";

    var facilityInsightId = "monitoring-supervisory-facility-" + (sup.reporting_window || "");
    var facilityAutoInsight = (rankings.top.length && rankings.bottom.length)
      ? "Highest Operations Quality: " + rankings.top[0].health_facility + " (" + ratePct(rankings.top[0].pct) + "). Lowest: " +
        rankings.bottom[rankings.bottom.length - 1].health_facility + " (" + ratePct(rankings.bottom[rankings.bottom.length - 1].pct) + ")."
      : "";

    var mapInsightId = "monitoring-supervisory-map-" + (sup.reporting_window || "");
    var mapDistricts = sup.district_map ? Object.keys(sup.district_map.features) : [];
    var mapTopDistrict = mapDistricts.reduce(function (best, name) {
      var v = sup.district_map.features[name].visits;
      return (!best || v > sup.district_map.features[best].visits) ? name : best;
    }, null);
    var mapAutoInsight = mapTopDistrict
      ? mapTopDistrict + " had the most supervisory activity (" + fmtNum(sup.district_map.features[mapTopDistrict].visits) + " visit(s) to " +
        fmtNum(sup.district_map.features[mapTopDistrict].facilities) + " facilities)." +
        (sup.district_map.unmapped_districts.length ? " Not shown on map (no boundary match): " + sup.district_map.unmapped_districts.join(", ") + "." : "")
      : "No district data available to map.";

    var html =
      '<div class="section-divider"><div class="line"></div><div class="label">Supervisory Checklist</div><div class="line"></div></div>' +
      '<div class="section-heading"><h2><span class="disease-tag" style="background:var(--supervisory);"></span>Supervisory Checklist</h2>' +
        '<p class="sub">Facility-level supervisory visits assessing site readiness, cold chain, injection safety, and service quality.</p></div>' +
      '<div class="card">' +
        '<div class="grid kpi-row">' + kpis + '</div>' +
        editableInsight(overviewInsightId, overviewAutoInsight) +
        riskHtml +
      '</div>' +
      (mapDistricts.length ? '<div class="card"><h2>🗺️ Supervisory Checklist Coverage Map</h2>' +
        singleDistrictMapHtml("map-sup", "map-tooltip-sup", "Supervisory visits by district", "District boundaries: geoBoundaries.org (CC-BY 4.0)") +
        editableInsight(mapInsightId, mapAutoInsight) +
      '</div>' : "") +
      '<div class="card"><h2>Composite Compliance Scores</h2><div class="grid kpi-row">' + scoreCards + '</div>' + serviceFunctionalityCaveat +
        editableInsight(scoresInsightId, scoresAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Checklist Item Compliance (weakest first)</h2><div class="chart-wrap" style="height:' + Math.max(260, compItems.length * 24) + 'px;"><canvas id="chart-sup-compliance"></canvas></div>' +
        editableInsight(complianceInsightId, complianceAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Cold Chain &amp; Vaccine Supply</h2><div class="grid kpi-row">' + coldChainKpis + '</div>' +
        editableInsight(coldChainInsightId, coldChainAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Site Type</h2><div class="chart-wrap"><canvas id="chart-sup-sitetype"></canvas></div>' +
        editableInsight(siteTypeInsightId, siteTypeAutoInsight) +
      '</div>' +
      (sup.daily_visit_trend.length > 1 ? '<div class="card"><h2>Daily Visit Trend</h2><div class="chart-wrap"><canvas id="chart-sup-trend"></canvas></div>' +
        editableInsight(trendInsightId, trendAutoInsight) + '</div>' : "") +
      '<div class="card"><h2>District-wise Composite Scores</h2>' +
        '<div class="table-scroll"><table><thead><tr><th>District</th><th>Visits</th><th>Service Functionality</th><th>Monitoring System Quality</th><th>Operations Quality</th><th>Practices &amp; Knowledge</th></tr></thead><tbody>' + districtRowsHtml + '</tbody></table></div>' +
        editableInsight(districtInsightId, districtAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Facility Rankings (Operations Quality)</h2>' +
        '<div class="grid two-col">' +
          '<div><h3>Top 5</h3><div class="table-scroll"><table><thead><tr><th>Facility</th><th>District</th><th>Score</th></tr></thead><tbody>' + facilityRankRows(rankings.top) + '</tbody></table></div></div>' +
          '<div><h3>Bottom 5</h3><div class="table-scroll"><table><thead><tr><th>Facility</th><th>District</th><th>Score</th></tr></thead><tbody>' + facilityRankRows(rankings.bottom) + '</tbody></table></div></div>' +
        '</div>' +
        editableInsight(facilityInsightId, facilityAutoInsight) +
      '</div>';

    return { html: html, build: function () {
      destroyChart("supCompliance"); destroyChart("supSiteType"); destroyChart("supTrend");

      if (mapDistricts.length) {
        renderSingleDistrictMap("map-sup", "map-tooltip-sup", sup.district_map,
          function (entry) { return entry.visits; },
          function (label, entry) {
            return label + "<br>Supervisory visits: " + fmtNum(entry.visits) + "<br>Facilities: " + fmtNum(entry.facilities) +
              "<br>Operations Quality: " + ratePct(entry.score_operations_quality);
          });
      }

      charts.supCompliance = new Chart(document.getElementById("chart-sup-compliance"), {
        type: "bar",
        data: {
          labels: compItems.map(function (r) { return r.item; }),
          datasets: [{ label: "Yes", data: compItems.map(function (r) { return r.yes; }),
            backgroundColor: compItems.map(function (r) { return rateColor(r.pct, 80, 50); }),
            labelText: compItems.map(function (r) { return countPct(r.yes, r.answered); }) }]
        },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "20%" } } }
      });

      var supSiteDoughnut = doughnutData(sup.site_type_breakdown);
      charts.supSiteType = new Chart(document.getElementById("chart-sup-sitetype"), {
        type: "doughnut",
        data: { labels: supSiteDoughnut.labels, datasets: [{ data: supSiteDoughnut.values, backgroundColor: supSiteDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom" } } }
      });

      if (sup.daily_visit_trend.length > 1) {
        var supTrendValues = sup.daily_visit_trend.map(function (r) { return r.visits; });
        var supTrendLabels = peakLatestLabels(supTrendValues);
        charts.supTrend = new Chart(document.getElementById("chart-sup-trend"), {
          type: "line",
          data: { labels: sup.daily_visit_trend.map(function (r) { return r.visit_date; }),
            datasets: [{ label: "Visits", data: supTrendValues, borderColor: "#b45309", backgroundColor: "#b45309", tension: 0.2,
              pointRadius: supTrendLabels.map(function (l) { return l ? 4 : 2; }), labelText: supTrendLabels }] },
          options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 24 } }, plugins: { legend: { display: false } } }
        });
      }
    } };
  }

  function renderSupervision() {
    var el = document.getElementById("tab-supervision");
    var m = DATA.monitoring;
    if (m.rca.status === "awaiting_data" && m.supervisory.status === "awaiting_data") {
      el.innerHTML = '<div class="card"><h2>Monitoring and Supervision</h2><div class="placeholder-card"><div class="icon">⏳</div>' +
        'No RCA or Supervisory Checklist data has been received yet. This tab will populate automatically once either file is uploaded.</div></div>';
      return;
    }
    var rcaResult = renderRcaSection(m.rca);
    var supResult = renderSupervisorySection(m.supervisory);
    el.innerHTML = rcaResult.html + supResult.html;
    wireEditableInsights(el);
    rcaResult.build();
    supResult.build();
  }

  // ================= DATA QUALITY =================
  function renderQuality() {
    var el = document.getElementById("tab-quality");
    // Same focus-loss issue as the Coverage Explorer's search box -- see its
    // comment for why this save/restore is needed.
    var searchWasFocused = document.activeElement && document.activeElement.id === "quality-search";
    var searchCursorPos = searchWasFocused ? document.activeElement.selectionStart : null;
    var rep = DATA.quality.coverage_report;
    var flagTiles = Object.keys(rep.flags_by_type || {}).map(function (k) {
      return diseaseKpiCard(k.replace(/_/g, " "), fmtNum(rep.flags_by_type[k]), "coverage domain");
    }).join("");
    var exclTiles = Object.keys(rep.exclusions_by_reason || {}).map(function (k) {
      return diseaseKpiCard("excluded", fmtNum(rep.exclusions_by_reason[k]), k);
    }).join("");

    var allFlags = DATA.quality.coverage_flags.concat(
      DATA.quality.vpd_flags.map(function (f) { return Object.assign({}, f, { level: f.level }); })
    );
    var types = Array.from(new Set(allFlags.map(function (f) { return f.flag_type; }))).sort();
    var typeOptions = '<option value="">All flag types</option>' + types.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join("");

    var filtered = allFlags.filter(function (f) {
      if (state.qualityFilterType && f.flag_type !== state.qualityFilterType) return false;
      if (state.qualitySearch && String(f.entity).toLowerCase().indexOf(state.qualitySearch.toLowerCase()) === -1) return false;
      return true;
    });
    var pageSize = 50;
    var pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));
    state.qualityPage = Math.min(state.qualityPage, pageCount - 1);
    var pageRows = filtered.slice(state.qualityPage * pageSize, (state.qualityPage + 1) * pageSize);

    var flagRowsHtml = pageRows.map(function (f) {
      // entity/detail ultimately come from an uploaded Excel file's cell
      // values (district/UC/tehsil names, mismatch details) -- escaped
      // since this dashboard's web-app front end accepts uploads from
      // outside this codebase.
      return "<tr><td>" + escHtml(f.period_id || "") + "</td><td>" + escHtml(f.level) + "</td><td>" + escHtml(f.entity) +
        "</td><td>" + escHtml(f.flag_type) + "</td><td>" + escHtml(f.detail || "") + "</td></tr>";
    }).join("");

    var exclRowsHtml = DATA.quality.coverage_exclusions.map(function (r) {
      return "<tr><td>" + escHtml(r.period_id) + "</td><td>" + escHtml(r.level) + "</td><td>" + escHtml(r.entity) + "</td><td>" + escHtml(r.reason) + "</td></tr>";
    }).join("");

    el.innerHTML =
      '<div class="card"><h2>Flags by type</h2><div class="grid kpi-row">' + flagTiles + '</div></div>' +
      '<div class="card"><h2>Excluded rows</h2><div class="grid kpi-row">' + (exclTiles || "<p>None.</p>") + '</div>' +
        '<div class="table-scroll"><table><thead><tr><th>Period</th><th>Level</th><th>Entity</th><th>Reason</th></tr></thead><tbody>' + exclRowsHtml + '</tbody></table></div></div>' +
      '<div class="card"><h2>All flags (' + fmtNum(filtered.length) + ')</h2>' +
        '<div class="controls-row">' +
          '<select class="filter-select" id="quality-type-filter">' + typeOptions + '</select>' +
          '<input type="text" class="search-box" placeholder="Search entity..." id="quality-search" value="' + escHtml(state.qualitySearch) + '">' +
        '</div>' +
        '<div class="table-scroll"><table><thead><tr><th>Period</th><th>Level</th><th>Entity</th><th>Flag type</th><th>Detail</th></tr></thead><tbody>' + flagRowsHtml + '</tbody></table></div>' +
        '<div class="pagination">' +
          '<button id="q-prev" ' + (state.qualityPage === 0 ? "disabled" : "") + '>Prev</button>' +
          '<span>Page ' + (state.qualityPage + 1) + ' of ' + pageCount + '</span>' +
          '<button id="q-next" ' + (state.qualityPage >= pageCount - 1 ? "disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>';

    document.getElementById("quality-type-filter").value = state.qualityFilterType;
    document.getElementById("quality-type-filter").addEventListener("change", function (e) {
      state.qualityFilterType = e.target.value; state.qualityPage = 0; renderQuality();
    });
    var qSearchBox = document.getElementById("quality-search");
    if (searchWasFocused) {
      qSearchBox.focus();
      qSearchBox.setSelectionRange(searchCursorPos, searchCursorPos);
    }
    qSearchBox.addEventListener("input", function (e) {
      state.qualitySearch = e.target.value; state.qualityPage = 0; renderQuality();
    });
    document.getElementById("q-prev").addEventListener("click", function () { state.qualityPage--; renderQuality(); });
    document.getElementById("q-next").addEventListener("click", function () { state.qualityPage++; renderQuality(); });
  }

  // ---------- Dispatch ----------
  function renderTab(name) {
    if (name === "overview") renderOverview();
    else if (name === "coverage") renderCoverage();
    else if (name === "surveillance") renderSurveillance();
    else if (name === "supervision") renderSupervision();
    else if (name === "quality") renderQuality();
  }

  document.getElementById("export-pdf-btn").addEventListener("click", function () {
    window.print();
  });

  renderTab("overview");
})();
</script>
</body>
</html>
