<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KP EPI Dashboard</title>
<style>
  :root {
    --navy: #1a3a7a;
    --navy-dark: #12285a;
    --navy-light: #e8edf9;
    --good: #1e8e3e;
    --good-bg: #e6f4ea;
    --warning: #b06a00;
    --warning-bg: #fff4e0;
    --poor: #c5221f;
    --poor-bg: #fce8e6;
    --neutral: #5f6368;
    --neutral-bg: #f1f3f4;
    --border: #dadce0;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1b1f27;
    --text-dim: #5f6368;
    --measles: #1a5fb4;
    --diphtheria: #7d3c98;
    --pertussis: #1e8e3e;
    --nnt: #d97706;
    --rca: #0f766e;
    --supervisory: #b45309;
    --who: #0891b2;
    --admin: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header.app-header {
    background: var(--navy); color: #fff; padding: 14px 16px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  header.app-header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header.app-header .sub { font-size: 12px; opacity: 0.85; }
  nav.tabs {
    display: flex; background: var(--navy-dark); overflow-x: auto; -webkit-overflow-scrolling: touch;
    position: sticky; top: 0; z-index: 20;
  }
  nav.tabs button {
    background: transparent; border: none; color: #cdd6ee; padding: 12px 16px; font-size: 13px;
    font-weight: 600; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent;
  }
  nav.tabs button.active { color: #fff; border-bottom-color: #fff; background: rgba(255,255,255,0.06); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .grid { display: grid; gap: 12px; }
  .kpi-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .kpi-card {
    background: var(--card-bg); border-radius: 8px; padding: 12px 14px; border-left: 5px solid var(--neutral);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .kpi-card.rag-good { border-left-color: var(--good); }
  .kpi-card.rag-warning { border-left-color: var(--warning); }
  .kpi-card.rag-poor { border-left-color: var(--poor); }
  .kpi-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .kpi-card .value { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .card {
    background: var(--card-bg); border-radius: 8px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 10px 0; color: var(--navy); }
  .card h3 { font-size: 13px; margin: 14px 0 8px 0; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .two-col { grid-template-columns: 1fr 1fr; }
  .three-col { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 760px) {
    .two-col, .three-col { grid-template-columns: 1fr; }
  }
  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap.tall { height: 360px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-dim); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card-bg); }
  th.sorted-asc::after { content: " \25B2"; font-size: 9px; }
  th.sorted-desc::after { content: " \25BC"; font-size: 9px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--navy-light); }
  .pct-cell { font-weight: 600; }
  .rag-good-text { color: var(--good); }
  .rag-warning-text { color: var(--warning); }
  .rag-poor-text { color: var(--poor); }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10.5px; font-weight: 600; margin-right: 3px; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); }
  .badge.poor { background: var(--poor-bg); color: var(--poor); }
  .badge.neutral { background: var(--neutral-bg); color: var(--neutral); }
  .breadcrumb { font-size: 13px; margin-bottom: 10px; color: var(--text-dim); }
  .breadcrumb a { color: var(--navy); cursor: pointer; text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }
  input.search-box {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%;
    max-width: 280px; margin-bottom: 10px;
  }
  select.filter-select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; margin-right: 8px; margin-bottom: 10px; }
  .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  /* Mirrors a filter <select>'s current value as plain text for print/PDF,
     since the interactive control itself is hidden when printing (see the
     @media print block below) -- without this, a filtered chart/table would
     print with no visible indication of which filter value produced it. */
  .print-only-filter { display: none; }
  .pagination { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12.5px; }
  .pagination button {
    border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .placeholder-card {
    text-align: center; padding: 40px 20px; color: var(--text-dim); border: 2px dashed var(--border); border-radius: 8px;
  }
  .placeholder-card .icon { font-size: 32px; margin-bottom: 8px; }
  .insight-box {
    background: var(--navy-light); border-left: 4px solid var(--navy); border-radius: 6px;
    padding: 10px 14px; font-size: 13px; line-height: 1.5; margin: 12px 0; color: var(--navy-dark);
    cursor: text;
  }
  .insight-box:hover, .insight-box:focus {
    outline: 1px dashed var(--navy); outline-offset: 2px;
  }
  .insight-box::before {
    content: "Insight (click to edit)"; display: block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--navy); opacity: 0.65; margin-bottom: 3px;
  }
  .insight-box.no-default-label::before { content: none; }
  .insight-box-custom-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--navy); opacity: 0.65; margin: 12px 0 -6px 0;
  }
  .section-note { color: var(--text-dim); font-size: 12.5px; margin: 0 0 10px 0; }
  .period-pill {
    background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 7px 16px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; margin-right: 8px; color: var(--text-dim);
  }
  .period-pill.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .map-wrap { position: relative; }
  .map-wrap svg { width: 100%; height: auto; display: block; }
  .map-wrap.single-map { max-width: 520px; margin: 0 auto; }
  .map-wrap.single-map.large { max-width: 760px; }
  .map-wrap path.district-shape {
    stroke: #fff; stroke-width: 1; cursor: pointer; transition: opacity .1s;
  }
  .map-wrap path.district-shape:hover { opacity: 0.75; stroke: var(--navy-dark); stroke-width: 1.5; }
  .map-wrap text.district-label, .map-wrap text.district-label-halo {
    font-size: 9px; font-weight: 700; text-anchor: middle; pointer-events: none;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .map-wrap text.district-label-halo { fill: none; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; opacity: 0.9; }
  .map-wrap text.district-label { fill: #1b1f27; }
  /* Mini-map grid (9 antigen tiles) renders the same 640x520 viewBox at a
     much smaller on-screen size than the single large maps -- SVG font-size
     is in viewBox units, so the labels need to be proportionally larger
     here to stay legible once scaled down, not the same absolute size. */
  .map-wrap text.district-label-halo.mini { stroke-width: 5px; }
  .map-wrap text.district-label.mini, .map-wrap text.district-label-halo.mini { font-size: 21px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .map-legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .map-tooltip {
    position: fixed; pointer-events: none; background: var(--navy-dark); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; line-height: 1.5; z-index: 100; max-width: 240px; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .mini-map-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 10px;
  }
  .mini-map-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: #fff;
  }
  .mini-map-card h4 {
    margin: 0 0 6px 0; font-size: 12.5px; font-weight: 700; color: var(--navy); text-align: center;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .mini-map-card .map-wrap svg { width: 100%; height: auto; display: block; }
  .disease-tag { display: inline-block; width: 4px; height: 16px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .expand-row td { background: #fafbfe; padding: 10px 14px; }
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; font-size: 12px; }
  .mini-grid div { padding: 4px 6px; background: #fff; border-radius: 4px; border: 1px solid var(--border); }
  .callout-inline { font-size: 12px; font-weight: 600; color: var(--navy); text-transform: none; letter-spacing: normal; }
  .alert-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .alert-pills .badge { font-size: 11.5px; padding: 3px 9px; }
  .anomaly-box {
    margin-top: 12px; padding: 10px 14px; background: var(--poor-bg); border: 1px solid var(--poor);
    border-radius: 6px;
  }
  .anomaly-box h3 { margin: 0 0 4px 0; color: var(--poor); font-size: 13px; }
  .anomaly-box p { margin: 0 0 8px 0; font-size: 12px; color: var(--text-dim); }
  .anomaly-box.good-box { background: var(--good-bg); border-color: var(--good); }
  .anomaly-box.good-box h3 { color: var(--good); }
  ul.analysis-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
  ul.analysis-list li { margin-bottom: 5px; }
  ul.analysis-list li strong { color: var(--navy); }
  button.reset-btn {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px;
    background: #f4f6fb; color: var(--navy); cursor: pointer; margin-bottom: 10px;
  }
  button.reset-btn:hover { background: #e8ecf7; }
  ul.plain-list { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.65; }
  ul.plain-list li { margin-bottom: 4px; }
  .district-highlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .district-highlight-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #fafbfe;
  }
  .district-highlight-card h4 { margin: 0 0 4px 0; font-size: 13px; color: var(--navy); }
  .district-highlight-card p { margin: 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .completeness-list { display: flex; flex-direction: column; gap: 6px; }
  .completeness-row { display: grid; grid-template-columns: 190px 1fr 46px; align-items: center; gap: 8px; font-size: 12px; }
  .completeness-label { color: var(--text-dim); }
  .completeness-bar-track { background: #eef1f7; border-radius: 4px; height: 12px; overflow: hidden; }
  .completeness-bar-fill { height: 100%; border-radius: 4px; }
  .completeness-pct { text-align: right; font-weight: 600; }
  .discordance-table th, .discordance-table td { text-align: center; }
  .discordance-table th:first-child, .discordance-table td:first-child { text-align: left; }
  .discordant-cell { background: var(--poor-bg); color: var(--poor); font-weight: 700; }
  .error-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
  .ki-value { font-size: 16px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .section-heading {
    margin: 28px 0 4px 0; padding-bottom: 8px; border-bottom: 3px solid var(--navy);
  }
  .section-heading h2 { font-size: 19px; margin: 0; }
  .section-heading .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .section-heading:first-child { margin-top: 0; }
  .section-divider {
    display: flex; align-items: center; gap: 12px; margin: 32px 0 4px 0;
  }
  .section-divider .line { flex: 1; height: 1px; background: var(--border); }
  .section-divider .label {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-dim); white-space: nowrap;
  }
  .tab-summaries-heading {
    margin: 28px 0 12px 0; padding-bottom: 8px; border-bottom: 3px solid var(--navy);
    font-size: 19px;
  }
  footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text-dim); }
  button.export-btn {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 8px;
  }
  button.export-btn:hover { background: rgba(255,255,255,0.22); }
  /* Printing/exporting to PDF captures exactly what's on screen right now --
     whichever tab, period pill, and antigen/district selection the viewer
     currently has open -- since there's no server round-trip involved. The
     interactive controls themselves are hidden (a clickable pill button
     prints uselessly), but what they were SET TO must stay visible as plain
     text, or the PDF wouldn't say which period/tab it is. */
  @media print {
    nav.tabs, .controls-row select, .controls-row label, button.export-btn, button.reset-btn, .insight-box[contenteditable]::before,
    .pagination, input.search-box, th.sorted-asc::after, th.sorted-desc::after { display: none !important; }
    .period-pill:not(.active) { display: none !important; }
    .period-pill.active {
      background: none !important; color: #000 !important; border: none !important;
      padding: 0 !important; font-weight: 700; font-size: 13px;
    }
    .print-only-filter { display: inline-block !important; font-weight: 700; font-size: 12.5px; margin-right: 12px; }
    .tab-panel { display: none !important; }
    .tab-panel.active { display: block !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    .chart-wrap, .map-wrap { break-inside: avoid; }
    .table-scroll { overflow: visible; }
    a.download { display: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>KP EPI Dashboard</h1>
    <div class="sub">Directorate General Health Services, Khyber Pakhtunkhwa &mdash; Expanded Programme on Immunization</div>
  </div>
  <div>
    <button class="export-btn" id="export-pdf-btn" title="Exports exactly what's currently on screen -- the active tab and whatever filters are selected">Download PDF</button>
    <button class="export-btn" id="export-ppt-btn" title="Builds a PowerPoint from what's currently on screen -- one slide per section in the active tab">Download PPT</button>
  </div>
</header>

<nav class="tabs">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="coverage">Service Delivery</button>
  <button data-tab="surveillance">VPD Surveillance</button>
  <button data-tab="who">WHO Supported Activities</button>
  <button data-tab="admin">Divisional Officer &amp; Admin Compliance</button>
  <button data-tab="quality">Data Quality</button>
</nav>

<main>
  <section id="tab-overview" class="tab-panel active"></section>
  <section id="tab-coverage" class="tab-panel"></section>
  <section id="tab-surveillance" class="tab-panel"></section>
  <section id="tab-who" class="tab-panel"></section>
  <section id="tab-admin" class="tab-panel"></section>
  <section id="tab-quality" class="tab-panel"></section>
</main>

<footer>Generated by the EPI data pipeline. Coverage and bulletin figures are computed once by src/pipeline and never recalculated here.</footer>

<script>/*__CHARTJS_SOURCE__*/</script>
<script>/*__PPTXGENJS_SOURCE__*/</script>
<script id="epi-data" type="application/json">/*__EPI_DATA_JSON__*/</script>
<script id="kp-geo" type="application/json">/*__KP_GEOJSON__*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("epi-data").textContent);
  var CFG = DATA.config;
  var KP_GEO = JSON.parse(document.getElementById("kp-geo").textContent);
  var charts = {}; // name -> Chart instance, so we can destroy before re-render

  // Every place user-typed text (search boxes) or saved localStorage text
  // (editable insights) gets interpolated back into an HTML string built by
  // string concatenation MUST go through this first -- otherwise a stray "
  // or < breaks out of an attribute/tag and can inject arbitrary markup or
  // attributes (confirmed reproducible: typing `Peshawar" onmouseover="..`
  // into a search box corrupted the input's own attributes).
  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtPct(v) { return (v === null || v === undefined || isNaN(v)) ? "—" : v.toFixed(1) + "%"; }
  function fmtNum(v) { return (v === null || v === undefined || isNaN(v)) ? "—" : Number(v).toLocaleString(); }
  // Grammatically correct count + noun, e.g. plural(1, "case") -> "case", plural(2, "case") -> "cases",
  // plural(2, "child", "children") -> "children". Used instead of "case(s)"/"child(ren)" placeholders.
  function plural(count, singular, pluralForm) {
    return (count === 1) ? singular : (pluralForm || singular + "s");
  }
  function nounFor(count, singular, pluralForm) {
    return fmtNum(count) + " " + plural(count, singular, pluralForm);
  }
  function ragClass(rag) { return rag ? "rag-" + rag : ""; }
  function ragTextClass(rag) { return rag ? "rag-" + rag + "-text" : ""; }
  function destroyChart(name) { if (charts[name]) { charts[name].destroy(); delete charts[name]; } }

  function coverageRag(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return null;
    if (pct >= CFG.coverage_good) return "good";
    if (pct >= CFG.coverage_warning) return "warning";
    return "poor";
  }
  function dropoutRag(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return null;
    if (pct <= CFG.dropout_good) return "good";
    if (pct <= CFG.dropout_warning) return "warning";
    return "poor";
  }

  // ---------- Tabs ----------
  var tabButtons = document.querySelectorAll("nav.tabs button");
  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
      var panel = document.getElementById("tab-" + btn.dataset.tab);
      panel.classList.add("active");
      renderTab(btn.dataset.tab);
    });
  });

  // ---------- Period selection ----------
  // One selector for the whole dashboard: the Monthly/Cumulative pill inside
  // the Service Delivery tab (state.coveragePeriodKind). state.periodId
  // (which DATA.coverage.district/tehsil/uc row -- and so the Overview tab
  // and the District/Tehsil/UC Explorer -- filter to) is kept in sync with
  // it below, rather than exposing a second, separate period control.
  var state = {
    periodId: DATA.default_period_id,
    coverageLevel: "district", coverageDistrict: null, coverageTehsil: null,
    coverageSort: { col: "fic_pct_reported", dir: "desc" }, coverageSearch: "",
    qualityPage: 0, qualityFilterType: "", qualitySearch: "", gapAntigen: "FIC",
    coveragePeriodKind: "monthly",
    whoDistrict: "", whoTheme: "", whoSearch: "",
    rcaAgeGroup: "All",
  };
  // Maps a "monthly"/"cumulative" pill kind to the matching DATA.periods
  // entry's period_id (period_type is "monthly" or "cumulative_annual" --
  // see config.py's Period type) -- the two vocabularies exist because
  // DATA.periods/state.periodId predates the Coverage tab's own pill, kept
  // in sync here instead of merged, since coverage_summary.json's
  // monthly/cumulative split is computed independently in the pipeline.
  function syncPeriodIdToCoverageKind(kind) {
    var wantType = kind === "monthly" ? "monthly" : "cumulative_annual";
    var match = DATA.periods.filter(function (p) { return p.period_type === wantType; })[0];
    if (match) state.periodId = match.period_id;
  }

  function byPeriod(rows, level) {
    return rows.filter(function (r) { return r.period_id === state.periodId; });
  }
  function districtRows() { return byPeriod(DATA.coverage.district).filter(function (r) { return !r.is_province_total; }); }
  function provinceRow() { return byPeriod(DATA.coverage.district).filter(function (r) { return r.is_province_total; })[0]; }

  // ================= OVERVIEW =================
  function renderOverview() {
    var el = document.getElementById("tab-overview");
    var prov = provinceRow();
    if (!prov) {
      el.innerHTML = '<div class="card"><div class="placeholder-card"><div class="icon">📊</div>' +
        'No Service Delivery data uploaded yet. See the Service Delivery tab (which also covers Monitoring &amp; Supervision), or the VPD Surveillance tab if that\'s what was uploaded.</div></div>' +
        '<h3 class="tab-summaries-heading">Executive Overview — All Sections</h3><div id="overview-tab-summaries" class="grid"></div>';
      renderOtherTabSummaries();
      return;
    }

    var currentPeriod = DATA.periods.filter(function (p) { return p.period_id === state.periodId; })[0];

    var kpis = [

    destroyChart("cascade"); destroyChart("category"); destroyChart("ficRank");

    var cascadeLabels = ["BCG", "Penta1", "Penta2", "Penta3", "MR1", "FIC"];
    var cascadeVals = [prov.bcg_pct_reported, prov.penta1_pct_reported, prov.penta2_pct_reported,

        }),
        datasets: [{ data: catTotals, backgroundColor: ["#1e8e3e", "#b06a00", "#5b7fd6", "#c5221f"] }]

    charts.ficRank = new Chart(document.getElementById("chart-fic-rank"), {
      type: "bar",
      data: {
        labels: dRows.map(function (r) { return r.district; }),
        datasets: [{ label: "FIC %", data: dRows.map(function (r) { return r.fic_pct_reported; }),
          backgroundColor: dRows.map(function (r) {
            var c = coverageRag(r.fic_pct_reported);
            return c === "good" ? "#1e8e3e" : c === "warning" ? "#b06a00" : "#c5221f";
          }) }]
      },

  // ---- Overview tab: one concise summary card per other tab, built from
  // the exact same computed data those tabs show -- never a separate
  // calculation, just a shorter read of it. Each shares its insight-box ID
  // with the source tab's own overview insight, so editing either updates
  // the same saved note. ----
  // Executive-overview stack: one card per domain, in a fixed narrative
  // order (Service Delivery -> Monitoring & Supervision -> VPD Surveillance
  // -> each VPD disease -> WHO Supported Activities -> Divisional Officer &
  // Admin Compliance).
  // Coverage and VPD keep their existing short prose summaries (each

  // section here is deliberately numbers-only -- the same headline KPI
  // cards already shown on that section's own tab (via the shared
  // *KpiRow functions above), not a re-written prose summary, per the
  // user's explicit instruction. A domain with no data simply contributes

  function kpiRowCard(title, colorVar, kpiHtml) {

  // ================= COVERAGE =================
  // "category" column header is level-specific (District Category / Tehsil
  // Category / UC Category), never a bare "Category" -- distinguishes a
  // district's/tehsil's own rollup category from a UC's own category, which
  // are different things shown in the same-named source column at each level.
  var COVERAGE_CATEGORY_LABEL = { district: "District Category", tehsil: "Tehsil Category", uc: "UC Category" };
  var COVERAGE_COLS = {
    district: [["district", "District"], ["bcg_pct_reported", "BCG%"], ["penta1_pct_reported", "Penta1%"],
      ["penta3_pct_reported", "Penta3%"], ["mr1_pct_reported", "MR1%"], ["fic_pct_reported", "FIC%"],
      ["dropout_pct_reported", "Dropout%"], ["category", COVERAGE_CATEGORY_LABEL.district],
      ["lpuc_count", "LPUCs (Cat 3+4)"]],
    tehsil: [["tehsil", "Tehsil"], ["bcg_pct_reported", "BCG%"], ["penta1_pct_reported", "Penta1%"],
      ["penta3_pct_reported", "Penta3%"], ["mr1_pct_reported", "MR1%"], ["fic_pct_reported", "FIC%"],
      ["dropout_pct_reported", "Dropout%"], ["category", COVERAGE_CATEGORY_LABEL.tehsil],
      ["lpuc_count", "LPUCs (Cat 3+4)"]],
    uc: [["uc_name", "Union Council"], ["bcg_pct", "BCG%"], ["penta1_pct", "Penta1%"],
      ["penta3_pct", "Penta3%"], ["opv3_pct", "OPV3%"], ["pcv3_pct", "PCV3%"],
      ["mr1_pct", "MR1%"], ["fic_pct", "FIC%"], ["dropout_pct", "Dropout%"],
      ["category", COVERAGE_CATEGORY_LABEL.uc], ["flags", "Flags"]],
  };
  var RAG_COLS = { bcg_pct: 1, bcg_pct_reported: 1, penta1_pct: 1, penta1_pct_reported: 1, penta2_pct_reported: 1,
    opv3_pct: 1, pcv3_pct: 1,
    penta3_pct: 1, penta3_pct_reported: 1, mr1_pct: 1, mr1_pct_reported: 1, fic_pct: 1, fic_pct_reported: 1,
    dropout_pct: "dropout", dropout_pct_reported: "dropout" };

  function coverageRows() {
    if (state.coverageLevel === "district") return districtRows();
    if (state.coverageLevel === "tehsil") {
      return byPeriod(DATA.coverage.tehsil).filter(function (r) { return r.district === state.coverageDistrict; });
    }
    return byPeriod(DATA.coverage.uc).filter(function (r) {
      return r.district === state.coverageDistrict && r.tehsil === state.coverageTehsil;
    });
  }

  function flagBadges(r) {
    var b = "";
    if (r.is_zero_target) b += '<span class="badge neutral">no target</span>';
    if (r.is_outlier) b += '<span class="badge warning">outlier</span>';
    if (r.is_negative_dropout) b += '<span class="badge poor">neg. dropout</span>';
    if (r.is_consistency_fail) b += '<span class="badge poor">' + r.consistency_fail_count + ' mismatch</span>';
    return b || '<span class="badge good">clean</span>';
  }

  function renderBreadcrumb() {
    var parts = ['<a data-nav="province">Province</a>'];
    if (state.coverageDistrict) parts.push(' &rsaquo; <a data-nav="district">' + escHtml(state.coverageDistrict) + '</a>');
    if (state.coverageTehsil) parts.push(' &rsaquo; ' + escHtml(state.coverageTehsil));
    return '<div class="breadcrumb">' + parts.join("") + '</div>';
  }

  // ---------- Coverage analysis section helpers ----------
  function ragColor(rag) {
    return rag === "good" ? "#1e8e3e" : rag === "warning" ? "#b06a00" : rag === "poor" ? "#c5221f" : "#9aa0a6";
  }
  // Green/red only (no amber) -- for charts that need a strict pass/fail
  // read against the province's own defined good-coverage threshold
  // (config.COVERAGE_GOOD, the same threshold already used everywhere else
  // in this dashboard -- never a separate, arbitrary cutoff).
  function targetMetColor(pct) { return pct >= CFG.coverage_good ? "#1e8e3e" : "#c5221f"; }

  // Bakes a text label directly onto each bar via canvas fillText, instead
  // of relying on hover tooltips -- a PDF/print export or a static
  // screenshot has no hover state, so any number that matters has to be
  // permanently visible on the chart itself. Datasets opt in by adding a
  // parallel `labelText` array (one string per data point); Chart.js itself
  // ignores that property, this plugin reads it.
  var barValueLabelsPlugin = {
    id: "barValueLabels",
    afterDatasetsDraw: function (chart) {
      var ctx = chart.ctx;
      var horizontal = chart.options.indexAxis === "y";
      var stacked = !horizontal && chart.options.scales && chart.options.scales.y && chart.options.scales.y.stacked;
      ctx.save();
      ctx.font = "600 11px -apple-system, Segoe UI, Roboto, Arial, sans-serif";
      ctx.fillStyle = "#1b1f27";
      ctx.textBaseline = "middle";
      chart.data.datasets.forEach(function (dataset, di) {
        if (!dataset.labelText) return;
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function (bar, i) {
          var label = dataset.labelText[i];
          if (!label) return;
          if (horizontal) {
            var positive = bar.x >= bar.base;
            ctx.textAlign = positive ? "left" : "right";
            ctx.fillText(label, bar.x + (positive ? 5 : -5), bar.y);
          } else if (stacked) {
            // Stacked segments sit directly on top of each other -- labeling
            // each one "above its own top edge" (the non-stacked default
            // below) puts a thin segment's label right where the segment
            // below it is already labelled, overlapping. Center every
            // segment's label inside itself instead, with a white halo so it
            // stays legible even where a thin segment makes it overflow the
            // segment's own band.
            var midY = (bar.y + bar.base) / 2;
            ctx.textAlign = "center";
            ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.lineJoin = "round";
            ctx.strokeText(label, bar.x, midY);
            ctx.fillText(label, bar.x, midY);
          } else {
            // A center-aligned label at the first/last point on a line/bar
            // chart runs past the chart area's edge -- flip alignment there
            // instead of letting the text clip off the canvas.
            var area = chart.chartArea, half = ctx.measureText(label).width / 2;
            if (bar.x + half > area.right) { ctx.textAlign = "right"; ctx.fillText(label, area.right, bar.y - 8); }
            else if (bar.x - half < area.left) { ctx.textAlign = "left"; ctx.fillText(label, area.left, bar.y - 8); }
            else { ctx.textAlign = "center"; ctx.fillText(label, bar.x, bar.y - 8); }
          }
        });
      });
      ctx.restore();
    },
  };
  Chart.register(barValueLabelsPlugin);

  // For a line series with more than a couple of points, labelling every
  // point permanently would overlap/clutter -- labelling just the peak and
  // the latest value (the two numbers a reader actually needs at a glance)
  // keeps the chart PDF-friendly without needing hover for the rest.
  function peakLatestLabels(values, fmt) {
    fmt = fmt || fmtNum;
    var labels = values.map(function () { return null; });
    if (!values.length) return labels;
    var peakIdx = 0;
    values.forEach(function (v, i) { if ((v || 0) > (values[peakIdx] || 0)) peakIdx = i; });
    var lastIdx = values.length - 1;
    if (peakIdx === lastIdx) {
      labels[lastIdx] = "Peak/Latest: " + fmt(values[lastIdx]);
    } else {
      labels[peakIdx] = "Peak: " + fmt(values[peakIdx]);
      labels[lastIdx] = "Latest: " + fmt(values[lastIdx]);
    }
    return labels;
  }

  var DOUGHNUT_PALETTE = ["#1a5fb4", "#c5221f", "#0f766e", "#b06a00", "#7d3c98", "#9aa0a6"];
  // Chart.js tooltips only show a slice's value on hover -- for a static
  // screenshot or a printed PDF that's invisible, so the count and % are
  // baked directly into the legend label text instead (e.g. "Male: 155
  // (52.0%)"), always visible, never dependent on hover.
  function doughnutData(counts) {
    var keys = Object.keys(counts);
    var total = keys.reduce(function (s, k) { return s + counts[k]; }, 0);
    return {
      labels: keys.map(function (k) {
        var pct = total ? (counts[k] / total * 100) : 0;
        return k + ": " + fmtNum(counts[k]) + " (" + pct.toFixed(1) + "%)";
      }),
      values: keys.map(function (k) { return counts[k]; }),
      colors: keys.map(function (_, i) { return DOUGHNUT_PALETTE[i % DOUGHNUT_PALETTE.length]; }),
    };
  }

  // Draws "N (P%)" directly inside each doughnut/pie slice, not just on
  // hover or in the legend -- required for a static screenshot/PDF export
  // to carry the same numbers as the live chart. A slice under 6% of the
  // total is too thin to hold readable text without overlapping its
  // neighbours, so it's skipped here (the legend still shows its exact
  // count/percentage via doughnutData).
  var doughnutSliceLabelsPlugin = {
    id: "doughnutSliceLabels",
    afterDatasetsDraw: function (chart) {
      if (chart.config.type !== "doughnut" && chart.config.type !== "pie") return;
      // Opt-in per chart (options.sliceLabelsOn: true) rather than applying
      // to every doughnut in the dashboard -- charts outside the section
      // currently being worked on keep their existing look. Deliberately
      // NOT named options.plugins.doughnutSliceLabels: Chart.js treats
      // options.plugins.<pluginId> as its own built-in enable/disable
      // switch for the plugin (defaults to enabled), so a flag reusing the
      // plugin's id there would read as "on" for every chart regardless of
      // what's actually set.
      if (!chart.options.sliceLabelsOn) return;
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function (dataset, di) {
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        var total = dataset.data.reduce(function (s, v) { return s + (v || 0); }, 0);
        if (!total) return;
        meta.data.forEach(function (arc, i) {
          var value = dataset.data[i];
          var pct = value / total * 100;
          if (pct < 6) return;
          var angle = (arc.startAngle + arc.endAngle) / 2;
          var radius = (arc.innerRadius + arc.outerRadius) / 2;
          var x = arc.x + Math.cos(angle) * radius;
          var y = arc.y + Math.sin(angle) * radius;
          ctx.save();
          ctx.font = "700 12px -apple-system, Segoe UI, Roboto, Arial, sans-serif";
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "rgba(0,0,0,0.45)";
          ctx.shadowBlur = 3;
          ctx.fillText(fmtNum(value) + " (" + pct.toFixed(1) + "%)", x, y);
          ctx.restore();
        });
      });
    },
  };
  Chart.register(doughnutSliceLabelsPlugin);

  function kpiCard(label, value, sub, rag) {
    return '<div class="kpi-card' + (rag ? " rag-" + rag : "") + '"><div class="label">' + label + '</div>' +
      '<div class="value' + (rag ? " " + ragTextClass(rag) : "") + '">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  // Every section's narrative insight is auto-generated by the pipeline from
  // real numbers (see coverage_summary.py), then shown here as an editable
  // note -- a programme officer can click in and refine the wording. Edits
  // are saved to this browser's local storage, keyed by section + period +
  // (where relevant) antigen, so switching tabs/antigens never shows a stale
  // edit written for a different view. Edits are per-browser/device only --
  // they do not travel with the file if it's re-shared or regenerated.
  // labelText overrides the default "Insight (click to edit)" caption for
  // cases where the box holds something other than an auto-generated
  // insight (e.g. a follow-up/recommendation box) -- rendered as a separate
  // sibling element, never inside the contenteditable box itself, since
  // wireEditableInsights saves that box's raw innerText verbatim and a
  // label living inside it would get edited/saved along with the content.
  function editableInsight(id, autoText, labelText) {
    var saved = null;
    try { saved = localStorage.getItem("epi-insight:" + id); } catch (e) {}
    var text = (saved !== null && saved !== "") ? saved : autoText;
    if (labelText) {
      return '<div class="insight-box-custom-label">' + escHtml(labelText) + '</div>' +
        '<div class="insight-box no-default-label" contenteditable="true" spellcheck="false" data-insight-id="' + id + '" ' +
        'title="Click to edit this note">' + escHtml(text) + '</div>';
    }
    return '<div class="insight-box" contenteditable="true" spellcheck="false" data-insight-id="' + id + '" ' +
      'title="Click to edit this note">' + escHtml(text) + '</div>';
  }
  function wireEditableInsights(root) {
    root.querySelectorAll("[data-insight-id]").forEach(function (box) {
      box.addEventListener("blur", function () {
        try { localStorage.setItem("epi-insight:" + box.dataset.insightId, box.innerText.trim()); } catch (e) {}
      });
    });
  }

  // ---- District coverage map ----
  // No basemap tiles and no mapping library -- the dashboard must stay a
  // single offline file (same reasoning as inlining Chart.js), and a
  // province-only choropleth doesn't need street-level imagery underneath
  // it. Boundaries are projected and drawn as plain inline SVG <path>s.
  var MAP_PROJECTION = (function () {
    var minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
    function scan(coords, depth) {
      if (depth === 0) {
        var lon = coords[0], lat = coords[1];
        if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
      } else {
        coords.forEach(function (c) { scan(c, depth - 1); });
      }
    }
    KP_GEO.features.forEach(function (f) {
      var depth = f.geometry.type === "Polygon" ? 2 : 3;
      scan(f.geometry.coordinates, depth);
    });
    var latMid = (minLat + maxLat) / 2;
    var cosLat = Math.cos(latMid * Math.PI / 180);
    var W = 640, H = 520, PAD = 10;
    var spanX = (maxLon - minLon) * cosLat, spanY = (maxLat - minLat);
    var scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
    var offX = PAD + ((W - 2 * PAD) - spanX * scale) / 2;
    var offY = PAD + ((H - 2 * PAD) - spanY * scale) / 2;
    function project(lon, lat) {
      var x = offX + (lon - minLon) * cosLat * scale;
      var y = offY + (maxLat - lat) * scale;
      return [x, y];
    }
    function ringPath(ring) {
      return ring.map(function (pt, i) {
        var p = project(pt[0], pt[1]);
        return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1);
      }).join(" ") + "Z";
    }
    function geometryPath(geom) {
      if (geom.type === "Polygon") return geom.coordinates.map(ringPath).join(" ");
      if (geom.type === "MultiPolygon") {
        return geom.coordinates.map(function (poly) { return poly.map(ringPath).join(" "); }).join(" ");
      }
      return "";
    }
    // Signed-area (shoelace) centroid of one ring, already in projected
    // (SVG) coordinates -- used to place a permanent "District: N" label
    // roughly in the middle of each shape. Falls back to a plain point
    // average for a degenerate (near-zero-area) ring.
    function ringCentroid(projPts) {
      var area = 0, cx = 0, cy = 0;
      for (var i = 0; i < projPts.length - 1; i++) {
        var x0 = projPts[i][0], y0 = projPts[i][1], x1 = projPts[i + 1][0], y1 = projPts[i + 1][1];
        var cross = x0 * y1 - x1 * y0;
        area += cross; cx += (x0 + x1) * cross; cy += (y0 + y1) * cross;
      }
      area *= 0.5;
      if (Math.abs(area) < 1e-6) {
        var sx = 0, sy = 0;
        projPts.forEach(function (p) { sx += p[0]; sy += p[1]; });
        return [sx / projPts.length, sy / projPts.length, 0];
      }
      return [cx / (6 * area), cy / (6 * area), Math.abs(area)];
    }
    // For a MultiPolygon (a boundary made of several separate landmasses,
    // e.g. combined sub-split districts), label the largest piece by area
    // rather than averaging every piece's centroid together -- averaging
    // can land the label in the gap between two shapes instead of on either.
    function geometryCentroid(geom) {
      var rings = geom.type === "Polygon" ? [geom.coordinates[0]]
        : geom.type === "MultiPolygon" ? geom.coordinates.map(function (poly) { return poly[0]; }) : [];
      var best = null;
      rings.forEach(function (ring) {
        var projPts = ring.map(function (pt) { return project(pt[0], pt[1]); });
        var c = ringCentroid(projPts);
        if (!best || c[2] > best[2]) best = c;
      });
      return best ? [best[0], best[1]] : [W / 2, H / 2];
    }
    return { width: W, height: H, geometryPath: geometryPath, centroid: geometryCentroid };
  })();

  // One compact map per antigen, so a decision-maker can compare districts
  // across the whole antigen schedule at a glance instead of switching a
  // single map back and forth. Every mini-map reuses the same MAP_PROJECTION
  // (computed once above) and the same district_map figures already
  // computed server-side -- only the SVG markup is built per antigen.
  function antigenMapsGridHtml(cs, kind) {
    if (cs.status !== "ok" || !cs.district_map || cs.district_map.unmapped_districts.length) return "";
    return '<div class="card"><h2>🗺️ Antigen-wise District Coverage Maps</h2>' +
      '<p class="section-note">Each of KP\'s 36 districts shaded individually by coverage for ' + cs.executive.current_period_label +
        ', including every newer sub-split (Chitral, Kohistan, Kurram, South Waziristan) on its own boundary. ' +
        'OPV, PCV, and Rota (including OPV3 and PCV3) have no District-level target in the source file, so they cannot be mapped here -- see ' +
        '"Additional Antigens (Union Council Level Only)" below for those, at UC level.</p>' +
      '<div class="mini-map-grid" id="map-grid-' + kind + '"></div>' +
      '<div class="map-legend">' +
        '<span><span class="swatch" style="background:#1e8e3e;"></span>Good (&ge;' + CFG.coverage_good + '%)</span>' +
        '<span><span class="swatch" style="background:#b06a00;"></span>Needs monitoring</span>' +
        '<span><span class="swatch" style="background:#c5221f;"></span>Critical (&lt;' + CFG.coverage_warning + '%)</span>' +
        '<span><span class="swatch" style="background:#d0d5dd;"></span>No data</span>' +
      '</div>' +
      '<p class="section-note" style="margin-top:6px;">District boundaries: user-provided reference map.</p>' +
      '<div class="map-tooltip" id="map-tooltip-' + kind + '"></div>' +
    '</div>';
  }

  function renderAntigenMapsGrid(cs, kind) {
    var grid = document.getElementById("map-grid-" + kind);
    if (!grid) return;
    // Fixed antigen order (matches the source sheet's own column order, via
    // target_gap's insertion order) rather than best-to-worst, so the grid
    // layout doesn't reshuffle from one period to the next.
    var antigens = Object.keys(cs.target_gap.by_antigen);
    var features = cs.district_map.features;

    grid.innerHTML = antigens.map(function (antigen) {
      var paths = "", labels = "";
      KP_GEO.features.forEach(function (f) {
        var name = f.properties.shapeName;
        var entry = features[name];
        var d = MAP_PROJECTION.geometryPath(f.geometry);
        var stat = entry ? entry.by_antigen[antigen] : null;
        var fill = "#d0d5dd";
        var status = "No data";
        if (stat && stat.pct !== null) {
          fill = ragColor(stat.rag);
          status = stat.pct >= CFG.coverage_good ? "Achieved" : "Below Target";
        }
        var label = entry ? entry.component_districts.join(" + ") : name;
        var detail = stat && stat.pct !== null
          ? label + "<br>" + antigen + ": " + stat.pct.toFixed(1) + "% (target " + CFG.coverage_good + "%)<br>" +
            stat.vaccinated.toLocaleString() + " of " + stat.target.toLocaleString() + " vaccinated &mdash; " + status
          : label + "<br>" + antigen + ": No data";
        paths += '<path class="district-shape" d="' + d + '" fill="' + fill + '" data-detail="' + detail.replace(/"/g, "&quot;") + '"></path>';
        // Permanent on-shape % label (not just hover) -- needed so the PDF
        // export (a static screenshot, see build.py/template.html print
        // styles) still shows real values, same principle as every chart's
        // on-chart labels elsewhere in this dashboard. Percentage only, no
        // district name, to stay legible at this many-districts-per-tile
        // scale -- full names are one hover (on screen) or one lookup (in
        // the Antigen-wise Coverage Analysis chart / District Explorer
        // table above) away.
        if (stat && stat.pct !== null) {
          var c = MAP_PROJECTION.centroid(f.geometry);
          var pctText = Math.round(stat.pct) + "%";
          labels += '<text class="district-label-halo mini" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '">' + pctText + '</text>' +
            '<text class="district-label mini" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '">' + pctText + '</text>';
        }
      });
      return '<div class="mini-map-card"><h4>' + antigen + '</h4>' +
        '<div class="map-wrap"><svg viewBox="0 0 ' + MAP_PROJECTION.width + ' ' + MAP_PROJECTION.height + '">' + paths + labels + '</svg></div></div>';
    }).join("");

    var tooltip = document.getElementById("map-tooltip-" + kind);
    grid.querySelectorAll("path.district-shape").forEach(function (path) {
      path.addEventListener("mousemove", function (e) {
        tooltip.innerHTML = path.dataset.detail;
        tooltip.style.display = "block";
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });
      path.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
    });
  }

  // ---- Generic single-district map (Monitoring domain: RCA / Supervisory
  // Checklist activity, one map each -- unlike the Coverage tab's per-antigen
  // grid, there's just one meaningful value per district here, not several
  // antigens to compare). Reuses the same MAP_PROJECTION/KP_GEO computed
  // once above; a district with no value is shaded "no data" gray rather
  // than guessed at, same as the Coverage maps. Color is a 3-step relative
  // scale (Low/Medium/High vs. the highest value actually present in this
  // upload) -- there's no external target for "how much RCA/supervisory
  // activity should a district have", so the scale is relative to the data
  // itself, not an invented absolute threshold.
  function activityColor(value, maxValue) {
    if (value === null || value === undefined || !maxValue) return "#d0d5dd";
    var ratio = value / maxValue;
    if (ratio >= 0.66) return "#0f766e";
    if (ratio >= 0.33) return "#5ba58f";
    return "#a8d5c7";
  }

  function singleDistrictMapHtml(svgId, tooltipId, title, note) {
    return '<h3>' + title + '</h3>' +
      (note ? '<p class="sub">' + note + '</p>' : '') +
      '<div class="map-wrap single-map large"><svg id="' + svgId + '" viewBox="0 0 ' + MAP_PROJECTION.width + ' ' + MAP_PROJECTION.height + '"></svg></div>' +
      '<div class="map-legend">' +
        '<span><span class="swatch" style="background:#0f766e;"></span>High</span>' +
        '<span><span class="swatch" style="background:#5ba58f;"></span>Medium</span>' +
        '<span><span class="swatch" style="background:#a8d5c7;"></span>Low</span>' +
      '</div>' +
      '<div class="map-tooltip" id="' + tooltipId + '"></div>';
  }

  // labelFn(entry) returns the short "District: N" text baked permanently
  // onto the shape (not just on hover) -- required so the map reads
  // correctly in a static screenshot or printed PDF, same principle as
  // every chart's on-chart value labels elsewhere in this dashboard.
  function renderSingleDistrictMap(svgId, tooltipId, districtMap, valueFn, detailFn, labelFn) {
    var svg = document.getElementById(svgId);
    if (!svg || !districtMap) return;
    var features = districtMap.features || {};
    var maxValue = 0;
    Object.keys(features).forEach(function (name) {
      var v = valueFn(features[name]);
      if (v !== null && v !== undefined && v > maxValue) maxValue = v;
    });
    var shapes = "", labels = "";
    KP_GEO.features.forEach(function (f) {
      var name = f.properties.shapeName;
      var entry = features[name];
      var d = MAP_PROJECTION.geometryPath(f.geometry);
      var value = entry ? valueFn(entry) : null;
      var fill = activityColor(value, maxValue);
      var label = entry ? entry.component_districts.join(" + ") : name;
      var detail = entry ? detailFn(label, entry) : (label + "<br>No data");
      shapes += '<path class="district-shape" d="' + d + '" fill="' + fill + '" data-detail="' + detail.replace(/"/g, "&quot;") + '"></path>';
      if (entry) {
        var c = MAP_PROJECTION.centroid(f.geometry);
        var text = labelFn(name, entry);
        labels += '<text class="district-label-halo" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '">' + escHtml(text) + '</text>' +
          '<text class="district-label" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '">' + escHtml(text) + '</text>';
      }
    });
    svg.innerHTML = shapes + labels;

    var tooltip = document.getElementById(tooltipId);
    svg.querySelectorAll("path.district-shape").forEach(function (path) {
      path.addEventListener("mousemove", function (e) {
        tooltip.innerHTML = path.dataset.detail;
        tooltip.style.display = "block";
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });
      path.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
    });
  }

  // ---- Measles incidence categorization map (VPD Surveillance tab) --
  // fixed WHO-standard bands (not a relative scale like the RCA/Supervisory
  // activity maps above), from the Measles Indicator Sheet's own per-district
  // incidence figures (ki.measles_incidence_map, built in
  // indicator_sheet_vpd.py -- never derived from a population proxy
  // elsewhere in this project, see CLAUDE.md's "Confirmed VPD decisions").
  // Same permanent on-shape labels + hover-detail pattern as every other
  // map in this dashboard, so it reads the same way. ----
  var INCIDENCE_BAND_COLOR = { green: "#1e8e3e", yellow: "#eab308", red: "#c5221f" };

  function measlesIncidenceMapInsight(ki) {
    var features = ki.measles_incidence_map.features;
    var names = Object.keys(features);
    var counts = { green: 0, yellow: 0, red: 0 };
    names.forEach(function (n) { var c = features[n].category; if (c) counts[c]++; });
    var total = counts.green + counts.yellow + counts.red;
    if (!total) return "No district-level measles incidence data available in the " + ki.year + " Measles Indicator Sheet.";
    return nounFor(counts.red, "district") + " " + plural(counts.red, "is", "are") + " in the disruptive-outbreak band (≥20 cases per million), " +
      nounFor(counts.yellow, "district") + " " + plural(counts.yellow, "is", "are") + " moderate (5 to <20), and " +
      nounFor(counts.green, "district") + " " + plural(counts.green, "is", "are") + " low (<5 per million), of " + fmtNum(total) + " districts with incidence data (" + ki.year + ").";
  }

  function measlesIncidenceMapHtml(ki) {
    if (!ki || ki.status !== "ok" || !ki.measles_incidence_map) {
      return '<div class="card"><h2>🗺️ District Categorization by Measles Incidence</h2>' +
        '<div class="placeholder-card"><div class="icon">⏳</div>No Measles Indicator Sheet was uploaded for this run -- ' +
        'district-level measles incidence categorization needs that workbook (the same one behind Key Surveillance Indicators below).</div></div>';
    }
    return '<div class="card"><h2>🗺️ District Categorization by Measles Incidence</h2>' +
      '<p class="sub">' + ki.year + ' measles incidence per million population (annualized), WHO-standard thresholds.</p>' +
      '<div class="map-wrap single-map large"><svg id="map-measles-incidence" viewBox="0 0 ' + MAP_PROJECTION.width + ' ' + MAP_PROJECTION.height + '"></svg></div>' +
      '<div class="map-legend">' +
        '<span><span class="swatch" style="background:' + INCIDENCE_BAND_COLOR.green + ';"></span>Low (&lt;5 per million)</span>' +
        '<span><span class="swatch" style="background:' + INCIDENCE_BAND_COLOR.yellow + ';"></span>Moderate (5 to &lt;20 per million)</span>' +
        '<span><span class="swatch" style="background:' + INCIDENCE_BAND_COLOR.red + ';"></span>Disruptive outbreak (&ge;20 per million)</span>' +
        '<span><span class="swatch" style="background:#d0d5dd;"></span>No data</span>' +
      '</div>' +
      '<p class="section-note" style="margin-top:6px;">District boundaries: user-provided reference map.</p>' +
      '<div class="map-tooltip" id="map-tooltip-measles-incidence"></div>' +
      editableInsight("vpd-measles-incidence-map-" + ki.year, measlesIncidenceMapInsight(ki)) +
    '</div>';
  }

  function renderMeaslesIncidenceMap(ki) {
    var svg = document.getElementById("map-measles-incidence");
    if (!svg || !ki || ki.status !== "ok" || !ki.measles_incidence_map) return;
    var features = ki.measles_incidence_map.features;
    var shapes = "", labels = "";
    KP_GEO.features.forEach(function (f) {
      var name = f.properties.shapeName;
      var entry = features[name];
      var d = MAP_PROJECTION.geometryPath(f.geometry);
      var value = entry ? entry.measles_incidence_per_million : null;
      var fill = (entry && entry.category) ? INCIDENCE_BAND_COLOR[entry.category] : "#d0d5dd";
      var detail = value !== null && value !== undefined
        ? name + "<br>Measles incidence: " + value.toFixed(1) + " per million<br>" + entry.category_label
        : name + "<br>No data";
      shapes += '<path class="district-shape" d="' + d + '" fill="' + fill + '" data-detail="' + detail.replace(/"/g, "&quot;") + '"></path>';
      if (value !== null && value !== undefined) {
        var c = MAP_PROJECTION.centroid(f.geometry);
        var text = String(Math.round(value));
        labels += '<text class="district-label-halo" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '">' + text + '</text>' +
          '<text class="district-label" x="' + c[0].toFixed(1) + '" y="' + c[1].toFixed(1) + '">' + text + '</text>';
      }
    });
    svg.innerHTML = shapes + labels;

    var tooltip = document.getElementById("map-tooltip-measles-incidence");
    svg.querySelectorAll("path.district-shape").forEach(function (path) {
      path.addEventListener("mousemove", function (e) {
        tooltip.innerHTML = path.dataset.detail;
        tooltip.style.display = "block";
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });
      path.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
    });
  }

  // ---- Section 1: Coverage Summary / Executive Overview ----

    }
    var exe = cs.executive;
    var ficRow = cs.antigen_analysis.filter(function (a) { return a.antigen === "FIC"; })[0] || {};
    var kpis = [

      kpiCard("Lowest Performing District", exe.worst_district ? exe.worst_district.district : "—",
        exe.worst_district ? "FIC " + fmtPct(exe.worst_district.pct) + " &middot; " + (exe.worst_district.pct - CFG.coverage_good).toFixed(1) + " pts vs " + CFG.coverage_good + "% target" : "", "poor"),

      kpiCard("UCs in Category 3", fmtNum(exe.uc_categorization.category_3), "of " + fmtNum(exe.uc_categorization.total_ucs) + " total UCs", "warning"),

  // ---- Section 2: Antigen-wise Coverage Analysis ----
  // Replaces the former UC Compliance Analysis section entirely -- this is

  // ---- Section 2b: Additional Antigens (Union Council level only) ----
  // OPV0-3, PCV1-3, and Rota1-2 exist in the source file only as a

  // against). Shown here instead, from the exact same uc_compliance.by_antigen
  // data Section 2 would use if these antigens had district-level targets:

  var UC_ONLY_ANTIGENS = ["OPV0", "OPV1", "OPV2", "OPV3", "PCV1", "PCV2", "PCV3", "Rota1", "Rota2"];

  function ucOnlyAntigenHtml(cs, kind) {
    if (cs.status !== "ok" || !cs.uc_compliance || !cs.uc_compliance.by_antigen) return "";
    var available = UC_ONLY_ANTIGENS.filter(function (a) { return cs.uc_compliance.by_antigen[a] && cs.uc_compliance.by_antigen[a].total_with_data; });

    return '<div class="card"><h2>💉 2b. Additional Antigens (Union Council Level Only)</h2>' +
      '<p class="section-note">OPV, PCV, and Rota doses are reported in the source file only as a per-Union-Council percentage -- ' +
        'no raw vaccinated count or target exists for these at District/Tehsil level, so they cannot appear in the district-level ' +
        'chart above or the district coverage maps below. Shown here instead: the % of Union Councils that reached the ' +
        CFG.coverage_good + '% target coverage for each, from the UC Wise Analysis - Coverages sheet.</p>' +
      '<div class="chart-wrap tall"><canvas id="chart-uc-only-antigens-' + kind + '"></canvas></div>' +
      editableInsight("uc-only-antigens-" + kind, ucOnlyAntigenInsight(cs, available)) +
    '</div>';
  }

  function ucOnlyAntigenInsight(cs, available) {
    var rows = available.map(function (a) { return { antigen: a, data: cs.uc_compliance.by_antigen[a] }; });
    var best = rows.reduce(function (b, r) { return (!b || r.data.compliant_pct > b.data.compliant_pct) ? r : b; }, null);
    var worst = rows.reduce(function (w, r) { return (!w || r.data.compliant_pct < w.data.compliant_pct) ? r : w; }, null);
    if (!best || !worst) return "";
    return best.antigen + " has the highest Union Council compliance among these (" + fmtPct(best.data.compliant_pct) + " of UCs at target), while " +
      worst.antigen + " has the lowest (" + fmtPct(worst.data.compliant_pct) + ").";
  }

  function renderUcOnlyAntigenChart(cs, kind) {
    destroyChart("ucOnlyAntigens");
    if (cs.status !== "ok" || !cs.uc_compliance || !cs.uc_compliance.by_antigen) return;
    var canvas = document.getElementById("chart-uc-only-antigens-" + kind);
    if (!canvas) return;
    var rows = UC_ONLY_ANTIGENS.filter(function (a) { return cs.uc_compliance.by_antigen[a] && cs.uc_compliance.by_antigen[a].total_with_data; })
      .map(function (a) { return { antigen: a, data: cs.uc_compliance.by_antigen[a] }; });
    canvas.parentElement.style.height = Math.max(200, rows.length * 38) + "px";
    charts.ucOnlyAntigens = new Chart(canvas, {
      type: "bar",
      data: {
        labels: rows.map(function (r) { return r.antigen; }),
        datasets: [{
          label: "% of UCs at target", data: rows.map(function (r) { return r.data.compliant_pct; }),
          backgroundColor: rows.map(function (r) { return targetMetColor(r.data.compliant_pct); }),
          labelText: rows.map(function (r) {
            return fmtPct(r.data.compliant_pct) + " (" + fmtNum(r.data.good) + " of " + fmtNum(r.data.total_with_data) + " UCs)";
          }),
        }],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 90 } },
        plugins: { legend: { display: false } },
        scales: { x: { max: 110 } },
      },
    });
  }

  // ---- Section 3: Target vs Coverage Analysis ----
  function targetGapHtml(cs, kind) {
    if (cs.status !== "ok") return "";
    var antigens = Object.keys(cs.target_gap.by_antigen);
    if (antigens.indexOf(state.gapAntigen) === -1) state.gapAntigen = antigens[0];
    var options = antigens.map(function (a) {
      return '<option value="' + a + '"' + (a === state.gapAntigen ? " selected" : "") + '>' + a + '</option>';
    }).join("");
    return '<div class="card"><h2>🎯 3. Target vs Coverage Analysis</h2>' +
      '<p class="section-note">District level only &mdash; Union Councils have no raw target in the source file, so this analysis is not fabricated at UC level. ' +
        'Target population vs. children actually vaccinated, both from the uploaded workbook (never estimated from a percentage).</p>' +
      '<div class="controls-row"><label style="font-size:12.5px;">Antigen: </label><select class="filter-select" id="gap-antigen-select">' + options + '</select></div>' +
      '<h3>5 districts with the largest immunization gap (target &minus; vaccinated), ' + state.gapAntigen + '</h3>' +
      '<div class="chart-wrap tall"><canvas id="chart-target-gap"></canvas></div>' +
      editableInsight("gap-" + kind + "-" + state.gapAntigen, cs.target_gap.insight_by_antigen[state.gapAntigen]) +
    '</div>';
  }

  function renderTargetGapSection(cs, kind) {
    var mount = document.getElementById("section-targetgap");
    mount.innerHTML = targetGapHtml(cs, kind);
    renderTargetGapChart(cs, kind);
    wireEditableInsights(mount);
  }

  function renderTargetGapChart(cs, kind) {
    destroyChart("targetGap");
    if (cs.status !== "ok") return;
    var rows = cs.target_gap.by_antigen[state.gapAntigen] || [];
    var canvas = document.getElementById("chart-target-gap");
    canvas.parentElement.style.height = Math.max(280, rows.length * 70) + "px";
    charts.targetGap = new Chart(canvas, {
      type: "bar",
      data: {
        labels: rows.map(function (r) { return r.district; }),
        datasets: [
          {
            label: "Target population", data: rows.map(function (r) { return r.target; }), backgroundColor: "#8aa4e0",
            labelText: rows.map(function (r) { return "Target: " + fmtNum(r.target); }),
          },
          {
            label: "Children vaccinated", data: rows.map(function (r) { return r.vaccinated; }), backgroundColor: "#1a3a7a",
            labelText: rows.map(function (r) { return "Vaccinated: " + fmtNum(r.vaccinated) + " (" + r.pct_achievement.toFixed(1) + "%)"; }),
          },
        ],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 150 } },
        plugins: { legend: { display: true, position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
      },
    });
    var sel = document.getElementById("gap-antigen-select");
    if (sel) sel.addEventListener("change", function (e) { state.gapAntigen = e.target.value; renderTargetGapSection(cs, kind); });
  }

  // ---- Section 4: Dropout Analysis ----
  // Uses the source Excel's own explicit Drop Out figure (District sheet) --
  // see build_dropout_analysis's docstring. No formula is shown here; the
  // dashboard displays results, not the calculation behind them.
  function dropoutAnalysisHtml(cs, kind) {
    if (cs.status !== "ok") return "";
    var d = cs.dropout;
    var kpis = [
      kpiCard("Districts with Negative Dropout", fmtNum(d.negative_dropout_districts), "Penta3 > Penta1 (data error, kept and flagged)"),
      kpiCard("UCs with Negative Dropout", fmtNum(d.negative_dropout_ucs), "Penta3 > Penta1 (data error, kept and flagged)"),
    ];
    return '<div class="card"><h2>📉 4. Dropout Analysis</h2>' +
      '<p class="section-note">Penta1 &rarr; Penta3 dropout, as reported in the source workbook\'s own Drop Out column.</p>' +
      '<div class="grid kpi-row">' + kpis.join("") + '</div>' +
      '<div class="grid two-col" style="margin-top:14px;">' +
        '<div><h3>🔻 Top 5 Highest Dropout Districts</h3><div class="chart-wrap"><canvas id="chart-dropout-highest"></canvas></div></div>' +
        '<div><h3>🔺 Top 5 Lowest Dropout Districts</h3><div class="chart-wrap"><canvas id="chart-dropout-lowest"></canvas></div></div>' +
      '</div>' +
      editableInsight("dropout-" + kind, d.insight) +
    '</div>';
  }

  function renderDropoutChart(cs) {
    destroyChart("dropoutHighest"); destroyChart("dropoutLowest");
    if (cs.status !== "ok") return;
    var d = cs.dropout;
    var highestCanvas = document.getElementById("chart-dropout-highest");
    var lowestCanvas = document.getElementById("chart-dropout-lowest");
    highestCanvas.parentElement.style.height = Math.max(200, d.highest_districts.length * 44) + "px";
    lowestCanvas.parentElement.style.height = Math.max(200, d.lowest_districts.length * 44) + "px";
    charts.dropoutHighest = new Chart(highestCanvas, {
      type: "bar",
      data: {
        labels: d.highest_districts.map(function (r) { return r.district; }),
        datasets: [{
          label: "Dropout %", data: d.highest_districts.map(function (r) { return r.dropout_pct; }),
          backgroundColor: "#c5221f", labelText: d.highest_districts.map(function (r) { return fmtPct(r.dropout_pct); }),
        }],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 50 } }, plugins: { legend: { display: false } },
      },
    });
    charts.dropoutLowest = new Chart(lowestCanvas, {
      type: "bar",
      data: {
        labels: d.lowest_districts.map(function (r) { return r.district; }),
        datasets: [{
          label: "Dropout %", data: d.lowest_districts.map(function (r) { return r.dropout_pct; }),
          backgroundColor: "#1e8e3e", labelText: d.lowest_districts.map(function (r) { return fmtPct(r.dropout_pct); }),
        }],
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 50 } }, plugins: { legend: { display: false } },
      },
