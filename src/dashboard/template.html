  // ---- Section 5: Trends and Key Insights ----
  function trendsHtml(cs, kind) {
    if (cs.status !== "ok") return "";
    var t = cs.trends;
    if (t.status === "insufficient_history") {
      return '<div class="card"><h2>📈 5. Trends and Key Insights</h2><div class="placeholder-card"><div class="icon">📈</div>' + t.message + '</div></div>';
    }
    return '<div class="card"><h2>📈 5. Trends and Key Insights</h2>' +
      '<p class="section-note">' + t.prior_label + ' &rarr; ' + t.latest_label + ', province-wide.</p>' +
      '<div class="chart-wrap"><canvas id="chart-trends"></canvas></div>' +
      editableInsight("trends-" + kind, t.insight) +
    '</div>';
  }

  function renderTrendsChart(cs) {
    destroyChart("trends");
    if (cs.status !== "ok" || cs.trends.status !== "ok") return;
    var by = cs.trends.by_antigen;
    var labels = Object.keys(by);
    charts.trends = new Chart(document.getElementById("chart-trends"), {
      type: "bar",
      data: { labels: labels, datasets: [{ label: "Change in coverage (percentage points)", data: labels.map(function (l) { return by[l].delta; }),
        backgroundColor: labels.map(function (l) { return (by[l].delta || 0) >= 0 ? "#1e8e3e" : "#c5221f"; }) }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
    });
  }

  // ---- Master dispatcher for the Coverage tab ----
  // Monthly and cumulative are two fully independent, complete dashboards
  // (all 6 sections each) switched via pill buttons -- never merged into one
  // view, since a monthly snapshot and a year-to-date cumulative figure mean
  // different things and averaging/combining them would misrepresent both.
  function renderCoverage() {
    var el = document.getElementById("tab-coverage");
    var summary = DATA.coverage_summary;
    var m = DATA.monitoring;

    // Monitoring & Supervision is rendered as a subsection of Service
    // Delivery, not a standalone tab -- and, like every other domain in
    // this dashboard, it must render regardless of whether Coverage data
    // itself was uploaded (Coverage/VPD/Monitoring stay fully independent
    // in both directions; see CLAUDE.md). So this function no longer
    // early-returns on missing Coverage data -- it always builds a
    // Coverage-specific block (real content, or its own placeholder) and
    // always attempts the Monitoring/Supervision block underneath.
    var kinds = [];
    if (summary.status === "ok") {
      if (summary.periods.monthly && summary.periods.monthly.status === "ok") {
        kinds.push({ key: "monthly", label: "Monthly — " + summary.periods.monthly.executive.current_period_label });
      }
      if (summary.periods.cumulative && summary.periods.cumulative.status === "ok") {
        kinds.push({ key: "cumulative", label: "Cumulative — " + summary.periods.cumulative.executive.current_period_label });
      }
    }

    var coverageHtml, kind = null, cs = null;
    if (kinds.length) {
      if (kinds.map(function (k) { return k.key; }).indexOf(state.coveragePeriodKind) === -1) {
        state.coveragePeriodKind = kinds[0].key;
      }
      var pillsHtml = kinds.length > 1
        ? '<div class="controls-row" style="margin-bottom:14px;">' + kinds.map(function (k) {
            return '<button class="period-pill' + (k.key === state.coveragePeriodKind ? " active" : "") + '" data-kind="' + k.key + '">' + k.label + '</button>';
          }).join("") + '</div>'
        : '';
      kind = state.coveragePeriodKind;
      cs = summary.periods[kind];
      syncPeriodIdToCoverageKind(kind);

      coverageHtml = pillsHtml +
        executiveOverviewHtml(cs, kind) +
        antigenMapsGridHtml(cs, kind) +
        antigenAnalysisHtml(cs, kind) +
        ucOnlyAntigenHtml(cs, kind) +
        '<div id="section-targetgap">' + targetGapHtml(cs, kind) + '</div>' +
        dropoutAnalysisHtml(cs, kind) +
        trendsHtml(cs, kind) +
        '<div class="card"><h2>Detailed District / Tehsil / UC Explorer</h2>' +
        '<p class="section-note">Drill down from province &rarr; district &rarr; tehsil &rarr; UC for the Monthly/Cumulative period selected above.</p>' +
        '<div id="coverage-explorer-mount"></div></div>';
    } else {
      coverageHtml = '<div class="card"><div class="placeholder-card"><div class="icon">📊</div>' +
        'No Service Delivery (Coverage) data uploaded yet.<br><span style="font-size:12px;">Upload a coverage workbook (District/Tehsil/UC Wise Analysis sheets) to populate this section -- VPD Surveillance and the Monitoring &amp; Supervision subsection below work independently and don\'t need it.</span></div></div>';
    }

    var rcaResult = renderRcaSection(m.rca);
    var supResult = renderSupervisorySection(m.supervisory);
    var monitoringHtml = "";
    if (!(m.rca.status === "awaiting_data" && m.supervisory.status === "awaiting_data")) {
      monitoringHtml = '<div class="section-divider" style="margin-top:24px;"><div class="line"></div><div class="label">Monitoring &amp; Supervision</div><div class="line"></div></div>' +
        rcaResult.html + supResult.html + monitorRemarksHtml(m) + monitorRemarksAnalysisHtml(m);
    }

    el.innerHTML = coverageHtml + monitoringHtml;

    el.querySelectorAll(".period-pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.coveragePeriodKind = btn.dataset.kind;
        renderCoverage();
        renderTab("overview");
      });
    });

    if (kinds.length) {
      renderAntigenMapsGrid(cs, kind);
      renderAntigenAnalysisChart(cs);
      renderUcOnlyAntigenChart(cs, kind);
      renderTargetGapChart(cs, kind);
      renderDropoutChart(cs);
      renderTrendsChart(cs);
      renderCoverageExplorer();
    }
    rcaResult.build();
    supResult.build();
    wireMonitorRemarksAnalysis(el, m);
    wireEditableInsights(el);
  }

  function renderCoverageExplorer() {
    var el = document.getElementById("coverage-explorer-mount");
    // el.innerHTML below rebuilds the search input from scratch on every
    // keystroke (the whole table re-renders as you type), which drops
    // keyboard focus -- confirmed reproducible: without this, only the
    // first character you type ever registers. Save focus/cursor state
    // before the rebuild and restore it after.
    var searchWasFocused = document.activeElement && document.activeElement.id === "coverage-search";
    var searchCursorPos = searchWasFocused ? document.activeElement.selectionStart : null;
    var cols = COVERAGE_COLS[state.coverageLevel];
    var rows = coverageRows();
    if (state.coverageSearch) {
      var q = state.coverageSearch.toLowerCase();
      var nameCol = cols[0][0];
      rows = rows.filter(function (r) { return String(r[nameCol]).toLowerCase().indexOf(q) !== -1; });
    }
    var sortCol = state.coverageSort.col, sortDir = state.coverageSort.dir;
    rows = rows.slice().sort(function (a, b) {
      var av = a[sortCol], bv = b[sortCol];
      if (av === null || av === undefined) av = -Infinity;
      if (bv === null || bv === undefined) bv = -Infinity;
      if (typeof av === "string") { av = av.toLowerCase(); bv = String(bv).toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    var thead = cols.map(function (c) {
      var cls = c[0] === sortCol ? (sortDir === "asc" ? "sorted-asc" : "sorted-desc") : "";
      return '<th class="' + cls + '" data-col="' + c[0] + '">' + c[1] + '</th>';
    }).join("");

    var tbody = rows.map(function (r, i) {
      var cells = cols.map(function (c) {
        var key = c[0];
        if (key === "flags") return "<td>" + flagBadges(r) + "</td>";
        if (key === "lpuc_count") return "<td>" + fmtNum((r.cat3_count || 0) + (r.cat4_count || 0)) + "</td>";
        var v = r[key];
        if (RAG_COLS[key]) {
          var rag = RAG_COLS[key] === "dropout" ? dropoutRag(v) : coverageRag(v);
          return '<td class="pct-cell ' + ragTextClass(rag) + '">' + fmtPct(v) + "</td>";
        }
        return "<td>" + (v === null || v === undefined ? "—" : escHtml(v)) + "</td>";
      }).join("");
      var clickable = state.coverageLevel !== "uc";
      return '<tr class="' + (clickable ? "clickable" : "") + '" data-idx="' + i + '">' + cells + "</tr>" +
        (state.coverageLevel === "uc" ? '<tr class="expand-row" id="expand-' + i + '" style="display:none;"><td colspan="' + cols.length + '">' + ucDetailHtml(r) + '</td></tr>' : "");
    }).join("");

    el.innerHTML =
      renderBreadcrumb() +
      '<div class="card">' +
      '<div class="controls-row"><input type="text" class="search-box" placeholder="Search ' + escHtml(state.coverageLevel) + '..." value="' + escHtml(state.coverageSearch) + '" id="coverage-search"></div>' +
      '<div class="table-scroll"><table><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>' +
      (rows.length === 0 ? '<p style="color:var(--text-dim);">No rows match.</p>' : '') +
      '</div>';

    var searchBox = document.getElementById("coverage-search");
    if (searchWasFocused) {
      searchBox.focus();
      searchBox.setSelectionRange(searchCursorPos, searchCursorPos);
    }
    searchBox.addEventListener("input", function (e) {
      state.coverageSearch = e.target.value; renderCoverageExplorer();
    });
    el.querySelectorAll("th[data-col]").forEach(function (th) {
      th.addEventListener("click", function () {
        var col = th.dataset.col;
        if (state.coverageSort.col === col) state.coverageSort.dir = state.coverageSort.dir === "asc" ? "desc" : "asc";
        else state.coverageSort = { col: col, dir: "desc" };
        renderCoverageExplorer();
      });
    });
    el.querySelectorAll("a[data-nav]").forEach(function (a) {
      a.addEventListener("click", function () {
        if (a.dataset.nav === "province") { state.coverageLevel = "district"; state.coverageDistrict = null; state.coverageTehsil = null; }
        if (a.dataset.nav === "district") { state.coverageLevel = "tehsil"; state.coverageTehsil = null; }
        state.coverageSearch = ""; renderCoverageExplorer();
      });
    });
    if (state.coverageLevel !== "uc") {
      el.querySelectorAll("tr.clickable").forEach(function (tr) {
        tr.addEventListener("click", function () {
          var r = rows[Number(tr.dataset.idx)];
          if (state.coverageLevel === "district") { state.coverageLevel = "tehsil"; state.coverageDistrict = r.district; }
          else if (state.coverageLevel === "tehsil") { state.coverageLevel = "uc"; state.coverageTehsil = r.tehsil; }
          state.coverageSearch = ""; state.coverageSort = { col: cols[1][0], dir: "desc" };
          renderCoverageExplorer();
        });
      });
    } else {
      el.querySelectorAll("tbody tr[data-idx]").forEach(function (tr) {
        tr.addEventListener("click", function () {
          var exp = document.getElementById("expand-" + tr.dataset.idx);
          exp.style.display = exp.style.display === "none" ? "table-row" : "none";
        });
      });
    }
  }

  function ucDetailHtml(r) {
    var fields = [["Access", r.access_rating], ["Utilisation", r.utilisation_rating],
      ["IPV1%", fmtPct(r.ipv1_pct)], ["IPV2%", fmtPct(r.ipv2_pct)], ["TCV%", fmtPct(r.tcv_pct)],
      ["Penta2%", fmtPct(r.penta2_pct)]];
    return '<div class="mini-grid">' + fields.map(function (f) {
      return "<div><strong>" + f[0] + ":</strong> " + (f[1] === null || f[1] === undefined ? "—" : escHtml(f[1])) + "</div>";
    }).join("") + "</div>";
  }

  // ================= SURVEILLANCE =================
  function diseaseKpiCard(label, value, sub) {
    return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  // ---- Shared per-domain KPI-row builders -----------------------------
  // Each of these is the single source of truth for one domain's headline
  // KPI cards -- called both from that domain's own tab AND from the
  // Overview tab's executive-overview stack (renderOtherTabSummaries), so
  // the two views are structurally incapable of disagreeing (same
  // never-recompute-independently principle as every pipeline figure).
  function mslKpiRow(v) {
    var msl = v.msl;
    return [
      diseaseKpiCard("Suspected (YTD)", fmtNum(msl.suspected_ytd), "Weeks 1-" + v.latest_epi_week),
      diseaseKpiCard("Suspected (latest week)", fmtNum(msl.suspected_latest_week), "Epi week " + v.latest_epi_week),
      diseaseKpiCard("Measles confirmed (YTD)", fmtNum(msl.classification_breakdown["Laboratory Confirmed Measles"] || 0), ""),
      diseaseKpiCard("Rubella confirmed (YTD)", fmtNum((msl.classification_breakdown["Laboratory Confirmed Measles and Rubella"] || 0) + (msl.classification_breakdown["Clinically Compatible Rubella"] || 0)), "incl. double infection"),
      diseaseKpiCard("Sample collection rate", fmtPct(msl.sample_collection_rate_pct), ""),
      diseaseKpiCard("Sample adequacy rate", fmtPct(msl.sample_adequacy_rate_pct), "of collected samples"),
      diseaseKpiCard("Reporting HFs", fmtNum(msl.reporting_footprint.reporting_health_facilities), ""),
      diseaseKpiCard("Reporting UCs", fmtNum(msl.reporting_footprint.reporting_ucs), "of " + msl.reporting_footprint.reporting_districts + " districts"),
    ].join("");
  }

  function diphtheriaKpiRow(v) {
    var diph = v.diphtheria;
    return [
      diseaseKpiCard("Cases (YTD)", fmtNum(diph.ytd.case_count), diph.ytd.districts_affected + " districts affected"),
      diseaseKpiCard("Lab confirmed", fmtNum(diph.ytd.lab_confirmed_count), ""),
      diseaseKpiCard("No DPT history", fmtPct(diph.ytd.pct_no_dpt_history), ""),
      diseaseKpiCard("Aged 5+", fmtPct(diph.ytd.pct_aged_5_plus), ""),
      diseaseKpiCard("Deaths", fmtNum(diph.ytd.deaths), ""),
    ].join("");
  }

  function pertussisKpiRow(v) {
    var pert = v.pertussis;
    var totalFromDistricts = pert.district_breakdown.reduce(function (s, r) { return s + r.case_count; }, 0);
    var missingDistrict = pert.total_cases - totalFromDistricts;
    return [diseaseKpiCard("Suspected Pertussis", fmtNum(pert.total_cases),
      missingDistrict > 0 ? nounFor(missingDistrict, "case") + " " + plural(missingDistrict, "has", "have") + " no recorded district" : "")].join("");
  }

  function nntKpiRow(v) {
    var nnt = v.nnt;
    return [
      diseaseKpiCard("Cases", fmtNum(nnt.ytd.case_count), ""),
      diseaseKpiCard("Deaths", fmtNum(nnt.ytd.deaths), ""),
    ].join("");
  }

  function rcaKpiRow(rca) {
    var ov = rca.overview, zd = rca.zero_dose;
    return [
      monitoringKpiCard("Children assessed", fmtNum(ov.total_children_assessed), rca.reporting_window || ""),
      monitoringKpiCard("RCA visits", fmtNum(ov.total_rca_visits), nounFor(ov.districts_covered, "district")),
      monitoringKpiCard("Zero-dose children", fmtNum(zd.zero_dose_count), fmtPct(zd.zero_dose_pct) + " of " + fmtNum(zd.assessed_count) + " assessed for Penta1 (of " + fmtNum(ov.total_children_assessed) + " children assessed overall)"),
      monitoringKpiCard("Monitors involved", fmtNum(ov.monitors_involved), ""),
    ].join("");
  }

  function measlesOutbreakAlertHtml(v) {
    // Replaces the old quartile-based "Districts Requiring Action" table.
    // See indicators_vpd.py::measles_outbreak_alert_ucs -- a deterministic
    // case-continuity rule-based screen (confirmed cases in most of the last
    // 4 epi weeks in a UC), not a formal transmission-chain model.
    var oa = v.msl.outbreak_alert;
    var windowLabel = "weeks " + oa.window_weeks[0] + "-" + oa.window_weeks[oa.window_weeks.length - 1];
    var rows = oa.ucs.map(function (r) {
      var weekly = oa.window_weeks.map(function (w) { return "W" + w + ": " + fmtNum(r.weekly_counts[w] || 0); }).join(", ");
      return "<tr><td>" + escHtml(r.uc) + "</td><td>" + escHtml(r.district) + "</td><td>" + r.weeks_with_cases + " of " + oa.window_weeks.length +
        "</td><td>" + fmtNum(r.total_confirmed_in_window) + "</td><td>" + weekly + "</td></tr>";
    }).join("");
    var body = oa.ucs.length
      ? '<div class="table-scroll"><table><thead><tr><th>UC</th><th>District</th><th>Weeks with confirmed cases</th>' +
        '<th>Total confirmed (' + windowLabel + ')</th><th>Weekly breakdown</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<p class="sub">No UC currently has confirmed measles cases in ' + oa.min_weeks_with_cases + ' or more of ' + windowLabel + '.</p>';
    var instructionsId = "vpd-outbreak-instructions-" + v.latest_epi_week;
    return '<div class="card"><h2>Measles Outbreak Alert</h2>' +
      '<p class="sub">UCs with confirmed measles cases in ' + oa.min_weeks_with_cases + ' or more of the last ' + oa.window_weeks.length +
        ' epi weeks (' + windowLabel + ') -- a rule-based screen for possible ongoing active transmission, for field follow-up, not a confirmed outbreak determination.</p>' +
      body +
      '<h3 style="margin-top:14px;">Province instructions / outbreak response guidance</h3>' +
      editableInsight(instructionsId, "Click to add province-level instructions for these districts/UCs regarding measles outbreak response.") +
    '</div>';
  }

  function renderSurveillance() {
    var el = document.getElementById("tab-surveillance");
    var v = DATA.vpd;
    var ki = DATA.vpd_key_indicators;
    if (v.status === "awaiting_data") {
      // The Key Indicators section (from a separate workbook) works even
      // when the MSL line list itself hasn't been uploaded -- same
      // per-domain independence as every other tab in this dashboard.
      if (ki && ki.status === "ok") {
        el.innerHTML = '<div class="card"><h2>VPD Surveillance</h2><div class="placeholder-card">' +
          '<div class="icon">⏳</div>No VPD surveillance line list was uploaded for this run -- showing the Key Surveillance Indicators from the Indicator Sheet only.</div></div>' +
          measlesIncidenceMapHtml(ki) +
          keyIndicatorsSectionHtml(ki);
        wireEditableInsights(el);
        renderMeaslesIncidenceMap(ki);
        return;
      }
      el.innerHTML = '<div class="card"><h2>VPD Surveillance</h2><div class="placeholder-card">' +
        '<div class="icon">⏳</div>No VPD surveillance file was uploaded for this run.</div></div>';
      return;
    }
    var msl = v.msl, diph = v.diphtheria, pert = v.pertussis, nnt = v.nnt;
    var dq = msl.data_quality;

    // ---- Surveillance KPI row ----
    var mslKpis = mslKpiRow(v);

    var classRows = Object.keys(msl.classification_breakdown).sort(function (a, b) {
      return msl.classification_breakdown[b] - msl.classification_breakdown[a];
    }).map(function (k) {
      return "<tr><td>" + k + "</td><td>" + fmtNum(msl.classification_breakdown[k]) + "</td></tr>";
    }).join("");

    // ---- Population profile: age "% under 5" callout ----
    var under5 = (msl.age_distribution["0-8m"] || 0) + (msl.age_distribution["9-23m"] || 0) + (msl.age_distribution["24-59m"] || 0);
    var ageTotal = Object.keys(msl.age_distribution).reduce(function (s, k) { return s + msl.age_distribution[k]; }, 0);
    var pctUnder5 = ageTotal ? (under5 / ageTotal * 100) : null;

    // ---- Vaccination-status callout: % unvaccinated or partial among eligible suspected ----
    var doseElig = msl.dose_status_suspected;
    var doseEligTotal = Object.keys(doseElig).reduce(function (s, k) { return s + doseElig[k]; }, 0);
    var pctUnvaxOrPartial = doseEligTotal ? (((doseElig["Zero dose"] || 0) + (doseElig["1 dose"] || 0)) / doseEligTotal * 100) : null;

    // Under-eligible-age cases with a dose recorded -- count still feeds the
    // priority alert pill, error list, and auto-insights below (the
    // per-district anomaly table itself was removed from this tab).
    var anomaly = dq.under_age_vaccinated_anomaly;

    // ---- Priority alert pills ----
    var alertPills = [
      dq.duplicate_epid.duplicate_epid_count > 0 ? '<span class="badge poor">' + dq.duplicate_epid.duplicate_epid_count + ' duplicate Epid numbers</span>' : "",
      anomaly.anomaly_count > 0 ? '<span class="badge poor">' + anomaly.anomaly_count + ' under-9m cases with a dose recorded</span>' : "",
      dq.classification_discordance.flagged_count > 0 ? '<span class="badge warning">' + dq.classification_discordance.flagged_count + ' discordant lab/classification results</span>' : "",
      dq.timeliness.negative_delay_count > 0 ? '<span class="badge warning">' + dq.timeliness.negative_delay_count + ' notified before rash onset (date error)</span>' : "",
      dq.lab_confirmed_dose_validation.two_dose_count > 0 ? '<span class="badge neutral">' + dq.lab_confirmed_dose_validation.two_dose_count + ' lab-confirmed cases with 2 prior doses (needs field validation)</span>' : "",
    ].filter(Boolean).join(" ");

    // ---- Missing-data field-completeness bars ----
    var completenessRows = dq.field_completeness.map(function (r) {
      var color = r.pct_complete >= 80 ? "#1e8e3e" : r.pct_complete >= 50 ? "#b06a00" : "#c5221f";
      return '<div class="completeness-row"><div class="completeness-label">' + escHtml(r.field) + '</div>' +
        '<div class="completeness-bar-track"><div class="completeness-bar-fill" style="width:' + r.pct_complete.toFixed(1) + '%;background:' + color + ';"></div></div>' +
        '<div class="completeness-pct">' + fmtPct(r.pct_complete) + '</div></div>';
    }).join("");

    // ---- Classification discordance 3x3 matrix ----
    var discordCols = ["Confirmed", "Discarded", "Pending", "Other (Clinically Compatible etc.)"];
    var discordRowsLabels = ["Positive", "Negative", "Missing/Not Done"];
    var cellByKey = {};
    dq.classification_discordance.cells.forEach(function (c) { cellByKey[c.lab_result + "|" + c.classification] = c; });
    var discordHead = "<tr><th>Lab result \\ Classification</th>" + discordCols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr>";
    var discordBody = discordRowsLabels.map(function (lr) {
      return "<tr><td><strong>" + lr + "</strong></td>" + discordCols.map(function (c) {
        var cell = cellByKey[lr + "|" + c];
        var cls = cell.flagged ? ' class="discordant-cell"' : "";
        return "<td" + cls + ">" + fmtNum(cell.count) + (cell.flagged ? " ⚠" : "") + "</td>";
      }).join("") + "</tr>";
    }).join("");

    // ---- Timeliness ----
    var tOrder = ["<=48h", "3-7 days", ">7 days"];

    // ---- Errors & inconsistencies narrative ----
    var errorList = [
      nounFor(dq.duplicate_epid.duplicate_epid_count, "Epid number") + " " + plural(dq.duplicate_epid.duplicate_epid_count, "appears", "appear") + " on more than one row (" + dq.duplicate_epid.duplicate_row_count + " rows total) -- likely duplicate reporting.",
      nounFor(anomaly.anomaly_count, "case") + " under 9 months old (not yet MCV1-eligible) " + plural(anomaly.anomaly_count, "has", "have") + " a vaccine dose recorded -- worth field verification.",
      nounFor(dq.classification_discordance.flagged_count, "case") + " " + plural(dq.classification_discordance.flagged_count, "has", "have") + " a lab result that doesn't match the final classification recorded (positive result marked Discarded, or negative result marked Confirmed).",
      nounFor(dq.timeliness.negative_delay_count, "case") + " " + plural(dq.timeliness.negative_delay_count, "shows", "show") + " a notification date before the recorded rash-onset date -- a date-entry error.",
      nounFor(dq.lab_confirmed_dose_validation.two_dose_count, "lab-confirmed case") + " " + plural(dq.lab_confirmed_dose_validation.two_dose_count, "had", "had") + " 2 prior vaccine doses recorded, and " + nounFor(dq.lab_confirmed_dose_validation.one_dose_count, "case") + " had 1 -- MCV is highly effective, so these merit field validation rather than being taken at face value.",
    ].map(function (t) { return "<li>" + t + "</li>"; }).join("");

    var diphKpis = diphtheriaKpiRow(v);

    var pertRowsHtml = pert.district_breakdown.slice().sort(function (a, b) { return b.case_count - a.case_count; })
      .map(function (r) { return "<tr><td>" + escHtml(r.district) + "</td><td>" + fmtNum(r.case_count) + "</td></tr>"; }).join("");

    }, null);
    var pertMapAutoInsight = pertMapTop && pert.district_map.features[pertMapTop].case_count > 0
      ? pertMapTop + " has the most suspected pertussis cases (" + fmtNum(pert.district_map.features[pertMapTop].case_count) + ")." +
        (pert.district_map.unmapped_districts.length ? " Not shown on map (no boundary match): " + pert.district_map.unmapped_districts.join(", ") + "." : "")
      : "No district-level pertussis case data available to map.";

    var nntKpis = nntKpiRow(v);
    var nntRowsHtml = nnt.by_district_ytd.slice().sort(function (a, b) { return b.case_count - a.case_count; })
      .map(function (r) { return "<tr><td>" + escHtml(r.district) + "</td><td>" + fmtNum(r.case_count) + "</td></tr>"; }).join("");

    // ---- Diphtheria: district map + age vs. dose-status ----
    var diphMapDistricts = diph.district_map ? Object.keys(diph.district_map.features) : [];
    var diphMapTop = diphMapDistricts.reduce(function (best, name) {
      return (!best || diph.district_map.features[name].case_count > diph.district_map.features[best].case_count) ? name : best;
    }, null);
    var diphMapAutoInsight = diphMapTop && diph.district_map.features[diphMapTop].case_count > 0
      ? diphMapTop + " has the most diphtheria cases (" + fmtNum(diph.district_map.features[diphMapTop].case_count) + ")." +
        (diph.district_map.unmapped_districts.length ? " Not shown on map (no boundary match): " + diph.district_map.unmapped_districts.join(", ") + "." : "")
      : "No district-level diphtheria case data available to map.";
    var diphAgeDose = diph.age_dose_breakdown;
    var diphZeroDoseTotal = diphAgeDose.age_bands.reduce(function (s, b) { return s + (diphAgeDose.counts[b + "|Zero dose"] || 0); }, 0);
    var diphAllTotal = Object.keys(diphAgeDose.counts).reduce(function (s, k) { return s + diphAgeDose.counts[k]; }, 0);
    var diphAgeDoseAutoInsight = diphAllTotal
      ? countPct(diphZeroDoseTotal, diphAllTotal) + " of diphtheria cases with a recorded age band had zero DPT doses at time of case."
      : "No age/dose data available.";

    // ---- NNT: district map + mother vaccination history + place of delivery ----
    var nntMapDistricts = nnt.district_map ? Object.keys(nnt.district_map.features) : [];
    var nntMapTop = nntMapDistricts.reduce(function (best, name) {
      return (!best || nnt.district_map.features[name].case_count > nnt.district_map.features[best].case_count) ? name : best;
    }, null);
    var nntMapAutoInsight = nntMapTop && nnt.district_map.features[nntMapTop].case_count > 0
      ? nntMapTop + " has the most neonatal tetanus cases (" + fmtNum(nnt.district_map.features[nntMapTop].case_count) + ")." +
        (nnt.district_map.unmapped_districts.length ? " Not shown on map (no boundary match): " + nnt.district_map.unmapped_districts.join(", ") + "." : "")
      : "No district-level NNT case data available to map.";
    var mvhKeys = Object.keys(nnt.mother_vaccination_history);
    var mvhTotal = mvhKeys.reduce(function (s, k) { return s + nnt.mother_vaccination_history[k]; }, 0);
    var mvhAllSame = mvhKeys.length === 1;
    var nntMotherVaxAutoInsight = mvhAllSame
      ? "Every NNT case in this dataset shows the same recorded value (\"" + mvhKeys[0] + "\") for mother's TT dose history -- either a genuine finding (all case mothers unvaccinated) or a field-completeness gap; worth field verification either way."
      : (mvhKeys.length ? mvhKeys.reduce(function (best, k) { return nnt.mother_vaccination_history[k] > nnt.mother_vaccination_history[best] ? k : best; }, mvhKeys[0]) : "") &&
        "Most common recorded mother TT dose history: \"" + mvhKeys.reduce(function (best, k) { return nnt.mother_vaccination_history[k] > nnt.mother_vaccination_history[best] ? k : best; }, mvhKeys[0]) + "\" (" +

      : "No place-of-delivery data available.";

    var dailyCurve = msl.daily_epi_curve;

    var topClass = classKeysForInsight[0], topOutcome = outcomeKeysForInsight[0];

    // ---- Tab-level Overview / Summary (Section 5's spec: overall suspected

    var outbreakUcs = msl.outbreak_alert.ucs;

      : "";
    var vpdOverviewInsightId = "vpd-tab-overview-" + v.latest_epi_week;

  // ================= MONITORING (RCA + Supervisory Checklist) =================
  function monitoringKpiCard(label, value, sub) {
    return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  function ratePct(pct) { return pct === null || pct === undefined ? "—" : pct.toFixed(1) + "%"; }
  function rateColor(pct, goodMin, warnMin) {
    if (pct === null || pct === undefined) return "#9aa0a6";
    return pct >= goodMin ? "#1e8e3e" : pct >= warnMin ? "#b06a00" : "#c5221f";
  }
  // "45 (32%)" -- the number first, percentage in parentheses, used on
  // every count-based chart in Monitoring so a value is readable without
  // hovering.
  function countPct(count, total) {
    var pct = total ? (count / total * 100) : null;
    return fmtNum(count) + (pct === null ? "" : " (" + pct.toFixed(1) + "%)");
  }

        '<div class="placeholder-card"><div class="icon">⏳</div>' + escHtml(rca.message) + '</div></div>';
    }
    var ov = rca.overview, zd = rca.zero_dose;
    var kpis = rcaKpiRow(rca);

    var zdAnomalyHtml = "";
    if (zd.zero_dose_count > 0) {
      var zdRows = zd.by_district.map(function (r) {
        return "<tr><td>" + escHtml(r.district) + "</td><td>" + fmtNum(r.zero_dose_count) + "</td></tr>";
      }).join("");
      zdAnomalyHtml = '<div class="anomaly-box"><h3>Zero-dose children identified, for field follow-up</h3>' +
        '<div class="table-scroll"><table><thead><tr><th>District</th><th>Zero-dose count</th></tr></thead><tbody>' + zdRows + '</tbody></table></div></div>';
    }

    var overviewInsightId = "monitoring-rca-summary-" + (rca.reporting_window || "");
    var overviewAutoInsight = fmtNum(ov.total_children_assessed) + " children assessed across " + fmtNum(ov.total_rca_visits) +
      " RCA visits (" + (rca.reporting_window || "period not recorded") + ") in " + nounFor(ov.districts_covered, "district") + ", by " +
      nounFor(ov.monitors_involved, "monitor") + ". " + nounFor(zd.zero_dose_count, "zero-dose child", "zero-dose children") +
      " identified (" + fmtPct(zd.zero_dose_pct) + " of " + fmtNum(zd.assessed_count) + " assessed for Penta1).";

    // Age-segregation dropdown on Antigen-wise Vaccination Status, using the
    // source's own "Age Group" field (whatever categories it actually
    // contains -- see rca_antigen_coverage_by_age_group).
    var ageGroupOptions = Object.keys(rca.antigen_coverage_by_age_group);
    if (ageGroupOptions.indexOf(state.rcaAgeGroup) === -1) state.rcaAgeGroup = "All";
    var antigenRows = rca.antigen_coverage_by_age_group[state.rcaAgeGroup];
    var antigenInsightId = "monitoring-rca-antigen-" + state.rcaAgeGroup + "-" + (rca.reporting_window || "");
    var lowestAntigen = antigenRows.filter(function (r) { return r.pct !== null; })
      .reduce(function (worst, r) { return (worst === null || r.pct < worst.pct) ? r : worst; }, null);
    var antigenAutoInsight = lowestAntigen
      ? "Lowest field-verified coverage" + (state.rcaAgeGroup !== "All" ? " (age group " + state.rcaAgeGroup + ")" : "") + ": " + lowestAntigen.antigen + " at " + fmtPct(lowestAntigen.pct) +
        " (" + lowestAntigen.vaccinated + " of " + lowestAntigen.assessed + " applicable children)."
      : "No antigen coverage data available for this age group.";

    var areaTotal = ov.total_children_assessed;
    var htr = rca.hard_to_reach, hrp = rca.high_risk_population;
    var areaInsightId = "monitoring-rca-area-" + (rca.reporting_window || "");
    var ruralRow = rca.area_type_breakdown.filter(function (r) { return /rural/i.test(r.area_type); })[0];
    var areaAutoInsight = (ruralRow ? "Rural areas account for " + countPct(ruralRow.children_assessed, areaTotal) + " of children assessed. " : "") +
      countPct(htr.children_in_hard_to_reach, areaTotal) + " were in hard-to-reach areas, and " +
      countPct(hrp.children_in_high_risk_population, areaTotal) + " were in high-risk population groups.";

    var mb = rca.monitor_breakdown;
    var designationKeys = Object.keys(mb.by_designation);
    var agencyKeys = Object.keys(mb.by_agency);
    var monitorInsightId = "monitoring-rca-monitors-" + (rca.reporting_window || "");
    var topDesignation = designationKeys.reduce(function (best, k) { return (!best || mb.by_designation[k] > mb.by_designation[best]) ? k : best; }, null);
    var topAgency = agencyKeys.reduce(function (best, k) { return (!best || mb.by_agency[k] > mb.by_agency[best]) ? k : best; }, null);
    var monitorAutoInsight = (topDesignation ? "Most RCA visits were conducted by " + topDesignation + " monitors (" + countPct(mb.by_designation[topDesignation], ov.total_rca_visits) + " of visits). " : "") +
      (topAgency ? topAgency + " conducted " + countPct(mb.by_agency[topAgency], ov.total_rca_visits) + " of visits." : "");

    var reasonsKeys = Object.keys(rca.non_vaccination_reasons);
    var reasonsTotal = reasonsKeys.reduce(function (s, k) { return s + rca.non_vaccination_reasons[k]; }, 0);
    var reasonsInsightId = "monitoring-rca-reasons-" + (rca.reporting_window || "");
    var topReason = reasonsKeys.reduce(function (best, k) { return (!best || rca.non_vaccination_reasons[k] > rca.non_vaccination_reasons[best]) ? k : best; }, null);
    var reasonsAutoInsight = topReason
      ? "Most-cited reason for non-vaccination: \"" + topReason + "\" (" + countPct(rca.non_vaccination_reasons[topReason], reasonsTotal) + " of " + fmtNum(reasonsTotal) + " recorded reasons)."
      : "";

    var rcaMapDistricts = rca.district_map ? Object.keys(rca.district_map.features) : [];
    var rcaMapTop = rcaMapDistricts.reduce(function (best, name) {
      return (!best || rca.district_map.features[name].children_assessed > rca.district_map.features[best].children_assessed) ? name : best;
    }, null);
    var rcaMapInsightId = "monitoring-rca-map-" + (rca.reporting_window || "");
    var rcaMapAutoInsight = rcaMapTop && rca.district_map.features[rcaMapTop].children_assessed > 0
      ? rcaMapTop + " has the most children assessed by RCA (" + fmtNum(rca.district_map.features[rcaMapTop].children_assessed) + ")." +
        (rca.district_map.unmapped_districts.length ? " Not shown on map (no boundary match): " + rca.district_map.unmapped_districts.join(", ") + "." : "")
      : "No RCA activity recorded in this dataset yet.";

    var html =
      '<div class="section-heading"><h2><span class="disease-tag" style="background:var(--rca);"></span>RCA &mdash; Rapid Convenience Assessment</h2>' +
        '<p class="sub">Community-based, child-level spot checks of vaccination status.</p></div>' +
      '<div class="card">' +
        '<div class="grid kpi-row">' + kpis + '</div>' +
        editableInsight(overviewInsightId, overviewAutoInsight) +
        zdAnomalyHtml +
      '</div>' +
      '<div class="card"><h2>Antigen-wise Vaccination Status (field-verified)</h2>' +
        '<div class="controls-row"><label style="font-size:12.5px;">Age group: </label><select class="filter-select" id="rca-agegroup-filter">' +
          ageGroupOptions.map(function (g) { return '<option value="' + escHtml(g) + '"' + (state.rcaAgeGroup === g ? " selected" : "") + '>' + (g === "All" ? "All ages" : g + " months") + '</option>'; }).join("") +
        '</select><span class="print-only-filter">Age group: ' + (state.rcaAgeGroup === "All" ? "All ages" : state.rcaAgeGroup + " months") + '</span></div>' +
        '<div class="chart-wrap" style="height:' + Math.max(200, antigenRows.length * 20) + 'px;"><canvas id="chart-rca-antigen"></canvas></div>' +
        '<p class="sub">Children vaccinated, of those for whom each antigen was applicable by age (excludes children not yet due).</p>' +
        editableInsight(antigenInsightId, antigenAutoInsight) +
      '</div>' +
      '<div class="card"><h2>RCA Visits by Monitor (Cadre &amp; Agency)</h2>' +
        '<div class="grid two-col">' +
          '<div><h3>By Designation (Cadre)</h3><div class="chart-wrap"><canvas id="chart-rca-designation"></canvas></div></div>' +
          '<div><h3>By Agency</h3><div class="chart-wrap"><canvas id="chart-rca-agency"></canvas></div></div>' +
        '</div>' +
        editableInsight(monitorInsightId, monitorAutoInsight) +
      '</div>' +
      (reasonsKeys.length ? '<div class="card"><h2>Reasons for Non-Vaccination</h2><div class="chart-wrap"><canvas id="chart-rca-reasons"></canvas></div>' +
        editableInsight(reasonsInsightId, reasonsAutoInsight) + '</div>' : "") +
      '<div class="card"><h2>Area Profile</h2>' +
        '<div class="grid three-col">' +
          '<div><h3>Urban / Rural</h3><div class="chart-wrap"><canvas id="chart-rca-areatype"></canvas></div></div>' +
          '<div><h3>Hard-to-Reach Area</h3><div class="chart-wrap"><canvas id="chart-rca-htr"></canvas></div></div>' +
          '<div><h3>High-Risk Population</h3><div class="chart-wrap"><canvas id="chart-rca-hrp"></canvas></div></div>' +
        '</div>' +
        editableInsight(areaInsightId, areaAutoInsight) +
      '</div>' +
      (rcaMapDistricts.length ? '<div class="card"><h2>🗺️ RCA Coverage Map</h2>' +
        singleDistrictMapHtml("map-rca", "map-tooltip-rca", "Children assessed by district", "District boundaries: user-provided reference map. Reflects only the district(s) actually covered by the RCA data received.") +
        editableInsight(rcaMapInsightId, rcaMapAutoInsight) +
      '</div>' : "");

    return { html: html, build: function () {
      destroyChart("rcaAntigen"); destroyChart("rcaAreaType");
      destroyChart("rcaHtr"); destroyChart("rcaHrp"); destroyChart("rcaDesignation"); destroyChart("rcaAgency");
      destroyChart("rcaReasons");

      charts.rcaAntigen = new Chart(document.getElementById("chart-rca-antigen"), {
        type: "bar",
        data: {
          labels: antigenRows.map(function (r) { return r.antigen; }),
          datasets: [{ label: "Vaccinated (of applicable)", data: antigenRows.map(function (r) { return r.vaccinated; }),
            backgroundColor: antigenRows.map(function (r) { return targetMetColor(r.pct === null ? 0 : r.pct); }),
            labelText: antigenRows.map(function (r) { return r.pct === null ? "n/a" : countPct(r.vaccinated, r.assessed); }) }]
        },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "20%" } } }
      });

      var rcaAgeGroupSelect = document.getElementById("rca-agegroup-filter");
      if (rcaAgeGroupSelect) {
        rcaAgeGroupSelect.addEventListener("change", function (e) { state.rcaAgeGroup = e.target.value; renderCoverage(); });
      }

      if (rcaMapDistricts.length) {
        renderSingleDistrictMap("map-rca", "map-tooltip-rca", rca.district_map,
          function (entry) { return entry.children_assessed; },
          function (label, entry) { return label + "<br>Children assessed: " + fmtNum(entry.children_assessed) + "<br>RCA visits: " + fmtNum(entry.rca_visits) + "<br>Zero-dose: " + fmtNum(entry.zero_dose_count); },
          function (name, entry) { return name + ": " + fmtNum(entry.children_assessed); });
      }

      var areaTypeCounts = {};
      rca.area_type_breakdown.forEach(function (r) { areaTypeCounts[r.area_type] = r.children_assessed; });
      var areaTypeDoughnut = doughnutData(areaTypeCounts);
      charts.rcaAreaType = new Chart(document.getElementById("chart-rca-areatype"), {
        type: "doughnut",
        data: { labels: areaTypeDoughnut.labels, datasets: [{ data: areaTypeDoughnut.values, backgroundColor: areaTypeDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var htrDoughnut = doughnutData({ "Yes": htr.children_in_hard_to_reach, "No": areaTotal - htr.children_in_hard_to_reach });
      charts.rcaHtr = new Chart(document.getElementById("chart-rca-htr"), {
        type: "doughnut",
        data: { labels: htrDoughnut.labels, datasets: [{ data: htrDoughnut.values, backgroundColor: ["#b06a00", "#1a5fb4"] }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var hrpDoughnut = doughnutData({ "Yes": hrp.children_in_high_risk_population, "No": areaTotal - hrp.children_in_high_risk_population });
      charts.rcaHrp = new Chart(document.getElementById("chart-rca-hrp"), {
        type: "doughnut",
        data: { labels: hrpDoughnut.labels, datasets: [{ data: hrpDoughnut.values, backgroundColor: ["#c5221f", "#1a5fb4"] }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var designationTotal = designationKeys.reduce(function (s, k) { return s + mb.by_designation[k]; }, 0);
      charts.rcaDesignation = new Chart(document.getElementById("chart-rca-designation"), {
        type: "bar",
        data: { labels: designationKeys, datasets: [{ label: "RCA visits", data: designationKeys.map(function (k) { return mb.by_designation[k]; }),
          backgroundColor: "#0f766e", labelText: designationKeys.map(function (k) { return countPct(mb.by_designation[k], designationTotal); }) }] },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "25%" } } }
      });

      var agencyDoughnut = doughnutData(mb.by_agency);
      charts.rcaAgency = new Chart(document.getElementById("chart-rca-agency"), {
        type: "doughnut",
        data: { labels: agencyDoughnut.labels, datasets: [{ data: agencyDoughnut.values, backgroundColor: agencyDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      if (reasonsKeys.length) {
        charts.rcaReasons = new Chart(document.getElementById("chart-rca-reasons"), {
          type: "bar",
          data: { labels: reasonsKeys, datasets: [{ label: "Cases", data: reasonsKeys.map(function (k) { return rca.non_vaccination_reasons[k]; }),
            backgroundColor: "#c5221f", labelText: reasonsKeys.map(function (k) { return countPct(rca.non_vaccination_reasons[k], reasonsTotal); }) }] },
          options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "25%" } } }
        });
      }
    } };
  }

  function renderSupervisorySection(sup) {
    if (sup.status === "awaiting_data") {
      return { html:
        '<div class="section-divider"><div class="line"></div><div class="label">Supervisory Checklist</div><div class="line"></div></div>' +
        '<div class="card"><h2><span class="disease-tag" style="background:var(--supervisory);"></span>Supervisory Checklist</h2>' +
        '<div class="placeholder-card"><div class="icon">⏳</div>' + escHtml(sup.message) + '</div></div>', build: function () {} };
    }
    var ov = sup.overview;
    var kpis = supervisoryKpiRow(sup);

    var riskHtml = "";
    if (sup.practice_risk_flags.length) {
      var riskPills = sup.practice_risk_flags.map(function (r) {
        return '<span class="badge poor">' + escHtml(r.item) + ": " + countPct(r.yes, r.answered) + '</span>';
      }).join(" ");
      riskHtml = '<div class="alert-pills" style="margin-top:10px;">' + riskPills + '</div>';
    }

    var cc = sup.cold_chain;
    var siteTypeKeys = Object.keys(sup.site_type_breakdown);
    var siteTypeTotal = siteTypeKeys.reduce(function (s, k) { return s + sup.site_type_breakdown[k]; }, 0);
    var siteTypeKpis = siteTypeKeys.map(function (k) {
      return monitoringKpiCard(k.charAt(0).toUpperCase() + k.slice(1) + " sites", fmtNum(sup.site_type_breakdown[k]), countPct(sup.site_type_breakdown[k], siteTypeTotal) + " of visits");
    }).join("");
    var coldChainKpis = [
      monitoringKpiCard("Backup power available", ratePct(cc.backup_power_available.pct), cc.backup_power_available.answered + " visits checked"),
      monitoringKpiCard("SDD fridges functional", cc.sdd.total_units ? ratePct(Math.min(cc.sdd.pct_functional, 100)) : "—", cc.sdd.functional_units + "/" + cc.sdd.total_units + " units" + (cc.sdd.inconsistent_visits ? " (data inconsistency flagged)" : "")),
      monitoringKpiCard("ILR functional units observed", fmtNum(cc.ilr_functional_units_observed), "no installed-base total in source data"),
      monitoringKpiCard("Stockout in last 3 months", ratePct(cc.stockout_last_3_months.pct), cc.stockout_last_3_months.answered + " visits checked"),
    ].join("") + siteTypeKpis;

    var compItems = sup.compliance_items;

    var overviewInsightId = "monitoring-supervisory-summary-" + (sup.reporting_window || "");
    var overviewAutoInsight = fmtNum(ov.total_visits) + " supervisory visits to " + fmtNum(ov.facilities_covered) + " facilities (" +
      (sup.reporting_window || "period not recorded") + "), " + nounFor(ov.districts_covered, "district") + ", by " + nounFor(ov.monitors_involved, "monitor") + "." +
      (sup.practice_risk_flags.length ? " " + sup.practice_risk_flags[0].item + " observed in " + ratePct(sup.practice_risk_flags[0].pct) + " of visits." : "");

    var complianceInsightId = "monitoring-supervisory-compliance-" + (sup.reporting_window || "");
    var weakestItem = compItems.length ? compItems[0] : null;
    var complianceAutoInsight = weakestItem
      ? "Weakest checklist item: \"" + weakestItem.item + "\" at " + countPct(weakestItem.yes, weakestItem.answered) + " compliance."
      : "";

    var topSiteType = siteTypeKeys.reduce(function (best, k) { return (!best || sup.site_type_breakdown[k] > sup.site_type_breakdown[best]) ? k : best; }, null);
    var coldChainInsightId = "monitoring-supervisory-coldchain-" + (sup.reporting_window || "");
    var coldChainAutoInsight = "Backup power was available at " + countPct(cc.backup_power_available.yes, cc.backup_power_available.answered) + " of visited sites, with " +
      countPct(cc.stockout_last_3_months.yes, cc.stockout_last_3_months.answered) + " reporting a stockout in the last 3 months." +
      (topSiteType ? " Most visits were to " + topSiteType + " sites (" + countPct(sup.site_type_breakdown[topSiteType], siteTypeTotal) + ")." : "");

    var html =
      '<div class="section-divider"><div class="line"></div><div class="label">Supervisory Checklist</div><div class="line"></div></div>' +
      '<div class="section-heading"><h2><span class="disease-tag" style="background:var(--supervisory);"></span>Supervisory Checklist</h2>' +
        '<p class="sub">Facility-level supervisory visits assessing site readiness, cold chain, injection safety, and service quality.</p></div>' +
      '<div class="card">' +
        '<div class="grid kpi-row">' + kpis + '</div>' +
        editableInsight(overviewInsightId, overviewAutoInsight) +
        riskHtml +
      '</div>' +
      '<div class="card"><h2>Checklist Item Compliance (weakest first)</h2><div class="chart-wrap" style="height:' + Math.max(260, compItems.length * 24) + 'px;"><canvas id="chart-sup-compliance"></canvas></div>' +
        editableInsight(complianceInsightId, complianceAutoInsight) +
      '</div>' +
      '<div class="card"><h2>Cold Chain &amp; Vaccine Supply</h2><div class="grid kpi-row">' + coldChainKpis + '</div>' +
        editableInsight(coldChainInsightId, coldChainAutoInsight) +
        '<div class="grid two-col" style="margin-top:14px;">' +
          '<div><h3>Site-Type Distribution</h3><div class="chart-wrap"><canvas id="chart-sup-sitetype"></canvas></div></div>' +
          '<div><h3>Cold Chain Readiness by Site Type</h3><div class="chart-wrap"><canvas id="chart-sup-sitetype-coldchain"></canvas></div></div>' +
        '</div>' +
        '<p class="sub" style="margin-top:6px;">Site-type categories are whatever the source data actually contains for this upload, not a fixed list.</p>' +
      '</div>';

    return { html: html, build: function () {
      destroyChart("supCompliance"); destroyChart("supSiteType"); destroyChart("supSiteTypeColdChain");

      charts.supCompliance = new Chart(document.getElementById("chart-sup-compliance"), {
        type: "bar",
        data: {
          labels: compItems.map(function (r) { return r.item; }),
          datasets: [{ label: "Yes", data: compItems.map(function (r) { return r.yes; }),
            backgroundColor: compItems.map(function (r) { return rateColor(r.pct, 80, 50); }),
            labelText: compItems.map(function (r) { return countPct(r.yes, r.answered); }) }]
        },
        options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grace: "20%" } } }
      });

      var siteTypeDoughnut = doughnutData(sup.site_type_breakdown);
      charts.supSiteType = new Chart(document.getElementById("chart-sup-sitetype"), {
        type: "doughnut",
        data: { labels: siteTypeDoughnut.labels, datasets: [{ data: siteTypeDoughnut.values, backgroundColor: siteTypeDoughnut.colors }] },
        options: { responsive: true, maintainAspectRatio: false, sliceLabelsOn: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      var stc = sup.site_type_cold_chain;
      charts.supSiteTypeColdChain = new Chart(document.getElementById("chart-sup-sitetype-coldchain"), {
        type: "bar",
        data: {
          labels: stc.map(function (r) { return r.site_type; }),
          datasets: [
            { label: "Backup power available", data: stc.map(function (r) { return r.backup_power_available.pct; }), backgroundColor: "#0f766e" },
            { label: "Stockout in last 3 months", data: stc.map(function (r) { return r.stockout_last_3_months.pct; }), backgroundColor: "#c5221f" },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } }, scales: { y: { max: 100, ticks: { callback: function (v) { return v + "%"; } } } } }
      });
    } };
  }

  // Rule-based scan (not a live AI call -- this dashboard is a fully
  // offline static file) of non-blank monitor remarks/comments from both
  // RCA and the Supervisory Checklist, tagged with district/UC, for a human
  // reviewer to work through. RCA and Supervisory stay independent domains
  // (never merged into one row), just listed together in one card.
  function monitorRemarksHtml(m) {
    var rcaRemarks = (m.rca.status === "ok" ? m.rca.monitor_remarks : []).map(function (r) {
      return { source: "RCA", field: "Comments", district: r.district, uc: r.uc, date: r.visit_date, remark: r.remark };
    });
    var supRemarks = (m.supervisory.status === "ok" ? m.supervisory.monitor_remarks : []).map(function (r) {
      return { source: "Supervisory Checklist", field: r.source_field, district: r.district, uc: r.uc, date: r.visit_date, remark: r.remark };
    });
    var all = rcaRemarks.concat(supRemarks);
    if (!all.length) {
      return '<div class="card"><h2>Key Remarks from Monitors</h2>' +
        '<p class="sub">Non-blank remarks from RCA and Supervisory Checklist visits, tagged with district/UC.</p>' +
        '<p class="sub">No remarks recorded in either dataset for this run.</p></div>';
    }
    var rows = all.map(function (r) {
      return "<tr><td>" + escHtml(r.source) + "</td><td>" + escHtml(r.district || "") + "</td><td>" + escHtml(r.uc || "") + "</td>" +
        "<td>" + escHtml(String(r.date || "").slice(0, 10)) + "</td><td>" + escHtml(r.field) + "</td><td>" + escHtml(r.remark) + "</td></tr>";
    }).join("");
    return '<div class="card"><h2>Key Remarks from Monitors</h2>' +
      '<p class="sub">' + nounFor(all.length, "non-blank remark") + " from RCA and Supervisory Checklist visits, tagged with district/UC -- a rule-based scan, not a live AI analysis. " +
      "Most current entries are brief acknowledgements (e.g. \"good work\") rather than substantive field observations; more detailed remarks will surface here automatically as they're recorded." + '</p>' +
      '<div class="table-scroll"><table><thead><tr><th>Source</th><th>District</th><th>UC</th><th>Date</th><th>Field</th><th>Remark</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div>';
  }

  // Structured "Analyze Monitor Remarks" panel. Deliberately NOT a live AI/
  // API call (no network access from a fully offline static file, and the
  // brief explicitly said to skip any API and pick the simplest approach) --
  // this is a deterministic keyword-rule scan over the exact same RCA
  // Comments / Supervisory Remarks fields as the "Key Remarks from Monitors"
  // table above, triggered on demand by a button rather than run
  // automatically, per the brief. It only ever reports text and
  // district/UC/date values that are already present in the source rows --
  // never a generated or inferred fact.
  var POSITIVE_REMARK_TERMS = ["good", "satisfactory", "adequate", "available", "functional", "well maintained",
    "well-maintained", "compliant", "cooperative", "trained", "no issue", "no gap", "no shortage", "sufficient",
    "excellent", "appreciat", "improved", "on track", "as per plan", "in order"];
  var ISSUE_REMARK_TERMS = ["shortage", "stockout", "stock out", "not available", "unavailable", "lack of", "lacking",
    "poor", "issue", "problem", "delay", "damaged", "non-functional", "not functional", "refus", "unaware",
    "hesitan", "resistance", "gap", "missing", "low turnout", "not trained", "untrained", "not working",
    "concern", "complaint", "insufficient", "no vaccine", "no fuel", "breakdown", "not maintained"];

  function collectMonitorRemarks(m) {
    var rcaRemarks = (m.rca.status === "ok" ? m.rca.monitor_remarks : []).map(function (r) {
      return { source: "RCA", field: "Comments", district: r.district, uc: r.uc, date: r.visit_date, remark: r.remark };
    });
    var supRemarks = (m.supervisory.status === "ok" ? m.supervisory.monitor_remarks : []).map(function (r) {
      return { source: "Supervisory Checklist", field: r.source_field, district: r.district, uc: r.uc, date: r.visit_date, remark: r.remark };
    });
    return rcaRemarks.concat(supRemarks);
  }

  // A short negation window immediately before a matched issue term (e.g.
  // "no any issue found", "not a problem") flips it to non-issue, rather
  // than a bare substring match miscategorizing an explicitly-negated
  // remark as a problem.
  var NEGATION_WORDS = ["no", "not", "none", "never", "zero", "without"];
  function isNegatedBefore(text, idx) {
    var before = text.slice(Math.max(0, idx - 24), idx);
    return NEGATION_WORDS.some(function (w) {
      return new RegExp("\\b" + w + "\\b\\s*(\\w+\\s+){0,2}$").test(before);
    });
  }
  function hasIssueTerm(text) {
    return ISSUE_REMARK_TERMS.some(function (t) {
      var idx = text.indexOf(t);
      return idx !== -1 && !isNegatedBefore(text, idx);
    });
  }

  function categorizeMonitorRemarks(all) {
    var insights = [], issues = [], other = [];
    all.forEach(function (r) {
      var text = String(r.remark || "").toLowerCase();
      var isIssue = hasIssueTerm(text);
      var isPositive = !isIssue && POSITIVE_REMARK_TERMS.some(function (t) { return text.indexOf(t) !== -1; });
      if (isIssue) issues.push(r);
      else if (isPositive) insights.push(r);
      else other.push(r);
    });

    var ucMap = {};
    all.forEach(function (r) {
      var key = (r.district || "Unknown district") + " / " + (r.uc || "Unknown UC");
      if (!ucMap[key]) ucMap[key] = { district: r.district || "Unknown district", uc: r.uc || "Unknown UC", source: r.source, issueCount: 0, insightCount: 0, remarkCount: 0 };
      ucMap[key].remarkCount++;
    });
    issues.forEach(function (r) { var key = (r.district || "Unknown district") + " / " + (r.uc || "Unknown UC"); if (ucMap[key]) ucMap[key].issueCount++; });
    insights.forEach(function (r) { var key = (r.district || "Unknown district") + " / " + (r.uc || "Unknown UC"); if (ucMap[key]) ucMap[key].insightCount++; });
    var ucDetails = Object.keys(ucMap).map(function (k) { return ucMap[k]; })
      .sort(function (a, b) { return b.issueCount - a.issueCount || b.remarkCount - a.remarkCount; });

    var followUp = ucDetails.filter(function (u) { return u.issueCount > 0; })
      .map(function (u) { return u.district + " -- " + u.uc + ": field follow-up recommended (" + nounFor(u.issueCount, "issue-flagged remark") + ")."; });

    return { insights: insights, issues: issues, other: other, ucDetails: ucDetails, followUp: followUp };
  }

    return '<div class="card"><h2>🔎 Analyze Monitor Remarks</h2>' +

      'Only analyzes text and district/UC values already present in the uploaded data; nothing is generated or inferred beyond what the remarks say.</p>' +
      (all.length

        : '<p class="sub">No monitor remarks available for AI analysis.</p>') +

  // ================= DIVISIONAL OFFICER & ADMIN COMPLIANCE =================
  // The source workbook is a per-officer administrative compliance
  // checklist TEMPLATE (a fixed set of tasks x a fixed set of officer
  // columns) -- direct inspection confirmed every officer cell in the file
  // received contains the literal placeholder text "Yes/No/NA", not a real
  // answer, and the "Remarks / Evidence" column holds a fixed descriptor of
  // what each task's evidence should look like, not a real per-period
  // remark (see admin_activities.py's module docstring). There is no date,
  // district, UC, or activity-type field anywhere in the source, so this
  // section deliberately has no time trend, geographic map, or
  // activity-type chart -- none of those are fabricated to fill space.
  // Per the user's explicit choice, this tab is a LIVE, FILLABLE checklist:
  // officer Yes/No/N-A selections are entered and saved in this browser
  // only (the same localStorage-backed pattern as every editable insight
  // box elsewhere on this dashboard, adminStatusValue below is that
  // pattern's read side), and every KPI/chart is computed live from
  // whatever has actually been marked -- they read as mostly "not yet
  // marked" until someone starts using the checklist, which is the honest
  // state, not a defect.
  //
  // Each task belongs to one of two compliance sections (the source
  // workbook's own "Section" column: "Divisional Officer" / "Admin
  // Section"), or to both ("Both" -- currently just "Other Assigned
  // Tasks"). A "Both" task is tracked as two independent checklist entries,
  // one per section (distinct localStorage keys, via the sectionKey
  // component below) -- deliberately not a single shared answer, since a
  // Divisional Officer's "other assigned tasks" and an Admin Section
  // officer's are different real-world work even though the source labels
  // both rows the same.
  var ADMIN_STATUS_OPTIONS = ["Yes", "No", "N/A"];
  var ADMIN_SECTION_DIVISIONAL = { key: "divisional", label: "Divisional Officer Compliance",
    match: function (t) { return t.section === "Divisional Officer" || t.section === "Both"; } };
  var ADMIN_SECTION_ADMIN = { key: "admin", label: "Admin Compliance",
    match: function (t) { return t.section === "Admin Section" || t.section === "Both"; } };

  function adminStatusKey(sectionKey, taskIndex, officerLabel) {
    return "epi-admin-status:" + sectionKey + ":" + taskIndex + ":" + officerLabel;
  }
  // A genuine source-provided answer (see _normalize_officer_cell in
  // admin_activities.py -- only a real "Yes"/"No"/"N/A", never the
  // placeholder phrase) is the starting value until this browser's own
  // selection overrides it.
  function adminStatusValue(task, sectionKey, taskIndex, officerLabel) {
    var stored = null;
    try { stored = localStorage.getItem(adminStatusKey(sectionKey, taskIndex, officerLabel)); } catch (e) {}
    if (stored !== null) return stored === "" ? null : stored;
    var sourceValue = task.officers[officerLabel];
    return (ADMIN_STATUS_OPTIONS.indexOf(sourceValue) !== -1) ? sourceValue : null;
  }

  function adminSectionEntries(a, sectionDef) {
    return a.tasks.map(function (t, i) { return { task: t, index: i }; }).filter(function (x) { return sectionDef.match(x.task); });
  }

  function adminChecklistSummaryForSection(a, sectionDef) {
    var entries = adminSectionEntries(a, sectionDef);
    var totalCells = 0, marked = 0, yes = 0, no = 0, na = 0;
    var byOfficer = {};
    a.officer_labels.forEach(function (o) { byOfficer[o] = { yes: 0, no: 0, na: 0, total: entries.length }; });
    entries.forEach(function (entry) {
      a.officer_labels.forEach(function (officerLabel) {
        totalCells++;
        var v = adminStatusValue(entry.task, sectionDef.key, entry.index, officerLabel);
        if (v === "Yes") { yes++; marked++; byOfficer[officerLabel].yes++; }
        else if (v === "No") { no++; marked++; byOfficer[officerLabel].no++; }
        else if (v === "N/A") { na++; marked++; byOfficer[officerLabel].na++; }
      });
    });
    return {
      entries: entries, taskCount: entries.length,
      totalCells: totalCells, marked: marked, notMarked: totalCells - marked,
      yes: yes, no: no, na: na,
      compliancePct: (yes + no) > 0 ? (yes / (yes + no) * 100) : null,
      byOfficer: byOfficer,
    };
  }

  // s (a prior adminChecklistSummaryForSection result) is optional -- the
  // caller may already have one on hand (renderAdminActivities does, for
  // its by-officer table); the Overview tab's executive-overview stack
  // doesn't and just lets this compute its own.
  function adminSectionKpiRow(a, sectionDef, s) {
    s = s || adminChecklistSummaryForSection(a, sectionDef);
    return [
      kpiCard("Tasks Tracked", fmtNum(s.taskCount), sectionDef.label),
      kpiCard("Items Marked", fmtNum(s.marked), "of " + fmtNum(s.totalCells) + " entries (" + s.taskCount + " tasks × " + a.officer_count + " officers)"),
      kpiCard("Compliance Rate", s.compliancePct === null ? "—" : fmtPct(s.compliancePct), s.compliancePct === null ? "No Yes/No entries marked yet" : fmtNum(s.yes) + " Yes of " + fmtNum(s.yes + s.no) + " Yes/No entries (N/A excluded)"),
      kpiCard("Not Yet Marked", fmtNum(s.notMarked), "of " + fmtNum(s.totalCells) + " entries"),
    ].join("");
  }

  function adminSectionOfficerTableHtml(a, s) {
    var rows = a.officer_labels.map(function (o) {
      var b = s.byOfficer[o];
      var notMarked = b.total - b.yes - b.no - b.na;
      return '<tr><td>' + escHtml(o) + '</td><td>' + fmtNum(b.yes) + '</td><td>' + fmtNum(b.no) + '</td><td>' + fmtNum(b.na) + '</td><td>' + fmtNum(notMarked) + '</td>' +
        '<td>' + ((b.yes + b.no) > 0 ? fmtPct(b.yes / (b.yes + b.no) * 100) : "—") + '</td></tr>';
    }).join("");
    return '<div class="table-scroll"><table><thead><tr><th>Officer</th><th>Yes</th><th>No</th><th>N/A</th><th>Not marked</th><th>Compliance</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function adminSectionTableHtml(a, sectionDef, s) {
    var rows = s.entries.map(function (entry) {
      var task = entry.task, i = entry.index;
      var officerCells = a.officer_labels.map(function (officerLabel) {
        var v = adminStatusValue(task, sectionDef.key, i, officerLabel);
        return '<td><select class="filter-select admin-status-select" data-section="' + sectionDef.key + '" data-task-index="' + i + '" data-officer="' + escHtml(officerLabel) + '">' +
          '<option value=""' + (v === null ? " selected" : "") + '>&mdash; Not marked &mdash;</option>' +
          ADMIN_STATUS_OPTIONS.map(function (opt) { return '<option value="' + opt + '"' + (v === opt ? " selected" : "") + '>' + opt + '</option>'; }).join("") +
          '</select></td>';
      }).join("");
      return '<tr><td>' + escHtml(task.task) + (task.section === "Both" ? ' <span class="badge neutral">shared task</span>' : '') + '</td>' +
        officerCells + '<td class="sub">' + escHtml(task.expected_evidence || "—") + '</td></tr>';
    }).join("");

      a.officer_labels.map(function (o) { return '<th>' + escHtml(o) + '</th>'; }).join("") +
      '<th>Expected Evidence</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

  // ---- Admin Compliance: tracked per TASK, not per officer -----------
  // Per the user's explicit correction: this checklist reflects one admin
  // person's own work, so a per-officer breakdown doesn't apply here (only
  // Divisional Officer Compliance keeps the officer columns). Each task
  // instead gets two independent fields: a 3-state completion status
  // (Completed / In Progress / Not Started -- clearer standard
  // project-tracking language than the source's old Yes/No/N-A idiom) and
  // a separate Yes/No "Verified by Supervisor" sign-off flag, since a task
  // being done and a task being reviewed are two different facts. Neither
  // field has a source-provided starting value (the source has no such
  // columns), so both start unmarked -- never fabricated.
  var ADMIN_COMPLETION_OPTIONS = ["Completed", "In Progress", "Not Started"];
  var ADMIN_VERIFIED_OPTIONS = ["Yes", "No"];

  function adminTaskCompletionKey(taskIndex) { return "epi-admin-task-completion:" + taskIndex; }
  function adminTaskVerifiedKey(taskIndex) { return "epi-admin-task-verified:" + taskIndex; }

  function adminTaskCompletionValue(taskIndex) {
    var stored = null;
    try { stored = localStorage.getItem(adminTaskCompletionKey(taskIndex)); } catch (e) {}
    return (stored && ADMIN_COMPLETION_OPTIONS.indexOf(stored) !== -1) ? stored : null;
  }
  function adminTaskVerifiedValue(taskIndex) {
    var stored = null;
    try { stored = localStorage.getItem(adminTaskVerifiedKey(taskIndex)); } catch (e) {}
    return (stored && ADMIN_VERIFIED_OPTIONS.indexOf(stored) !== -1) ? stored : null;
  }

  function adminComplianceSummary(a) {
    var entries = adminSectionEntries(a, ADMIN_SECTION_ADMIN);
    var completed = 0, inProgress = 0, notStarted = 0, completionMarked = 0;
    var verifiedYes = 0, verifiedNo = 0, verifiedMarked = 0;
    entries.forEach(function (entry) {
      var c = adminTaskCompletionValue(entry.index);
      if (c === "Completed") { completed++; completionMarked++; }
      else if (c === "In Progress") { inProgress++; completionMarked++; }
      else if (c === "Not Started") { notStarted++; completionMarked++; }
      var v = adminTaskVerifiedValue(entry.index);
      if (v === "Yes") { verifiedYes++; verifiedMarked++; }
      else if (v === "No") { verifiedNo++; verifiedMarked++; }
    });
    return {
      entries: entries, taskCount: entries.length,
      completed: completed, inProgress: inProgress, notStarted: notStarted,
      completionMarked: completionMarked, completionNotMarked: entries.length - completionMarked,
      verifiedYes: verifiedYes, verifiedNo: verifiedNo, verifiedMarked: verifiedMarked,
      verifiedNotMarked: entries.length - verifiedMarked,
    };
  }

  function adminComplianceKpiRow(a, s) {
    s = s || adminComplianceSummary(a);
    return [
      kpiCard("Tasks Tracked", fmtNum(s.taskCount), "Admin Compliance"),
      kpiCard("Completed", fmtNum(s.completed), s.taskCount ? countPct(s.completed, s.taskCount) + " of tasks" : ""),
      kpiCard("In Progress", fmtNum(s.inProgress), ""),
      kpiCard("Not Started", fmtNum(s.notStarted), ""),
      kpiCard("Verified by Supervisor", fmtNum(s.verifiedYes), "of " + fmtNum(s.verifiedMarked) + " reviewed (" + fmtNum(s.taskCount - s.verifiedMarked) + " not yet reviewed)"),
    ].join("");
  }

  function adminComplianceTableHtml(a, s) {
    var rows = s.entries.map(function (entry) {
      var task = entry.task, i = entry.index;
      var c = adminTaskCompletionValue(i);
      var v = adminTaskVerifiedValue(i);
      var completionSelect = '<select class="filter-select admin-completion-select" data-task-index="' + i + '">' +
        '<option value=""' + (c === null ? " selected" : "") + '>&mdash; Not marked &mdash;</option>' +
        ADMIN_COMPLETION_OPTIONS.map(function (opt) { return '<option value="' + opt + '"' + (c === opt ? " selected" : "") + '>' + opt + '</option>'; }).join("") +
        '</select>';
      var verifiedSelect = '<select class="filter-select admin-verified-select" data-task-index="' + i + '">' +
        '<option value=""' + (v === null ? " selected" : "") + '>&mdash; Not marked &mdash;</option>' +
        ADMIN_VERIFIED_OPTIONS.map(function (opt) { return '<option value="' + opt + '"' + (v === opt ? " selected" : "") + '>' + opt + '</option>'; }).join("") +
        '</select>';
      return '<tr><td>' + escHtml(task.task) + (task.section === "Both" ? ' <span class="badge neutral">shared task</span>' : '') + '</td>' +
        '<td>' + completionSelect + '</td><td>' + verifiedSelect + '</td><td class="sub">' + escHtml(task.expected_evidence || "—") + '</td></tr>';
    }).join("");
    return '<div class="table-scroll"><table><thead><tr><th>Task / Administrative Responsibility</th><th>Completion Status</th><th>Verified by Supervisor</th><th>Expected Evidence</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

  function renderQuality() {
    var el = document.getElementById("tab-quality");

    // comment for why this save/restore is needed.
    var searchWasFocused = document.activeElement && document.activeElement.id === "quality-search";
    var searchCursorPos = searchWasFocused ? document.activeElement.selectionStart : null;
    var rep = DATA.quality.coverage_report;
    var flagTiles = Object.keys(rep.flags_by_type || {}).map(function (k) {
      return diseaseKpiCard(k.replace(/_/g, " "), fmtNum(rep.flags_by_type[k]), "coverage domain");
    }).join("");
    var exclTiles = Object.keys(rep.exclusions_by_reason || {}).map(function (k) {
      return diseaseKpiCard("excluded", fmtNum(rep.exclusions_by_reason[k]), k);
    }).join("");

    var allFlags = DATA.quality.coverage_flags.concat(
      DATA.quality.vpd_flags.map(function (f) { return Object.assign({}, f, { level: f.level }); })
    );
    var types = Array.from(new Set(allFlags.map(function (f) { return f.flag_type; }))).sort();

    var pageSize = 50;
    var pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));

    var pageRows = filtered.slice(state.qualityPage * pageSize, (state.qualityPage + 1) * pageSize);

    var flagRowsHtml = pageRows.map(function (f) {
      // entity/detail ultimately come from an uploaded Excel file's cell

        "</td><td>" + escHtml(f.flag_type) + "</td><td>" + escHtml(f.detail || "") + "</td></tr>";

    var exclRowsHtml = DATA.quality.coverage_exclusions.map(function (r) {

    el.innerHTML =

      '<div class="card"><h2>Excluded rows</h2><div class="grid kpi-row">' + (exclTiles || "<p>None.</p>") + '</div>' +
        '<div class="table-scroll"><table><thead><tr><th>Period</th><th>Level</th><th>Entity</th><th>Reason</th></tr></thead><tbody>' + exclRowsHtml + '</tbody></table></div></div>' +
      '<div class="card"><h2>All flags (' + fmtNum(filtered.length) + ')</h2>' +
        '<div class="controls-row">' +
          '<label style="font-size:12.5px;">Flag type: </label><select class="filter-select" id="quality-type-filter">' + typeOptions + '</select>' +
          '<span class="print-only-filter">Flag type: ' + escHtml(state.qualityFilterType || "All flag types") + '</span>' +
          '<input type="text" class="search-box" placeholder="Search entity..." id="quality-search" value="' + escHtml(state.qualitySearch) + '">' +
          (state.qualitySearch ? '<span class="print-only-filter">Search: &ldquo;' + escHtml(state.qualitySearch) + '&rdquo;</span>' : "") +
        '</div>' +
        '<div class="table-scroll"><table><thead><tr><th>Period</th><th>Level</th><th>Entity</th><th>Flag type</th><th>Detail</th></tr></thead><tbody>' + flagRowsHtml + '</tbody></table></div>' +
        '<div class="pagination">' +
          '<button id="q-prev" ' + (state.qualityPage === 0 ? "disabled" : "") + '>Prev</button>' +
          '<span>Page ' + (state.qualityPage + 1) + ' of ' + pageCount + '</span>' +
          '<button id="q-next" ' + (state.qualityPage >= pageCount - 1 ? "disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>';

    document.getElementById("quality-type-filter").value = state.qualityFilterType;
    document.getElementById("quality-type-filter").addEventListener("change", function (e) {
      state.qualityFilterType = e.target.value; state.qualityPage = 0; renderQuality();
    });
    var qSearchBox = document.getElementById("quality-search");
    if (searchWasFocused) {
      qSearchBox.focus();
      qSearchBox.setSelectionRange(searchCursorPos, searchCursorPos);

    qSearchBox.addEventListener("input", function (e) {

    });
    document.getElementById("q-prev").addEventListener("click", function () { state.qualityPage--; renderQuality(); });
    document.getElementById("q-next").addEventListener("click", function () { state.qualityPage++; renderQuality(); });
  }
